<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wod.Wiki</title>
  <meta name="description" content="Wod.Wiki — write, run, and analyze your workouts. Query and explore your training data." />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Wod.Wiki" />
  <meta property="og:title" content="Wod.Wiki — workouts, notes, analytics" />
  <meta property="og:description" content="Wod.Wiki — write, run, and analyze your workouts. Query and explore your training data." />
  <meta property="og:url" content="https://wod.wiki/" />
  <meta property="og:image" content="https://wod.wiki/images/wod-wiki-logo-light.png" />
  <meta name="twitter:card" content="summary" />
  <script>
    // SPA fallback routing.
    // Store the intended path, then redirect to app root so index.html can boot
    // and BrowserRouter restores the original route.
    sessionStorage.setItem('spa-redirect', location.href);

    // GitHub project pages are hosted at /<repo>/ on *.github.io, but custom
    // domains are served from '/'.
    var isGithubIo = /\.github\.io$/i.test(location.hostname);
    var firstSegment = location.pathname.split('/').filter(Boolean)[0];
    var base = isGithubIo && firstSegment ? '/' + firstSegment + '/' : '/';

    location.replace(base);
  </script>
</head>
<body></body>
</html>
