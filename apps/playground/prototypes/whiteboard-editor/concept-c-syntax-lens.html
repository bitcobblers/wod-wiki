<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Concept C: Notched Syntax Lens &amp; Contextual Completion — WOD Wiki</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./shared.css" />
  <style>
    /* Ultra-calm rest status bar on active line */
    .calm-status-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
      padding: 4px 10px 8px 36px;
    }
    .stage-viewport[data-vp="mobile"] .calm-status-row {
      padding: 4px 8px 8px;
    }

    .calm-pill-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 11px;
      min-height: 30px;
      border-radius: var(--r-full);
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--fg-2);
      font-size: 12px;
      font-weight: 600;
    }
    .calm-pill-btn:hover {
      background: var(--primary-soft);
      border-color: var(--primary);
      color: var(--primary-active-fg);
    }
    .calm-pill-btn.has-warn {
      background: var(--m-warn-bg);
      border-color: var(--m-warn-bd);
      color: var(--m-warn);
    }
    .calm-pill-btn.has-err {
      background: var(--m-err-bg);
      border-color: var(--m-err-bd);
      color: var(--m-err);
    }

    /* Contextual Inline Input & Trigger Bar */
    .lens-raw-bar {
      padding: 10px 12px;
      border-bottom: 1px solid var(--border-soft);
      background: var(--card);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .lens-raw-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .lens-raw-input {
      flex: 1;
      min-width: 0;
      min-height: 38px;
      padding: 6px 10px;
      border-radius: var(--r-sm);
      border: 1px solid var(--field-border);
      background: var(--bg);
      font-family: var(--font-mono);
      font-size: 13px;
      color: var(--fg);
    }
    .lens-trigger-row {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px;
    }
    .trigger-hint-btn {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 3px 9px;
      min-height: 28px;
      border-radius: var(--r-full);
      border: 1px solid var(--border);
      background: var(--popover);
      font-family: var(--font-mono);
      font-size: 11.5px;
      font-weight: 600;
      color: var(--fg-2);
    }
    .trigger-hint-btn:hover {
      background: var(--primary-soft);
      border-color: var(--primary);
      color: var(--primary-active-fg);
    }

    /* Notched Spine Rail */
    .spine-rail-bar {
      background: var(--muted);
      border-bottom: 1px solid var(--border);
      padding: 8px 12px 0;
      display: flex;
      align-items: flex-end;
      gap: 6px;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .spine-rail-bar::-webkit-scrollbar {
      display: none;
    }

    .spine-tab {
      display: inline-flex;
      align-items: stretch;
      flex-shrink: 0;
      border-radius: 0;
      border: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
      background: var(--popover);
      color: var(--fg-2);
      position: relative;
      margin-bottom: -1px;
      transition: background-color 140ms ease, border-color 140ms ease;
    }
    .spine-tab:hover {
      background: var(--card);
      border-color: var(--field-border);
    }
    .spine-tab.is-active {
      background: var(--card);
      border-color: var(--primary);
      border-top: 2px solid var(--primary);
      border-bottom-color: var(--card);
      color: var(--primary-active-fg);
      z-index: 2;
    }
    .spine-tab.is-warn:not(.is-active) {
      background: var(--m-warn-bg);
      border-color: var(--m-warn-bd);
      color: var(--m-warn);
    }
    .spine-tab.is-err:not(.is-active) {
      background: var(--m-err-bg);
      border-color: var(--m-err-bd);
      color: var(--m-err);
    }

    .spine-tab-main {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 7px 11px;
      min-height: 36px;
      font-size: 12.5px;
      font-weight: 600;
      white-space: nowrap;
    }
    .spine-tab-remove {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0 8px 0 6px;
      border-left: 1px solid var(--border-soft);
      color: var(--muted-fg);
      min-width: 28px;
    }
    .spine-tab-remove:hover {
      background: rgba(38, 33, 28, 0.08);
      color: var(--fg);
    }

    .spine-add-tab {
      display: inline-flex;
      align-items: center;
      flex-shrink: 0;
      gap: 5px;
      padding: 7px 11px;
      min-height: 36px;
      border-radius: 0;
      border: 1px dashed var(--field-border);
      border-bottom: 1px solid var(--border);
      background: var(--popover);
      color: var(--primary);
      font-size: 12px;
      font-weight: 600;
      margin-bottom: -1px;
      white-space: nowrap;
    }
    .spine-add-tab.is-active {
      background: var(--card);
      border-style: solid;
      border-color: var(--primary);
      border-bottom-color: var(--card);
      color: var(--primary-active-fg);
      z-index: 2;
    }

    /* Lens Panel (Inline structural shelf on Desktop/Tablet, Sheet on Mobile) */
    .lens-card {
      margin: 4px 0 0;
      background: var(--card);
      border-top: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
      display: flex;
      flex-direction: column;
    }

    .completion-flyout {
      padding: 8px 12px;
      border-bottom: 1px solid var(--border-soft);
      background: var(--popover);
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .completion-title {
      font-size: 11.5px;
      font-weight: 700;
      color: var(--primary-active-fg);
      padding: 0 4px;
    }

    .block-overflow-menu {
      position: absolute;
      z-index: 70;
      width: 196px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--r-md);
      box-shadow: var(--shadow-float);
      padding: 6px;
      display: none;
      flex-direction: column;
      gap: 4px;
    }
    .block-overflow-menu.is-open {
      display: flex;
    }

    .stage-viewport[data-vp="mobile"] .spine-tab-main,
    .stage-viewport[data-vp="mobile"] .spine-tab-remove,
    .stage-viewport[data-vp="mobile"] .spine-add-tab,
    .stage-viewport[data-vp="mobile"] .calm-pill-btn,
    .stage-viewport[data-vp="mobile"] .trigger-hint-btn,
    .stage-viewport[data-vp="mobile"] .lens-raw-input {
      min-block-size: 44px;
      min-inline-size: 44px;
    }
    .stage-viewport[data-vp="mobile"] .lens-trigger-row {
      flex-wrap: nowrap;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .stage-viewport[data-vp="mobile"] .lens-trigger-row::-webkit-scrollbar {
      display: none;
    }
    .stage-viewport[data-vp="mobile"] .trigger-hint-btn {
      flex-shrink: 0;
    }

    @media (max-width: 767px), (pointer: coarse) {
      .spine-tab-main,
      .spine-tab-remove,
      .spine-add-tab,
      .calm-pill-btn,
      .trigger-hint-btn,
      .lens-raw-input {
        min-block-size: 44px;
        min-inline-size: 44px;
      }
      .lens-trigger-row {
        flex-wrap: nowrap;
        overflow-x: auto;
        scrollbar-width: none;
      }
      .lens-trigger-row::-webkit-scrollbar {
        display: none;
      }
      .trigger-hint-btn {
        flex-shrink: 0;
      }
    }
  </style>
</head>

      <div class="app-frame" id="app-frame">
        <header class="editor-topbar">
          <div class="editor-topbar-left">
            <span class="note-route-badge">/playground</span>
            <span class="note-doc-title" id="topbar-title">Tuesday Conditioning &amp; Strength</span>
          </div>
          <div class="editor-topbar-actions">
            <button type="button" class="btn btn-secondary mobile-only-btn" id="open-entities-btn">

  <script src="./shared-editor.js"></script>
  <script>
    (function () {
      var W = window.WhiteboardProto;
      var ctrl = W.createEditorController('emom');

      var ui = {
        vp: 'desktop',
        scen: 'emom',
        lensOpen: true,
        editorMode: 'token', // 'token' | 'add' | 'block' | 'wiki' | 'prose-tag' | 'fm-tag'
        activeTokenId: null,
        activeBlockIdx: 0,
        searchQuery: '',
        showAliasList: false,
        showCompletion: false,
        entitiesOpen: false,
        overflowBlockIdx: null,
        toastTimer: null
      };

      var stageEl = document.getElementById('stage-viewport');
      var appFrameEl = document.getElementById('app-frame');
      var topbarTitleEl = document.getElementById('topbar-title');
      var sidebarEl = document.getElementById('entity-sidebar');
      var noteCanvasEl = document.getElementById('note-canvas');
      var mobileLensSheet = document.getElementById('mobile-lens-sheet');
      var overflowMenu = document.getElementById('block-overflow-menu');
      var entitiesBackdrop = document.getElementById('entities-backdrop');
      var entitiesSheetBody = document.getElementById('entities-sheet-body');
      var entitiesBtnLabel = document.getElementById('entities-btn-label');
      var btnUndo = document.getElementById('btn-undo');
      var btnRedo = document.getElementById('btn-redo');
      var toastEl = document.getElementById('proto-toast');

      // Remove duplicate hidden empty button if present
      var dupEmpty = document.querySelector('[data-set-scen="empty"][style*="display:none"]');
      if (dupEmpty) dupEmpty.remove();

      document.getElementById('close-entities-btn').innerHTML = W.icons.x(16);
      btnUndo.innerHTML = W.icons.undo(16);
      btnRedo.innerHTML = W.icons.redo(16);

      function isMobileLayout() {
        return ui.vp === 'mobile' || window.innerWidth <= 767;
      }

      function showToast(msg) {
        if (!msg) return;
        toastEl.innerHTML = W.icons.check(14) + '<span>' + W.escapeHtml(msg) + '</span>';
        toastEl.classList.add('is-shown');
        clearTimeout(ui.toastTimer);
        ui.toastTimer = setTimeout(function () {
          toastEl.classList.remove('is-shown');
        }, 2200);
      }

      function getCurrentLineTokens() {
        var active = ctrl.getActiveParsed();
        return active ? active.parsed.tokens : [];
      }

      function findActiveToken() {
        var toks = getCurrentLineTokens();
        if (!toks.length) return null;
        for (var i = 0; i < toks.length; i++) {
          if (toks[i].id === ui.activeTokenId) return toks[i];
        }
        return toks[0];
      }

      function ensureDefaultSelection() {
        var cur = ctrl.getCursor();
        if (cur.kind === 'wod') {
          var toks = getCurrentLineTokens();
          if (ui.editorMode === 'token') {
            if (!toks.length) {
              ui.editorMode = 'add';
              ui.activeTokenId = null;
            } else if (!toks.some(function (t) { return t.id === ui.activeTokenId; })) {
              ui.activeTokenId = toks[0].id;
            }
          }
        } else if (cur.kind === 'prose') {
          if (ui.editorMode !== 'prose-tag' && ui.editorMode !== 'fm-tag') {
            ui.editorMode = 'wiki';
          }
        }
      }

      function detectContextualCompletion(rawText, isProse) {
        var cats = ctrl.getCatalogs();
        var doc = ctrl.getDoc();
        var txt = String(rawText || '');
        if (!txt) return null;

        // Rule 1: `# ` (hash + space) at start of WOD line -> Block Heading (never swallows #tag!)
        if (!isProse && /^#\s/.test(txt)) {
          return {
            title: 'Block Section Heading (# + space)',
            items: [{ label: 'Keep as block heading', code: txt, replaceWith: txt }]
          };
        }

        // Rule 2: `#` or `#partial` at start or mid-line -> live #tag completion!
        var tagMatch = /(?:^|\s)(#[a-zA-Z0-9-]*)$/.exec(txt);
        if (tagMatch) {
          var q = tagMatch[1].slice(1);
          var matches = cats.tags.filter(function (t) {
            return !q || t.slug.indexOf(q.toLowerCase()) !== -1;
          }).slice(0, 4);
          return {
            title: 'Wiki Tags (#)',
            items: matches.map(function (t) {
              return { label: '#' + t.slug, sub: t.desc, code: '#' + t.slug, replaceTail: tagMatch[1], insertVal: '#' + t.slug };
            })
          };
        }

        // Rule 3: `[[partial` -> live [[Wiki Note]] completion!
        var wikiMatch = /\[\[([^\]]*)$/.exec(txt);
        if (wikiMatch) {
          var wq = wikiMatch[1];
          var wMatches = W.searchWikiNotes(wq, cats).slice(0, 4);
          return {
            title: 'Wiki Links ([[note]])',
            items: wMatches.map(function (n) {
              return { label: n.title, sub: n.summary, code: '[[' + n.title + ']]', replaceTail: '[[' + wq, insertVal: '[[' + n.title + ']]' };
            })
          };
        }

        // Rule 4: `/` -> Workout block template completion!
        var slashMatch = /(?:^|\s)(\/[a-zA-Z0-9-]*)$/.exec(txt);
        if (!isProse && slashMatch) {
          var sq = slashMatch[1].slice(1).toLowerCase();
          var tMatches = W.TEMPLATES.filter(function (tpl) {
            return !sq || tpl.name.toLowerCase().indexOf(sq) !== -1 || tpl.id.indexOf(sq) !== -1;
          }).slice(0, 4);
          return {
            title: 'Workout Block Templates (/)',
            items: tMatches.map(function (tpl) {
              return { label: tpl.name, sub: tpl.desc, code: tpl.lines[0], templateId: tpl.id };
            })
          };
        }

        // Rule 5: Trailing word matching fuzzy effort/alias (e.g. `swing` -> `Kettlebell Swing`)
        var wordM = /(?:^|\s)([a-zA-Z]{2,})$/.exec(txt);
        if (!isProse && wordM) {
          var ew = wordM[1];
          var effs = W.searchEfforts(ew, doc.frontmatter.notebook, cats);
          var combined = effs.scoped.concat(effs.other);
          // Only show if not already exact match
          if (combined.length && combined[0].name.toLowerCase() !== ew.toLowerCase()) {
            return {
              title: 'Efforts & Aliases ("' + ew + '")',
              items: combined.slice(0, 4).map(function (ef) {
                return {
                  label: ef.name,
                  sub: ef.aliases.length ? ('Aliases: ' + ef.aliases.join(', ')) : ef.category,
                  code: ef.name,
                  replaceTail: ew,
                  insertVal: ef.name
                };
              })
            };
          }
        }

        return null;
      }

      function renderLensInnerHtml(isMobileSheet) {
        ensureDefaultSelection();
        var doc = ctrl.getDoc();
        var cats = ctrl.getCatalogs();
        var cur = ctrl.getCursor();
        var blk = doc.blocks[cur.blockIdx || 0];

        if (cur.kind === 'prose') {
          var pLine = doc.prose[cur.lineIdx] || '';
          var pComp = ui.showCompletion ? detectContextualCompletion(pLine, true) : null;
          var hasBold = /\*\*[^*]+\*\*/.test(pLine);
          var hasItalic = /(^|[^*])\*[^*]+\*([^*]|$)/.test(pLine);
          var hasStrike = /~~[^~]+~~/.test(pLine);
          var hasCode = /`[^`]+`/.test(pLine);

          var pSpine =
            '<button type="button" class="spine-tab' + (ui.editorMode === 'wiki' ? ' is-active' : '') + '" data-open-wiki="true"><span class="spine-tab-main">' + W.icons.wiki(13) + '<span>[[Wiki Link]]</span></span></button>' +
            '<button type="button" class="spine-tab' + (ui.editorMode === 'prose-tag' ? ' is-active' : '') + '" data-open-prose-tag="true"><span class="spine-tab-main">' + W.icons.tag(13) + '<span>#Tag</span></span></button>' +
            '<button type="button" class="spine-add-tab" data-prose-fmt="wrapTimeBlock">' + W.icons.blocks(13) + '<span>Wrap ```time</span></button>';

          var pFmtRow =
            '<div class="lens-raw-bar">' +
              '<div class="lens-raw-row">' +
                '<label class="visually-hidden" for="c-prose-input">Prose line text</label>' +
                '<input id="c-prose-input" type="text" class="lens-raw-input" data-role="c-prose-input" value="' + W.escapeHtml(pLine) + '" placeholder="Type prose with [[wiki links]] or #tags…" />' +
              '</div>' +
              '<div class="lens-trigger-row">' +
                '<button type="button" class="trigger-hint-btn' + (hasBold ? ' is-active' : '') + '" data-prose-fmt="bold">Bold</button>' +
                '<button type="button" class="trigger-hint-btn' + (hasItalic ? ' is-active' : '') + '" data-prose-fmt="italic">Italic</button>' +
                '<button type="button" class="trigger-hint-btn' + (hasStrike ? ' is-active' : '') + '" data-prose-fmt="strike">Strike</button>' +
                '<button type="button" class="trigger-hint-btn' + (hasCode ? ' is-active' : '') + '" data-prose-fmt="code">Code</button>' +
                '<button type="button" class="trigger-hint-btn" data-insert-trigger="[[">Type [[</button>' +
                '<button type="button" class="trigger-hint-btn" data-insert-trigger="#">Type #</button>' +
              '</div>' +
            '</div>';

          var compHtml = pComp ? renderCompletionBox(pComp) : '';
          var pBody = W.renderTokenEditorHtml({
            mode: ui.editorMode === 'prose-tag' ? 'prose-tag' : ui.editorMode === 'fm-tag' ? 'fm-tag' : 'wiki',
            block: blk,
            catalogs: cats,
            searchQuery: ui.searchQuery,
            hideHeader: true,
            hideFooter: true
          });

          return (
            pFmtRow +
            compHtml +
            '<div class="spine-rail-bar" role="tablist" aria-label="Prose wiki tools">' + pSpine + '</div>' +
            '<div style="' + (isMobileSheet ? 'flex:1;min-height:0;overflow-y:auto' : '') + '">' + pBody + '</div>' +
            renderLensFooter()
          );
        }

        // WOD Block Line Lens
        var lineText = blk ? (blk.lines[cur.lineIdx] || '') : '';
        var toks = getCurrentLineTokens();
        var activeTok = findActiveToken();
        var comp = ui.showCompletion ? detectContextualCompletion(lineText, false) : null;

        var rawBar =
          '<div class="lens-raw-bar">' +
            '<div class="lens-raw-row">' +
              '<label class="visually-hidden" for="c-wod-input">Workout line syntax</label>' +
              '<input id="c-wod-input" type="text" class="lens-raw-input" data-role="c-wod-input" value="' + W.escapeHtml(lineText) + '" placeholder="Type syntax, #, swing, or /template…" />' +
              '<button type="button" class="icon-btn" data-close-lens="true" aria-label="Close syntax lens" title="Close (Esc)">' + W.icons.x(15) + '</button>' +
            '</div>' +
            '<div class="lens-trigger-row">' +
              '<button type="button" class="trigger-hint-btn" data-insert-trigger="#"># Tag</button>' +
              '<button type="button" class="trigger-hint-btn" data-insert-trigger="swing">swing → Effort</button>' +
              '<button type="button" class="trigger-hint-btn" data-insert-trigger="/">/ Template</button>' +
              '<button type="button" class="trigger-hint-btn" data-insert-trigger="# "># Heading</button>' +
            '</div>' +
          '</div>';

        var spineHtml =
          '<button type="button" class="spine-add-tab' + (ui.editorMode === 'block' ? ' is-active' : '') + '" data-lens-block="true">' +
            W.icons.sliders(13) + '<span>Block</span>' +
          '</button>';

        toks.forEach(function (tok) {
          var chip = W.tokenChipLabel(tok);
          var isActTab = ui.editorMode === 'token' && activeTok && activeTok.id === tok.id;
          var cls = 'spine-tab' + (isActTab ? ' is-active' : '') + (tok.kind === 'unresolved' ? ' is-warn' : tok.kind === 'lintError' ? ' is-err' : '');
          spineHtml +=
            '<div class="' + cls + '">' +
              '<button type="button" class="spine-tab-main" data-pick-token="' + W.escapeHtml(tok.id) + '">' +
                W.icons[chip.icon](13) + '<span>' + W.escapeHtml(chip.text) + '</span>' +
              '</button>' +
              '<button type="button" class="spine-tab-remove" data-del-token="' + W.escapeHtml(tok.id) + '" aria-label="Delete ' + W.escapeHtml(tok.raw) + '">' + W.icons.x(12) + '</button>' +
            '</div>';
        });

        spineHtml +=
          '<button type="button" class="spine-add-tab' + (ui.editorMode === 'add' ? ' is-active' : '') + '" data-pick-add="true">' +
            W.icons.plus(13) + '<span>Add</span>' +
          '</button>';

        var bodyHtml = W.renderTokenEditorHtml({
          mode: ui.editorMode || 'token',
          token: activeTok,
          block: blk,
          catalogs: cats,
          activeNotebook: doc.frontmatter.notebook,
          searchQuery: ui.searchQuery,
          showAliasList: ui.showAliasList,
          hideHeader: true,
          hideFooter: true
        });

        return (
          rawBar +
          (comp ? renderCompletionBox(comp) : '') +
          '<div class="spine-rail-bar" role="tablist" aria-label="Notched syntax tokens">' + spineHtml + '</div>' +
          '<div style="' + (isMobileSheet ? 'flex:1;min-height:0;overflow-y:auto' : '') + '">' + bodyHtml + '</div>' +
          renderLensFooter()
        );
      }

      function renderCompletionBox(comp) {
        return (
          '<div class="completion-flyout" role="region" aria-label="Contextual completions">' +
            '<div class="completion-title">' + W.escapeHtml(comp.title) + '</div>' +
            '<div class="catalog-list">' +
              comp.items.map(function (it, idx) {
                return (
                  '<button type="button" class="option-row" data-apply-comp="' + idx + '">' +
                    '<span class="option-row-main"><span class="option-row-title">' + W.escapeHtml(it.label) + '</span>' +
                    (it.sub ? '<span class="option-row-sub">' + W.escapeHtml(it.sub) + '</span>' : '') +
                    '</span>' +
                    '<span class="option-row-code">' + W.escapeHtml(it.code) + '</span>' +
                  '</button>'
                );
              }).join('') +
            '</div>' +
          '</div>'
        );
      }

      function renderLensFooter() {
        return (
          '<div class="mobile-deck-footer">' +
            '<button type="button" class="btn btn-secondary" data-lens-act="undo"' + (!ctrl.canUndo() ? ' disabled' : '') + '>' + W.icons.undo(14) + '<span>Undo</span></button>' +
            '<button type="button" class="btn btn-secondary" data-lens-act="newline">' + W.icons.newline(14) + '<span>+ Line</span></button>' +
            '<button type="button" class="btn btn-secondary" data-lens-act="indent">' + W.icons.indent(14) + '<span>Indent</span></button>' +
            '<button type="button" class="btn btn-primary" data-close-lens="true"><span>Done</span></button>' +
          '</div>'
        );
      }

      function updateComposerLift() {
        if (isMobileLayout() && ui.lensOpen && mobileLensSheet.style.display !== 'none') {
          var h = mobileLensSheet.getBoundingClientRect().height || 340;
          appFrameEl.style.setProperty('--composer-lift', (Math.round(h) + 12) + 'px');
        } else {
          appFrameEl.style.setProperty('--composer-lift', '18px');
        }
      }

      function scrollActiveLineIntoView() {
        if (!isMobileLayout() || !ui.lensOpen) return;
        var activeLine = noteCanvasEl.querySelector('.wod-line-item.is-active, .prose-line-wrap.is-active');
        if (activeLine && typeof activeLine.scrollIntoView === 'function') {
          activeLine.scrollIntoView({ block: 'nearest', behavior: 'auto' });
        }
      }

      function renderCanvas() {
        var doc = ctrl.getDoc();
        var cats = ctrl.getCatalogs();
        var cur = ctrl.getCursor();
        var entities = W.collectNoteEntities(doc, cats);

        topbarTitleEl.textContent = doc.title;
        btnUndo.disabled = !ctrl.canUndo();
        btnRedo.disabled = !ctrl.canRedo();

        var warnTotal = entities.unresolved.length + entities.errors.length;
        entitiesBtnLabel.textContent = warnTotal > 0 ? ('Entities (' + warnTotal + ')') : 'Entities';

        sidebarEl.innerHTML = W.renderSidebarSectionsHtml(entities);
        entitiesSheetBody.innerHTML = W.renderSidebarSectionsHtml(entities);

        var html = '<h1 class="note-h1">' + W.escapeHtml(doc.title) + '</h1>';

        html +=
          '<section class="frontmatter-card" aria-label="Note properties">' +
            '<div class="fm-group">' +
              '<span class="fm-label">Notebook</span>' +
              '<span class="fm-pill">' + W.escapeHtml(doc.frontmatter.notebook) + '</span>' +
            '</div>' +
            '<div class="fm-group">' +
              '<span class="fm-label">Tags</span>' +
              doc.frontmatter.tags.map(function (t) {
                return '<button type="button" class="fm-pill is-tag" data-fm-toggle="' + W.escapeHtml(t) + '">' + W.escapeHtml(t) + ' ×</button>';
              }).join('') +
              '<button type="button" class="fm-pill is-add" data-open-fm-tags="true">+ Tag</button>' +
            '</div>' +
          '</section>';

        if (doc.prose.length) {
          html += '<section class="prose-block" aria-label="Note prose">';
          doc.prose.forEach(function (pLine, pIdx) {
            var isAct = cur.kind === 'prose' && cur.lineIdx === pIdx;
            html +=
              '<div class="prose-line-wrap' + (isAct ? ' is-active' : '') + '">' +
                '<button type="button" class="prose-line-btn" data-select-prose="' + pIdx + '">' + W.renderProseRunsHtml(pLine) + '</button>' +
                (isAct ? (
                  '<div class="calm-status-row" style="padding-left:6px">' +
                    '<button type="button" class="calm-pill-btn" data-open-lens="true">' + W.icons.sparkles(13) + '<span>' + (ui.lensOpen ? 'Editing Prose & Wiki' : 'Open Wiki & Format Lens') + '</span></button>' +
                  '</div>'
                ) : '') +
                (isAct && ui.lensOpen && !isMobileLayout() ? '<div class="lens-card" style="margin-left:0">' + renderLensInnerHtml(false) + '</div>' : '') +
              '</div>';
          });
          html += '</section>';
        }

        doc.blocks.forEach(function (blk, bIdx) {
          var compiled = W.compileBlockSummary(blk, cats);
          var dialectLabel = blk.dialect === 'time' ? 'TIMER' : blk.dialect === 'log' ? 'LOG' : 'QUERY';
          var isEmptyBlock = blk.lines.length === 1 && !blk.lines[0].trim();

          html +=
            '<section class="wod-block-card" aria-label="Workout script block ' + (bIdx + 1) + '">' +
              '<div class="wod-block-header">' +
                '<div class="wod-fence-group">' +
                  '<span class="wod-fence-mark">```' + W.escapeHtml(blk.dialect) + '</span>' +
                  '<button type="button" class="dialect-pill is-' + W.escapeHtml(blk.dialect) + '" data-open-block="' + bIdx + '">' +
                    W.icons.timer(13) + '<span>' + dialectLabel + '</span>' +
                  '</button>' +
                  '<button type="button" class="sport-pill" data-open-block="' + bIdx + '">' +
                    W.escapeHtml(blk.sport ? (':' + blk.sport) : ':sport') +
                  '</button>' +
                  '<span class="wod-summary-text tabular">' + compiled.nonEmptyLines + ' lines · ' + W.escapeHtml(compiled.durLabel) + '</span>' +
                '</div>' +
                '<div class="wod-cmd-group">' +
                  '<button type="button" class="btn btn-primary" data-cmd-play="' + bIdx + '">' + W.icons.play(13) + '<span>Play</span></button>' +
                  '<div class="wod-cmd-secondary">' +
                    '<button type="button" class="btn btn-secondary" data-cmd-toast="Shared workout">Share</button>' +
                    '<button type="button" class="btn btn-secondary" data-cmd-toast="Added to Today">+ Today</button>' +
                    '<button type="button" class="btn btn-secondary" data-cmd-toast="Scheduled">Schedule</button>' +
                  '</div>' +
                  '<button type="button" class="icon-btn wod-cmd-overflow" data-open-overflow="' + bIdx + '" aria-label="More block actions">' + W.icons.more(16) + '</button>' +
                '</div>' +
              '</div>';

          if (isEmptyBlock) {
            html +=
              '<div class="empty-starter-strip">' +
                '<div class="starter-prompt">Empty <code>```' + W.escapeHtml(blk.dialect) + '</code> block — start with a verified workout template:</div>' +
                '<div class="starter-chips">' +
                  W.TEMPLATES.slice(0, 5).map(function (tpl) {
                    return '<button type="button" class="choice-pill" data-quick-tpl="' + tpl.id + '" data-b="' + bIdx + '">' + W.icons.sparkles(13) + '<span>' + W.escapeHtml(tpl.name) + '</span></button>';
                  }).join('') +
                '</div>' +
              '</div>';
          }

          html += '<div class="wod-lines-list">';
          blk.lines.forEach(function (lineText, lIdx) {
            var isAct = cur.kind === 'wod' && cur.blockIdx === bIdx && cur.lineIdx === lIdx;
            var parsed = compiled.parsedLines[lIdx];
            var hasErr = parsed.errors.length > 0;
            var lineUnresolved = parsed.tokens.filter(function (t) { return t.kind === 'unresolved'; }).length;

            html +=
              '<div class="wod-line-item' + (isAct ? ' is-active' : '') + (hasErr ? ' has-error' : '') + '">' +
                '<button type="button" class="wod-line-btn" data-select-wod="' + bIdx + ':' + lIdx + '">' +
                  '<span class="wod-line-num tabular">' + (lIdx + 1) + '</span>' +
                  '<span class="wod-code-runs">' + W.renderWodCodeRunsHtml(lineText, parsed, (isAct && ui.lensOpen) ? ui.activeTokenId : null) + '</span>' +
                '</button>';

            if (isAct && !ui.lensOpen) {
              var statusCls = hasErr ? 'has-err' : (lineUnresolved ? 'has-warn' : '');
              var statusMsg = parsed.tokens.length + ' tokens' + (lineUnresolved ? ' · ' + lineUnresolved + ' unresolved' : '') + (hasErr ? ' · syntax error' : '');
              html +=
                '<div class="calm-status-row">' +
                  '<button type="button" class="calm-pill-btn ' + statusCls + '" data-open-lens="true">' +
                    W.icons.sparkles(13) + '<span>' + W.escapeHtml(statusMsg) + ' · Edit Line (Ctrl+.)</span>' +
                  '</button>' +
                '</div>';
            }

            if (isAct && parsed.errors.length) {
              parsed.errors.forEach(function (err) {
                html +=
                  '<div class="lint-banner" role="alert">' +
                    '<div class="lint-msg">' + W.icons.error(15) + '<span>' + W.escapeHtml(err.message) + '</span></div>' +
                    '<div class="lint-fixes">' +
                      err.fixes.map(function (fx) {
                        return '<button type="button" class="btn btn-primary" data-quick-fix="' + W.escapeHtml(err.token.id) + '" data-fix-val="' + W.escapeHtml(fx) + '">Fix: ' + W.escapeHtml(fx) + '</button>';
                      }).join('') +
                    '</div>' +
                  '</div>';
              });
            }

            if (isAct && ui.lensOpen && !isMobileLayout()) {
              html += '<div class="lens-card">' + renderLensInnerHtml(false) + '</div>';
            }

            html += '</div>';
          });
          html += '</div>';

          html +=
            '<div class="wod-block-footer">' +
              '<button type="button" class="btn btn-secondary" data-add-line="' + bIdx + '">' + W.icons.newline(13) + '<span>+ Line below</span></button>' +
              '<button type="button" class="btn btn-ghost" data-open-block="' + bIdx + '">' + W.icons.sliders(13) + '<span>Block &amp; Templates</span></button>' +
            '</div>';

          html += '</section>';
        });

        noteCanvasEl.innerHTML = html;
      }

      function renderMobileSheet() {
        if (!isMobileLayout() || !ui.lensOpen) {
          mobileLensSheet.style.display = 'none';
          updateComposerLift();
          return;
        }
        mobileLensSheet.innerHTML = renderLensInnerHtml(true);
        mobileLensSheet.style.display = 'flex';
        updateComposerLift();
      }

      function renderAll(opts) {
        renderCanvas();
        renderMobileSheet();
        if (opts && opts.scrollIntoView) scrollActiveLineIntoView();
      }

      function applyCompletionItem(idx) {
        var cur = ctrl.getCursor();
        var doc = ctrl.getDoc();
        var isProse = cur.kind === 'prose';
        var txt = isProse ? (doc.prose[cur.lineIdx] || '') : (doc.blocks[cur.blockIdx].lines[cur.lineIdx] || '');
        var comp = detectContextualCompletion(txt, isProse);
        if (!comp || !comp.items[idx]) return;
        var item = comp.items[idx];
        if (item.templateId) {
          ctrl.setRawLineText(cur.blockIdx, cur.lineIdx, '');
          ctrl.insertTemplate(cur.blockIdx, item.templateId);
          renderAll({ scrollIntoView: true });
          showToast('Inserted ' + item.label);
          return;
        }
        if (item.replaceTail && item.insertVal) {
          var nextTxt = txt.slice(0, txt.length - item.replaceTail.length) + item.insertVal + ' ';
          if (isProse) {
            doc.prose[cur.lineIdx] = nextTxt;
          } else {
            ctrl.setRawLineText(cur.blockIdx, cur.lineIdx, nextTxt);
          }
          renderAll({ scrollIntoView: true });
          showToast('Completed → ' + item.insertVal);
        }
      }

      document.addEventListener('click', function (e) {
        var vpBtn = e.target.closest('[data-set-vp]');
        if (vpBtn) {
          ui.vp = vpBtn.getAttribute('data-set-vp');
          document.querySelectorAll('[data-set-vp]').forEach(function (b) { b.classList.toggle('is-active', b === vpBtn); });
          stageEl.setAttribute('data-vp', ui.vp);
          renderAll({ scrollIntoView: true });
          return;
        }

        var scenBtn = e.target.closest('[data-set-scen]');
        if (scenBtn) {
          ui.scen = scenBtn.getAttribute('data-set-scen');
          document.querySelectorAll('[data-set-scen]').forEach(function (b) { b.classList.toggle('is-active', b === scenBtn); });
          ctrl.loadScenario(ui.scen);
          ui.activeTokenId = null;
          ui.editorMode = 'token';
          ui.lensOpen = true;
          ui.searchQuery = '';
          renderAll({ scrollIntoView: true });
          return;
        }

        var wodSel = e.target.closest('[data-select-wod]');
        if (wodSel) {
          var parts = wodSel.getAttribute('data-select-wod').split(':');
          ctrl.setCursor({ kind: 'wod', blockIdx: parseInt(parts[0], 10), lineIdx: parseInt(parts[1], 10) });
          ui.activeBlockIdx = parseInt(parts[0], 10);
          ui.activeTokenId = null;
          ui.editorMode = 'token';
          ui.lensOpen = true;
          renderAll({ scrollIntoView: true });
          return;
        }

        var proseSel = e.target.closest('[data-select-prose]');
        if (proseSel) {
          ctrl.setCursor({ kind: 'prose', lineIdx: parseInt(proseSel.getAttribute('data-select-prose'), 10) });
          ui.editorMode = 'wiki';
          ui.lensOpen = true;
          renderAll({ scrollIntoView: true });
          return;
        }

        if (e.target.closest('[data-open-lens]')) {
          ui.lensOpen = true;
          renderAll({ scrollIntoView: true });
          return;
        }
        if (e.target.closest('[data-close-lens]')) {
          ui.lensOpen = false;
          renderAll({ scrollIntoView: true });
          return;
        }

        var pickTok = e.target.closest('[data-pick-token]');
        if (pickTok) {
          ui.activeTokenId = pickTok.getAttribute('data-pick-token');
          ui.editorMode = 'token';
          ui.searchQuery = '';
          ui.showAliasList = false;
          renderAll({ scrollIntoView: true });
          return;
        }

        var delTok = e.target.closest('[data-del-token]');
        if (delTok) {
          var tdId = delTok.getAttribute('data-del-token');
          var toks = getCurrentLineTokens();
          var cd = ctrl.getCursor();
          for (var i = 0; i < toks.length; i++) {
            if (toks[i].id === tdId) {
              var rawD = toks[i].raw;
              ctrl.deleteToken(cd.blockIdx, cd.lineIdx, toks[i]);
              ui.activeTokenId = null;
              renderAll({ scrollIntoView: true });
              showToast('Removed ' + rawD);
              break;
            }
          }
          return;
        }

        if (e.target.closest('[data-pick-add]')) { ui.editorMode = 'add'; ui.searchQuery = ''; renderAll(); return; }
        if (e.target.closest('[data-lens-block]')) { ui.editorMode = 'block'; renderAll(); return; }

        var openBlk = e.target.closest('[data-open-block]');
        if (openBlk) {
          ui.activeBlockIdx = parseInt(openBlk.getAttribute('data-open-block'), 10);
          ctrl.setCursor({ kind: 'wod', blockIdx: ui.activeBlockIdx, lineIdx: ctrl.getCursor().lineIdx || 0 });
          ui.editorMode = 'block';
          ui.lensOpen = true;
          renderAll({ scrollIntoView: true });
          return;
        }

        if (e.target.closest('[data-open-wiki]')) { ui.editorMode = 'wiki'; ui.searchQuery = ''; renderAll(); return; }
        if (e.target.closest('[data-open-prose-tag]')) { ui.editorMode = 'prose-tag'; ui.searchQuery = ''; renderAll(); return; }
        if (e.target.closest('[data-open-fm-tags]')) {
          ctrl.setCursor({ kind: 'prose', lineIdx: 0 });
          ui.editorMode = 'fm-tag';
          ui.lensOpen = true;
          ui.searchQuery = '';
          renderAll({ scrollIntoView: true });
          return;
        }

        var fmToggle = e.target.closest('[data-fm-toggle]');
        if (fmToggle) {
          ctrl.toggleFrontmatterTag(fmToggle.getAttribute('data-fm-toggle'));
          renderAll({ scrollIntoView: true });
          showToast('Updated note tags');
          return;
        }

        var proseFmt = e.target.closest('[data-prose-fmt]');
        if (proseFmt) {
          var cp = ctrl.getCursor();
          if (cp.kind === 'prose') {
            ctrl.toggleMarkdownFormat(cp.lineIdx, proseFmt.getAttribute('data-prose-fmt'));
            renderAll({ scrollIntoView: true });
            showToast('Updated formatting');
          }
          return;
        }

        var trigBtn = e.target.closest('[data-insert-trigger]');
        if (trigBtn) {
          var trig = trigBtn.getAttribute('data-insert-trigger');
          var ct = ctrl.getCursor();
          if (ct.kind === 'prose') {
            ctrl.getDoc().prose[ct.lineIdx] = (ctrl.getDoc().prose[ct.lineIdx] || '') + ' ' + trig;
          } else {
            var curL = ctrl.getDoc().blocks[ct.blockIdx].lines[ct.lineIdx] || '';
            var nextL = (trig === '#' || trig === '# ') ? trig : (curL ? curL.replace(/\s+$/, '') + ' ' + trig : trig);
            ctrl.setRawLineText(ct.blockIdx, ct.lineIdx, nextL);
          }
          ui.showCompletion = true;
          renderAll({ scrollIntoView: true });
          var rIn = document.querySelector('[data-role="c-wod-input"], [data-role="c-prose-input"]');
          if (rIn) rIn.focus();
          return;
        }

        var compBtn = e.target.closest('[data-apply-comp]');
        if (compBtn) {
          applyCompletionItem(parseInt(compBtn.getAttribute('data-apply-comp'), 10));
          ui.showCompletion = false;
          renderAll({ scrollIntoView: true });
          return;
        }

        var qFix = e.target.closest('[data-quick-fix]');
        if (qFix) {
          var cf = ctrl.getCursor();
          var toks2 = getCurrentLineTokens();
          var tId = qFix.getAttribute('data-quick-fix');
          var fVal = qFix.getAttribute('data-fix-val');
          for (var j = 0; j < toks2.length; j++) {
            if (toks2[j].id === tId) {
              ctrl.replaceToken(cf.blockIdx, cf.lineIdx, toks2[j], fVal);
              renderAll({ scrollIntoView: true });
              showToast('Fixed → ' + fVal);
              break;
            }
          }
          return;
        }

        var qTpl = e.target.closest('[data-quick-tpl]');
        if (qTpl) {
          ctrl.insertTemplate(parseInt(qTpl.getAttribute('data-b'), 10), qTpl.getAttribute('data-quick-tpl'));
          ui.activeTokenId = null;
          ui.editorMode = 'token';
          renderAll({ scrollIntoView: true });
          showToast('Inserted template');
          return;
        }

        var addLn = e.target.closest('[data-add-line]');
        if (addLn) {
          var bi = parseInt(addLn.getAttribute('data-add-line'), 10);
          var c2 = ctrl.getCursor();
          var li = (c2.kind === 'wod' && c2.blockIdx === bi) ? c2.lineIdx : ctrl.getDoc().blocks[bi].lines.length - 1;
          ctrl.insertLineBelow(bi, li);
          ui.activeTokenId = null;
          ui.editorMode = 'add';
          ui.lensOpen = true;
          renderAll({ scrollIntoView: true });
          return;
        }

        var lensAct = e.target.closest('[data-lens-act]');
        if (lensAct) {
          var la = lensAct.getAttribute('data-lens-act');
          var cl = ctrl.getCursor();
          if (la === 'undo' && ctrl.undo()) { renderAll(); showToast('Undid last edit'); }
          else if (la === 'newline' && cl.kind === 'wod') {
            ctrl.insertLineBelow(cl.blockIdx, cl.lineIdx);
            ui.activeTokenId = null;
            ui.editorMode = 'add';
            renderAll({ scrollIntoView: true });
          } else if (la === 'indent' && cl.kind === 'wod') {
            ctrl.indentLine(cl.blockIdx, cl.lineIdx, 1);
            renderAll({ scrollIntoView: true });
          }
          return;
        }

        var overflowBtn = e.target.closest('[data-open-overflow]');
        if (overflowBtn) {
          var obIdx = parseInt(overflowBtn.getAttribute('data-open-overflow'), 10);
          if (ui.overflowBlockIdx === obIdx) {
            ui.overflowBlockIdx = null;
            overflowMenu.classList.remove('is-open');
          } else {
            ui.overflowBlockIdx = obIdx;
            var r = overflowBtn.getBoundingClientRect();
            var fr = appFrameEl.getBoundingClientRect();
            overflowMenu.style.top = (r.bottom - fr.top + 6) + 'px';
            overflowMenu.style.right = Math.max(10, fr.right - r.right) + 'px';
            overflowMenu.classList.add('is-open');
          }
          return;
        }
        var overflowCmd = e.target.closest('[data-overflow-cmd]');
        if (overflowCmd) {
          ui.overflowBlockIdx = null;
          overflowMenu.classList.remove('is-open');
          showToast(overflowCmd.getAttribute('data-overflow-cmd'));
          return;
        }

        var navDef = e.target.closest('[data-nav-define]');
        if (navDef) {
          ui.entitiesOpen = false;
          entitiesBackdrop.classList.remove('is-open');
          ctrl.setCursor({ kind: 'wod', blockIdx: parseInt(navDef.getAttribute('data-b'), 10), lineIdx: parseInt(navDef.getAttribute('data-l'), 10) });
          ui.activeTokenId = navDef.getAttribute('data-tid');
          ui.editorMode = 'token';
          ui.lensOpen = true;
          renderAll({ scrollIntoView: true });
          return;
        }
        var navToast = e.target.closest('[data-nav-toast]');
        if (navToast) { showToast(navToast.getAttribute('data-nav-toast')); return; }
        if (e.target.closest('[data-cmd-play]')) { showToast('Started live workout timer'); return; }
        var cmdToast = e.target.closest('[data-cmd-toast]');
        if (cmdToast) { showToast(cmdToast.getAttribute('data-cmd-toast')); return; }

        var edEl = e.target.closest('[data-ed]');
        if (edEl) {
          var edAct = edEl.getAttribute('data-ed');
          if (edAct === 'toggle-alias-list') { ui.showAliasList = !ui.showAliasList; renderAll(); return; }
          var curCtx = ctrl.getCursor();
          var tokCtx = ui.editorMode === 'token' ? findActiveToken() : null;
          var wasInsert = edAct === 'insert-token';
          var res = W.handleTokenEditorAction(ctrl, edEl, {
            mode: ui.editorMode,
            blockIdx: ui.activeBlockIdx || curCtx.blockIdx || 0,
            lineIdx: curCtx.lineIdx || 0,
            proseIdx: curCtx.lineIdx || 0,
            token: tokCtx
          });
          if (res.handled) {
            if (res.close) ui.editorMode = 'token';
            if (res.reselectRaw) {
              var ntoks = getCurrentLineTokens();
              if (wasInsert) {
                for (var k = ntoks.length - 1; k >= 0; k--) {
                  if (ntoks[k].raw === res.reselectRaw) { ui.activeTokenId = ntoks[k].id; ui.editorMode = 'token'; break; }
                }
              } else {
                for (var p = 0; p < ntoks.length; p++) {
                  if (ntoks[p].raw === res.reselectRaw) { ui.activeTokenId = ntoks[p].id; break; }
                }
              }
            }
            if (res.closeOnEmpty && !getCurrentLineTokens().length) ui.editorMode = 'add';
            ui.showAliasList = false;
            renderAll({ scrollIntoView: true });
            if (res.toast) showToast(res.toast);
          }
          return;
        }

        if (ui.overflowBlockIdx !== null && !e.target.closest('#block-overflow-menu')) {
          ui.overflowBlockIdx = null;
          overflowMenu.classList.remove('is-open');
        }
      });

      document.addEventListener('input', function (e) {
        if (e.target.matches('[data-ed="search-input"]')) {
          ui.searchQuery = e.target.value;
          var caret = e.target.selectionStart;
          renderAll({ scrollIntoView: true });
          var sIn = document.querySelector('[data-ed="search-input"]');
          if (sIn) { sIn.focus(); sIn.setSelectionRange(caret, caret); }
        } else if (e.target.matches('[data-role="c-wod-input"]')) {
          var cr = ctrl.getCursor();
          if (cr.kind === 'wod') {
            var pos = e.target.selectionStart;
            ui.showCompletion = true;
            ctrl.setRawLineText(cr.blockIdx, cr.lineIdx, e.target.value);
            renderAll({ scrollIntoView: true });
            var wIn = document.querySelector('[data-role="c-wod-input"]');
            if (wIn) { wIn.focus(); wIn.setSelectionRange(pos, pos); }
          }
        } else if (e.target.matches('[data-role="c-prose-input"]')) {
          var cp = ctrl.getCursor();
          if (cp.kind === 'prose') {
            var pPos = e.target.selectionStart;
            ui.showCompletion = true;
            ctrl.getDoc().prose[cp.lineIdx] = e.target.value;
            renderAll({ scrollIntoView: true });
            var pIn = document.querySelector('[data-role="c-prose-input"]');
            if (pIn) { pIn.focus(); pIn.setSelectionRange(pPos, pPos); }
          }
        }
      });

      document.getElementById('btn-undo').addEventListener('click', function () {
        if (ctrl.undo()) { renderAll(); showToast('Undid edit'); }
      });
      document.getElementById('btn-redo').addEventListener('click', function () {
        if (ctrl.redo()) { renderAll(); showToast('Redid edit'); }
      });
      document.getElementById('open-entities-btn').addEventListener('click', function () {
        ui.entitiesOpen = true;
        entitiesBackdrop.classList.add('is-open');
      });
      document.getElementById('close-entities-btn').addEventListener('click', function () {
        ui.entitiesOpen = false;
        entitiesBackdrop.classList.remove('is-open');
      });
      entitiesBackdrop.addEventListener('click', function (e) {
        if (e.target === entitiesBackdrop) {
          ui.entitiesOpen = false;
          entitiesBackdrop.classList.remove('is-open');
        }
      });
      document.getElementById('toggle-lens-btn').addEventListener('click', function () {
        ui.lensOpen = !ui.lensOpen;
        renderAll({ scrollIntoView: true });
      });

      document.addEventListener('keydown', function (e) {
        if ((e.ctrlKey || e.metaKey) && e.key === '.') {
          e.preventDefault();
          ui.lensOpen = !ui.lensOpen;
          renderAll({ scrollIntoView: true });
        }
        if (e.key === 'Escape') {
          if (ui.entitiesOpen) {
            ui.entitiesOpen = false;
            entitiesBackdrop.classList.remove('is-open');
          } else if (ui.lensOpen) {
            ui.lensOpen = false;
            renderAll({ scrollIntoView: true });
          }
        }
      });

      renderAll({ scrollIntoView: true });
    })();
  </script>
</body>
</html>
