<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Concept B: Zoned Grammar Track — WQL Composer Prototype</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./shared.css" />
  <style>
    /* Header compact zone summary chips */
    .zone-header-chips {
      flex: 1;
      min-width: 0;
      display: flex;
      align-items: center;
      gap: 6px;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .zone-header-chips::-webkit-scrollbar {
      display: none;
    }

    .zone-chip-btn {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 4px 10px;
      min-height: 30px;
      border-radius: var(--r-sm);
      border: 1px solid var(--border);
      background: var(--popover);
      font-size: 12px;
      color: var(--fg-2);
      white-space: nowrap;
      transition: border-color 140ms ease, background-color 140ms ease;
    }
    .zone-chip-btn:hover {
      background: var(--muted);
      border-color: var(--field-border);
    }
    .zone-chip-btn.is-active {
      background: var(--primary);
      border-color: var(--primary);
      color: var(--primary-fg);
    }
    .zone-chip-btn.is-implicit {
      border-style: dashed;
      color: var(--muted-fg);
      background: var(--card);
    }
    .zone-chip-btn.is-warn {
      background: var(--warn-bg);
      border-color: var(--warn-border);
      color: var(--warn-fg);
    }
    .zone-chip-k {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.03em;
      opacity: 0.85;
    }
    .zone-chip-v {
      font-family: var(--font-mono);
      font-size: 12px;
      font-weight: 600;
    }

    /* Desktop Scope Map Popover */
    .scope-map-popover {
      position: absolute;
      top: 60px;
      left: 20px;
      right: 20px;
      max-width: 960px;
      margin: 0 auto;
      z-index: 60;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--r-lg);
      box-shadow: var(--shadow-float);
      display: none;
      flex-direction: column;
      overflow: hidden;
    }
    .scope-map-popover.is-open {
      display: flex;
    }

    /* 4-Zone Grammar Track */
    .zone-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 8px;
      padding: 10px 14px;
      background: var(--bg);
      border-bottom: 1px solid var(--border);
    }

    .stage-viewport[data-vp="tablet"] .zone-grid {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }
    .stage-viewport[data-vp="mobile"] .zone-grid {
      grid-template-columns: 1fr;
      padding: 10px 12px;
    }
    @media (max-width: 767px) {
      .zone-grid {
        grid-template-columns: 1fr;
      }
    }

    .zone-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--r-sm);
      padding: 8px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      min-width: 0;
      transition: border-color 140ms ease, background-color 140ms ease;
    }
    .zone-card.is-zone-active {
      border-color: var(--primary);
      background: #f5f8fb;
    }
    .zone-card.is-zone-caret {
      border-color: var(--primary);
      background: var(--primary-soft);
    }

    .zone-card-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.04em;
      color: var(--muted-fg);
    }
    .zone-card.is-zone-active .zone-card-head,
    .zone-card.is-zone-caret .zone-card-head {
      color: var(--primary-active-fg);
    }

    .zone-slots {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
    }

    .implicit-slot-btn {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 4px 9px;
      min-height: 28px;
      border-radius: var(--r-full);
      border: 1px dashed var(--field-border);
      background: var(--popover);
      color: var(--fg-2);
      font-size: 12px;
      font-weight: 500;
    }
    .implicit-slot-btn:hover {
      border-style: solid;
      border-color: var(--primary);
      background: var(--primary-soft);
      color: var(--primary-active-fg);
    }
    .implicit-slot-btn.is-active {
      border-style: solid;
      border-color: var(--primary);
      background: var(--primary);
      color: var(--primary-fg);
    }

    .inspector-panel {
      background: var(--card);
      display: flex;
      flex-direction: column;
    }
  </style>
</head>
<body>
  <nav class="proto-bar" aria-label="Prototype controls">
    <div class="proto-bar-group">
      <a class="proto-back" href="./index.html">All Prototypes</a>
      <div class="proto-nav" role="navigation" aria-label="Concepts">
        <a href="./concept-a-anchored-rail.html">Concept A</a>
        <a href="./concept-b-clause-inspector.html" class="is-current">Concept B</a>
        <a href="./concept-c-focus-lens.html">Concept C</a>
      </div>
    </div>

    <div class="proto-bar-group">
      <div class="proto-seg" role="group" aria-label="Simulated viewport">
        <button type="button" class="is-active" data-set-vp="desktop">Desktop (1440)</button>
        <button type="button" data-set-vp="tablet">Tablet (768)</button>
        <button type="button" data-set-vp="mobile">Mobile (390)</button>
      </div>
      <div class="proto-seg" role="group" aria-label="Route preset">
        <button type="button" class="is-active" data-set-preset="journal">/journal</button>
        <button type="button" data-set-preset="efforts">/efforts</button>
        <button type="button" data-set-preset="notes">/notes</button>
        <button type="button" data-set-preset="dashboards">/dashboards</button>
      </div>
      <button type="button" class="proto-k-btn" id="open-palette-toolbar">
        <span>Palette</span>
        <span class="kbd-chip">⌘K</span>
      </button>
    </div>
  </nav>

  <div class="stage-outer">
    <div class="stage-viewport" id="stage-viewport" data-vp="desktop">
      <div class="app-frame" id="app-frame">
        <div class="app-scroll">
          <header class="view-header">
            <h1 class="view-title" id="view-title">Journal</h1>
            <div class="zone-header-chips desktop-only-controls" id="header-zone-chips" role="toolbar" aria-label="Query zones"></div>
            <div class="header-actions">
              <button type="button" class="btn btn-secondary desktop-only-controls" id="toggle-scope-map" aria-expanded="false">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><polygon points="12 2 2 7 12 12 22 7 12 2"/><polyline points="2 17 12 22 22 17"/><polyline points="2 12 12 17 22 12"/></svg>
                <span>Scope map</span>
              </button>
              <span class="status-pill is-ok desktop-only-controls tabular" id="header-status-pill">8 matches</span>
              <button type="button" class="icon-btn" id="open-palette-header" aria-label="Open command palette">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
              </button>
              <button type="button" class="btn btn-primary" id="new-entry-btn">+ New</button>
            </div>
          </header>

          <div id="advisory-container"></div>
          <main class="content-body" id="content-body"></main>
        </div>

        <!-- Mobile Bottom Thumb Dock -->
        <div class="mobile-thumb-dock">
          <button type="button" class="thumb-dock-btn" id="open-mobile-sheet" aria-label="Open query scope map">
            <span class="thumb-dock-summary">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><polygon points="12 2 2 7 12 12 22 7 12 2"/><polyline points="2 17 12 22 22 17"/><polyline points="2 12 12 17 22 12"/></svg>
              <span id="mobile-dock-text">Journal · Last 4w · By date</span>
            </span>
            <span class="thumb-dock-badge tabular" id="mobile-dock-count">8</span>
          </button>
        </div>

        <!-- Desktop Zoned Scope Map Popover -->
        <section class="scope-map-popover" id="scope-map-popover" role="dialog" aria-label="Zoned WQL Scope Map"></section>

        <!-- Mobile Sheet / Command Palette Overlay -->
        <div class="overlay-backdrop" id="overlay-backdrop" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
          <div class="overlay-dialog">
            <div class="sheet-header" id="sheet-header"></div>
            <div class="sheet-body" id="sheet-body"></div>
            <div class="sheet-footer" id="sheet-footer"></div>
          </div>
        </div>

        <div class="proto-toast" id="proto-toast" role="status" aria-live="polite"></div>
      </div>
    </div>
  </div>

  <script src="./shared-data.js"></script>
  <script>
    (function () {
      var W = window.WqlProto;

      var state = {
        vp: 'desktop',
        presetId: 'journal',
        committedQuery: W.cloneQuery(W.PRESETS.journal),
        draftQuery: null,
        desktopMapOpen: false,
        activeClauseId: null, // clause id | '__add__' | '__implicit_time__' | '__implicit_group__'
        caretClauseId: null,
        pickerSearch: '',
        overlayMode: null,    // null | 'mobile-scope' | 'palette'
        paletteTab: 'find',
        findText: '',
        findScopeActive: true,
        toastTimer: null
      };

      var stageEl = document.getElementById('stage-viewport');
      var appFrameEl = document.getElementById('app-frame');
      var viewTitleEl = document.getElementById('view-title');
      var headerZoneChips = document.getElementById('header-zone-chips');
      var toggleScopeMapBtn = document.getElementById('toggle-scope-map');
      var headerStatusEl = document.getElementById('header-status-pill');
      var advisoryContainer = document.getElementById('advisory-container');
      var contentBodyEl = document.getElementById('content-body');
      var scopeMapPopover = document.getElementById('scope-map-popover');
      var mobileDockText = document.getElementById('mobile-dock-text');
      var mobileDockCount = document.getElementById('mobile-dock-count');
      var overlayBackdrop = document.getElementById('overlay-backdrop');
      var sheetHeader = document.getElementById('sheet-header');
      var sheetBody = document.getElementById('sheet-body');
      var sheetFooter = document.getElementById('sheet-footer');
      var toastEl = document.getElementById('proto-toast');

      function activeQuery() {
        return state.draftQuery || state.committedQuery;
      }

      function isMobileContext() {
        return state.vp === 'mobile' || window.innerWidth <= 767;
      }

      function showToast(msg) {
        toastEl.innerHTML = W.icons.check(14) + '<span>' + W.escapeHtml(msg) + '</span>';
        toastEl.classList.add('is-shown');
        clearTimeout(state.toastTimer);
        state.toastTimer = setTimeout(function () { toastEl.classList.remove('is-shown'); }, 2400);
      }

      function zoneForClause(clause) {
        if (!clause) return null;
        return (W.CLAUSE_META[clause.type] || {}).zone || 'WHERE';
      }

      function renderZoneHeaderChips(q) {
        var whatClauses = q.clauses.filter(function (c) { return zoneForClause(c) === 'WHAT'; });
        var whereClauses = q.clauses.filter(function (c) { return zoneForClause(c) === 'WHERE'; });
        var timeClause = q.clauses.find(function (c) { return c.type === 'time'; });
        var groupClause = q.clauses.find(function (c) { return c.type === 'groupBy'; });

        var chips = [];
        whatClauses.forEach(function (c) {
          var disp = W.formatClauseDisplay(c);
          var isAct = state.desktopMapOpen && state.activeClauseId === c.id;
          chips.push(
            '<button type="button" class="zone-chip-btn' + (isAct ? ' is-active' : '') + '" data-action="open-zone-clause" data-clause-id="' + W.escapeHtml(c.id) + '">' +
              '<span class="zone-chip-k">' + W.escapeHtml(disp.key.toUpperCase()) + '</span>' +
              '<span class="zone-chip-v">' + W.escapeHtml(disp.val) + '</span>' +
            '</button>'
          );
        });

        if (whereClauses.length) {
          whereClauses.forEach(function (c) {
            var disp = W.formatClauseDisplay(c);
            var isAct = state.desktopMapOpen && state.activeClauseId === c.id;
            chips.push(
              '<button type="button" class="zone-chip-btn' + (isAct ? ' is-active' : '') + (c.ignored ? ' is-warn' : '') + '" data-action="open-zone-clause" data-clause-id="' + W.escapeHtml(c.id) + '">' +
                (c.ignored ? W.icons.alert(13) : '') +
                '<span class="zone-chip-k">WHERE</span>' +
                '<span class="zone-chip-v">' + W.escapeHtml(disp.key + ':' + disp.val) + '</span>' +
              '</button>'
            );
          });
        } else {
          chips.push(
            '<button type="button" class="zone-chip-btn is-implicit" data-action="open-zone-clause" data-clause-id="__add__">' +
              '<span class="zone-chip-k">WHERE</span>' +
              '<span class="zone-chip-v">+ Filter</span>' +
            '</button>'
          );
        }

        chips.push(
          '<button type="button" class="zone-chip-btn' + (!timeClause ? ' is-implicit' : '') + (state.desktopMapOpen && ((timeClause && state.activeClauseId === timeClause.id) || (!timeClause && state.activeClauseId === '__implicit_time__')) ? ' is-active' : '') + '" data-action="open-zone-clause" data-clause-id="' + (timeClause ? W.escapeHtml(timeClause.id) : '__implicit_time__') + '">' +
            '<span class="zone-chip-k">WHEN</span>' +
            '<span class="zone-chip-v">' + (timeClause ? W.escapeHtml(W.formatClauseDisplay(timeClause).val) : 'Any time') + '</span>' +
          '</button>'
        );

        chips.push(
          '<button type="button" class="zone-chip-btn' + (!groupClause ? ' is-implicit' : '') + (state.desktopMapOpen && ((groupClause && state.activeClauseId === groupClause.id) || (!groupClause && state.activeClauseId === '__implicit_group__')) ? ' is-active' : '') + '" data-action="open-zone-clause" data-clause-id="' + (groupClause ? W.escapeHtml(groupClause.id) : '__implicit_group__') + '">' +
            '<span class="zone-chip-k">GROUP</span>' +
            '<span class="zone-chip-v">' + (groupClause ? W.escapeHtml(groupClause.value) : 'None') + '</span>' +
          '</button>'
        );

        return chips.join('');
      }

      function renderSyntaxAndZonesHtml(q, rawInputId) {
        var tokens = W.serializeTokens(q);
        var wqlText = W.serializeWql(q);
        var activeClause = q.clauses.find(function (c) { return c.id === state.activeClauseId; });
        var caretClause = q.clauses.find(function (c) { return c.id === state.caretClauseId; });
        var activeZone = activeClause ? zoneForClause(activeClause) : (state.activeClauseId === '__add__' ? 'WHERE' : state.activeClauseId === '__implicit_time__' ? 'WHEN' : state.activeClauseId === '__implicit_group__' ? 'GROUP' : null);
        var caretZone = caretClause ? zoneForClause(caretClause) : null;

        var tokensHtml = tokens.map(function (t) {
          var isHi = t.clauseId && (t.clauseId === state.activeClauseId || t.clauseId === state.caretClauseId);
          var cls = 'wql-tok ' + t.tokenClass + (isHi ? ' is-highlighted' : '') + (t.warn ? ' is-warn-tok' : '');
          return t.clauseId
            ? '<button type="button" class="' + cls + '" data-action="token-select" data-clause="' + W.escapeHtml(t.clauseId) + '">' + W.escapeHtml(t.text) + '</button>'
            : '<span class="' + cls + '">' + W.escapeHtml(t.text) + '</span>';
        }).join('');

        function renderZoneSlotPill(c) {
          var disp = W.formatClauseDisplay(c);
          var meta = W.CLAUSE_META[c.type] || { removable: true };
          var isAct = state.activeClauseId === c.id;
          var isCaret = state.caretClauseId === c.id;
          var cls = 'split-pill' + (isAct ? ' is-active' : '') + (isCaret ? ' is-caret-match' : '') + (c.ignored ? ' is-warn' : '');
          return (
            '<div class="' + cls + '" data-pill-wrap="' + W.escapeHtml(c.id) + '">' +
              '<button type="button" class="split-pill-main" data-action="activate-slot" data-clause-id="' + W.escapeHtml(c.id) + '" aria-pressed="' + (isAct ? 'true' : 'false') + '">' +
                (c.ignored ? W.icons.alert(13) : '') +
                '<span class="pill-key">' + W.escapeHtml(disp.key) + ':</span>' +
                '<span class="pill-val">' + W.escapeHtml(disp.val) + '</span>' +
              '</button>' +
              (meta.removable ? '<button type="button" class="split-pill-remove" data-action="remove-clause" data-clause-id="' + W.escapeHtml(c.id) + '" aria-label="Remove ' + W.escapeHtml(disp.key) + '">' + W.icons.x(12) + '</button>' : '') +
            '</div>'
          );
        }

        var whatClauses = q.clauses.filter(function (c) { return zoneForClause(c) === 'WHAT'; });
        var whereClauses = q.clauses.filter(function (c) { return zoneForClause(c) === 'WHERE'; });
        var whenClauses = q.clauses.filter(function (c) { return zoneForClause(c) === 'WHEN'; });
        var groupClauses = q.clauses.filter(function (c) { return zoneForClause(c) === 'GROUP'; });

        var zones = [
          {
            key: 'WHAT',
            hint: q.kind === 'aggregate' ? 'Agg + Metric' : 'Entity head',
            html: whatClauses.map(renderZoneSlotPill).join('')
          },
          {
            key: 'WHERE',
            hint: whereClauses.length + ' filter(s)',
            html: whereClauses.map(renderZoneSlotPill).join('') +
              '<button type="button" class="add-filter-btn' + (state.activeClauseId === '__add__' ? ' is-active' : '') + '" data-action="activate-slot" data-clause-id="__add__">' + W.icons.plus(13) + '<span>Add filter</span></button>'
          },
          {
            key: 'WHEN',
            hint: 'Date window',
            html: whenClauses.length
              ? whenClauses.map(renderZoneSlotPill).join('')
              : '<button type="button" class="implicit-slot-btn' + (state.activeClauseId === '__implicit_time__' ? ' is-active' : '') + '" data-action="activate-slot" data-clause-id="__implicit_time__">' + W.icons.calendar(13) + '<span>Any time (implicit)</span></button>'
          },
          {
            key: 'GROUP',
            hint: 'Buckets',
            html: groupClauses.length
              ? groupClauses.map(renderZoneSlotPill).join('')
              : '<button type="button" class="implicit-slot-btn' + (state.activeClauseId === '__implicit_group__' ? ' is-active' : '') + '" data-action="activate-slot" data-clause-id="__implicit_group__">' + W.icons.layers(13) + '<span>No grouping</span></button>'
          }
        ];

        var zonesHtml = zones.map(function (z) {
          var cls = 'zone-card' + (activeZone === z.key ? ' is-zone-active' : '') + (caretZone === z.key ? ' is-zone-caret' : '');
          return (
            '<div class="' + cls + '" data-zone="' + z.key + '">' +
              '<div class="zone-card-head"><span>' + z.key + '</span><span style="font-weight:500">' + z.hint + '</span></div>' +
              '<div class="zone-slots">' + z.html + '</div>' +
            '</div>'
          );
        }).join('');

        return (
          '<div class="wql-token-strip">' +
            '<div class="wql-token-row">' +
              '<div class="wql-tokens-interactive" aria-label="Interactive WQL syntax map">' + tokensHtml + '</div>' +
              '<div class="wql-raw-input-wrap">' +
                '<input type="text" class="wql-raw-input" id="' + rawInputId + '" data-role="wql-raw-input" value="' + W.escapeHtml(wqlText) + '" aria-label="Edit raw WQL" />' +
              '</div>' +
            '</div>' +
            '<div class="wql-sync-hint">Hover or move caret in raw WQL to highlight the exact token and zone slot below (e.g. sum vs totalVolume).</div>' +
          '</div>' +
          '<div class="zone-grid">' + zonesHtml + '</div>'
        );
      }

      function renderInspectorHtml(q) {
        if (!state.activeClauseId) {
          return '<div style="padding:12px 16px;font-size:12.5px;color:var(--muted-fg)">Select any zone slot or WQL token above to inspect and edit its options.</div>';
        }
        if (state.activeClauseId === '__implicit_time__') {
          return W.renderPickerBodyHtml({
            clause: { id: '__implicit_time__', type: 'time', value: 'all', excluded: false },
            clauseIdx: q.clauses.length,
            totalClauses: q.clauses.length + 1,
            search: state.pickerSearch
          });
        }
        if (state.activeClauseId === '__implicit_group__') {
          return W.renderPickerBodyHtml({
            clause: { id: '__implicit_group__', type: 'groupBy', value: 'date', excluded: false },
            clauseIdx: q.clauses.length,
            totalClauses: q.clauses.length + 1,
            search: state.pickerSearch
          });
        }
        var clause = state.activeClauseId === '__add__' ? null : q.clauses.find(function (c) { return c.id === state.activeClauseId; });
        var idx = clause ? q.clauses.indexOf(clause) : -1;
        return W.renderPickerBodyHtml({
          clause: clause,
          clauseIdx: idx,
          totalClauses: q.clauses.length,
          search: state.pickerSearch
        });
      }

      function renderView() {
        var preset = W.PRESETS[state.presetId];
        var q = state.committedQuery;
        var items = W.filterItems(q, '');
        var ignored = W.getIgnoredClauses(q);

        viewTitleEl.textContent = preset.title;
        headerZoneChips.innerHTML = renderZoneHeaderChips(q);
        toggleScopeMapBtn.classList.toggle('is-active', state.desktopMapOpen);
        toggleScopeMapBtn.setAttribute('aria-expanded', state.desktopMapOpen ? 'true' : 'false');

        if (ignored.length > 0) {
          headerStatusEl.className = 'status-pill is-warn desktop-only-controls tabular';
          headerStatusEl.textContent = ignored.length + ' ignored';
        } else {
          headerStatusEl.className = 'status-pill is-ok desktop-only-controls tabular';
          headerStatusEl.textContent = items.length + (q.kind === 'aggregate' ? ' sessions' : ' matches');
        }

        if (ignored.length > 0) {
          advisoryContainer.innerHTML =
            '<div class="advisory-strip">' +
              '<div class="advisory-strip-msg">' + W.icons.alert(15) + '<span>' + ignored.length + ' filter(s) ignored on <code>:effort</code> (equipment, quality).</span></div>' +
              '<button type="button" class="btn btn-warn" data-action="remove-all-ignored">Remove ignored (' + ignored.length + ')</button>' +
            '</div>';
        } else {
          advisoryContainer.innerHTML = '';
        }

        contentBodyEl.innerHTML =
          '<div class="results-summary-bar">' +
            '<span>Showing <strong style="color:var(--fg)" class="tabular">' + items.length + '</strong> of ' + W.SAMPLE_ITEMS.length + ' entries</span>' +
            '<span class="mono" style="font-size:12px">' + W.escapeHtml(W.serializeWql(q)) + '</span>' +
          '</div>' +
          W.renderSampleResultsHtml(q, items);

        mobileDockText.textContent = W.humanSummary(q, preset.title);
        mobileDockCount.textContent = String(items.length);

        if (state.desktopMapOpen && !state.overlayMode && !isMobileContext()) {
          scopeMapPopover.classList.add('is-open');
          var rawInp = document.getElementById('scope-map-raw-input');
          var hadFocus = rawInp && document.activeElement === rawInp;
          var pos = hadFocus ? rawInp.selectionStart : null;
          scopeMapPopover.innerHTML =
            '<div style="display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border-bottom:1px solid var(--border);background:var(--card)">' +
              '<strong style="font-size:13.5px">WQL Scope Map — ' + W.escapeHtml(preset.title) + '</strong>' +
              '<button type="button" class="icon-btn" data-action="close-scope-map" aria-label="Close Scope Map">' + W.icons.x(15) + '</button>' +
            '</div>' +
            renderSyntaxAndZonesHtml(q, 'scope-map-raw-input') +
            '<div class="inspector-panel">' + renderInspectorHtml(q) + '</div>';
          if (hadFocus) {
            var r = document.getElementById('scope-map-raw-input');
            if (r) { r.focus(); if (pos !== null) r.setSelectionRange(pos, pos); }
          }
        } else {
          scopeMapPopover.classList.remove('is-open');
          scopeMapPopover.innerHTML = '';
        }

        renderOverlay();
      }

      function renderOverlay() {
        if (!state.overlayMode) {
          overlayBackdrop.classList.remove('is-open');
          return;
        }
        overlayBackdrop.classList.add('is-open');
        var preset = W.PRESETS[state.presetId];
        var q = activeQuery();
        var items = W.filterItems(q, state.paletteTab === 'find' ? state.findText : '');

        if (state.overlayMode === 'mobile-scope') {
          sheetHeader.innerHTML =
            '<div class="sheet-header-row">' +
              '<h2 class="sheet-title" id="sheet-title">Scope Map — ' + W.escapeHtml(preset.title) + '</h2>' +
              '<button type="button" class="icon-btn" data-action="dismiss-overlay" aria-label="Close scope map">' + W.icons.x(16) + '</button>' +
            '</div>';
          sheetBody.style.padding = '0';
          sheetBody.innerHTML =
            renderSyntaxAndZonesHtml(q, 'sheet-scope-raw-input') +
            '<div class="inspector-panel">' + renderInspectorHtml(q) + '</div>';
          sheetFooter.innerHTML =
            '<span class="tabular" style="font-size:12.5px;color:var(--muted-fg)">' + items.length + ' matches</span>' +
            '<div class="sheet-footer-actions">' +
              '<button type="button" class="btn btn-secondary" data-action="dismiss-overlay">Cancel</button>' +
              '<button type="button" class="btn btn-primary" data-action="apply-overlay">Apply · ' + items.length + '</button>' +
            '</div>';
          return;
        }

        sheetBody.style.padding = state.paletteTab === 'wql' ? '0' : '12px 16px';
        sheetHeader.innerHTML =
          '<div class="sheet-header-row">' +
            '<h2 class="sheet-title" id="sheet-title">Command Palette</h2>' +
            '<div style="display:flex;align-items:center;gap:8px">' +
              '<div class="proto-seg" role="tablist">' +
                '<button type="button" role="tab" aria-selected="' + (state.paletteTab === 'find') + '" class="' + (state.paletteTab === 'find' ? 'is-active' : '') + '" data-action="set-palette-tab" data-tab="find">Find</button>' +
                '<button type="button" role="tab" aria-selected="' + (state.paletteTab === 'wql') + '" class="' + (state.paletteTab === 'wql' ? 'is-active' : '') + '" data-action="set-palette-tab" data-tab="wql">WQL</button>' +
              '</div>' +
              '<button type="button" class="icon-btn" data-action="dismiss-overlay" aria-label="Close palette">' + W.icons.x(16) + '</button>' +
            '</div>' +
          '</div>' +
          (state.paletteTab === 'find'
            ? '<div class="find-box">' +
                W.icons.search(16) +
                '<input type="text" id="palette-find-input" value="' + W.escapeHtml(state.findText) + '" placeholder="Search workouts, notes, movements… (type : for WQL)" aria-label="Find records" />' +
                (state.findScopeActive
                  ? '<span class="scope-chip"><span>' + W.escapeHtml(preset.defaultScopeLabel) + '</span><button type="button" data-action="clear-find-scope" aria-label="Clear scope">' + W.icons.x(12) + '</button></span>'
                  : '') +
              '</div>'
            : '');

        if (state.paletteTab === 'find') {
          var pool = state.findScopeActive ? items : W.SAMPLE_ITEMS;
          sheetBody.innerHTML =
            '<div style="display:flex;flex-direction:column;gap:6px">' +
              '<div class="option-group-title">' + (state.findScopeActive ? W.escapeHtml(preset.title) + ' matches' : 'All workspace entries') + '</div>' +
              W.renderPaletteResultsHtml(pool, state.findText) +
            '</div>';
          sheetFooter.innerHTML =
            '<span style="font-size:12px;color:var(--muted-fg)">Plain text search · Type <code>:</code> for WQL</span>' +
            '<div class="sheet-footer-actions"><button type="button" class="btn btn-secondary" data-action="dismiss-overlay">Close</button></div>';
        } else {
          sheetBody.innerHTML =
            renderSyntaxAndZonesHtml(q, 'palette-scope-raw-input') +
            '<div class="inspector-panel">' + renderInspectorHtml(q) + '</div>' +
            (!state.activeClauseId || !isMobileContext()
              ? '<div style="padding:12px 14px;border-top:1px solid var(--border);display:flex;flex-direction:column;gap:6px">' +
                  '<div class="option-group-title">Matching results (' + items.length + ')</div>' +
                  W.renderPaletteResultsHtml(items, '') +
                '</div>'
              : '');
          sheetFooter.innerHTML =
            '<span class="tabular" style="font-size:12.5px;color:var(--muted-fg)">' + items.length + ' matches</span>' +
            '<div class="sheet-footer-actions">' +
              '<button type="button" class="btn btn-secondary" data-action="dismiss-overlay">Cancel</button>' +
              '<button type="button" class="btn btn-primary" data-action="apply-overlay">Apply to ' + W.escapeHtml(preset.title) + '</button>' +
            '</div>';
        }
      }

      function focusSlot(clauseId) {
        var root = state.overlayMode ? sheetBody : scopeMapPopover;
        var el = root.querySelector('[data-pill-wrap="' + clauseId + '"] .split-pill-main, [data-clause-id="' + clauseId + '"]');
        if (el) el.focus();
      }

      function focusInspectorSearch() {
        var root = state.overlayMode ? sheetBody : scopeMapPopover;
        var inp = root.querySelector('[data-role="picker-search"], [data-role="free-text-val"]');
        if (inp) inp.focus();
      }

      function mutateQuery(fn) {
        var q = activeQuery();
        fn(q);
        W.updateIgnoredFlags(q);
        renderView();
      }

      function stepClause(delta) {
        var q = activeQuery();
        if (!q.clauses.length) return;
        var idx = q.clauses.findIndex(function (c) { return c.id === state.activeClauseId; });
        var next = idx === -1 ? 0 : (idx + delta + q.clauses.length) % q.clauses.length;
        state.activeClauseId = q.clauses[next].id;
        state.pickerSearch = '';
        renderView();
        focusInspectorSearch();
      }

      function syncCaret(inputEl) {
        var pos = inputEl.selectionStart || 0;
        var q = activeQuery();
        var tokens = W.serializeTokens(q);
        var matchId = W.clauseAtOffset(tokens, pos);
        if (matchId !== state.caretClauseId) {
          state.caretClauseId = matchId;
          var root = state.overlayMode ? sheetBody : scopeMapPopover;
          var matchClause = q.clauses.find(function (c) { return c.id === matchId; });
          var matchZone = matchClause ? zoneForClause(matchClause) : null;
          Array.prototype.forEach.call(root.querySelectorAll('.wql-tok[data-clause]'), function (t) {
            t.classList.toggle('is-highlighted', t.getAttribute('data-clause') === matchId);
          });
          Array.prototype.forEach.call(root.querySelectorAll('[data-pill-wrap]'), function (p) {
            p.classList.toggle('is-caret-match', p.getAttribute('data-pill-wrap') === matchId);
          });
          Array.prototype.forEach.call(root.querySelectorAll('.zone-card[data-zone]'), function (z) {
            z.classList.toggle('is-zone-caret', z.getAttribute('data-zone') === matchZone);
          });
        }
      }

      function openOverlay(mode, tab) {
        state.overlayMode = mode;
        state.draftQuery = W.cloneQuery(state.committedQuery);
        state.desktopMapOpen = false;
        state.activeClauseId = mode === 'mobile-scope' ? state.draftQuery.clauses[0].id : null;
        state.pickerSearch = '';
        if (tab) state.paletteTab = tab;
        renderView();
        if (mode === 'palette' && state.paletteTab === 'find') {
          var fi = document.getElementById('palette-find-input');
          if (fi) fi.focus();
        }
      }

      function dismissOverlay() {
        state.overlayMode = null;
        state.draftQuery = null;
        state.activeClauseId = null;
        renderView();
      }

      function applyOverlay() {
        if (state.draftQuery) state.committedQuery = W.cloneQuery(state.draftQuery);
        dismissOverlay();
        showToast('Applied query to ' + W.PRESETS[state.presetId].title);
      }

      appFrameEl.addEventListener('click', function (e) {
        var target = e.target.closest('[data-action]');
        if (!target) {
          if (state.desktopMapOpen && !e.target.closest('#scope-map-popover') && !e.target.closest('#header-zone-chips') && !e.target.closest('#toggle-scope-map')) {
            state.desktopMapOpen = false;
            state.activeClauseId = null;
            renderView();
          }
          return;
        }

        var action = target.getAttribute('data-action');
        if (action === 'open-zone-clause') {
          var cid = target.getAttribute('data-clause-id');
          if (state.desktopMapOpen && state.activeClauseId === cid) {
            state.desktopMapOpen = false;
            state.activeClauseId = null;
          } else {
            state.desktopMapOpen = true;
            state.activeClauseId = cid;
            state.pickerSearch = '';
          }
          renderView();
          if (state.desktopMapOpen) focusInspectorSearch();
        } else if (action === 'close-scope-map') {
          state.desktopMapOpen = false;
          state.activeClauseId = null;
          renderView();
        } else if (action === 'activate-slot' || action === 'token-select') {
          var sid = target.getAttribute('data-clause-id') || target.getAttribute('data-clause');
          state.activeClauseId = sid;
          state.pickerSearch = '';
          renderView();
          focusInspectorSearch();
        } else if (action === 'close-picker') {
          var prevId = state.activeClauseId;
          state.activeClauseId = null;
          renderView();
          if (prevId) focusSlot(prevId);
        } else if (action === 'step-prev') {
          stepClause(-1);
        } else if (action === 'step-next') {
          stepClause(1);
        } else if (action === 'remove-clause') {
          var rid = target.getAttribute('data-clause-id');
          mutateQuery(function (q) { q.clauses = q.clauses.filter(function (c) { return c.id !== rid; }); });
          if (state.activeClauseId === rid) state.activeClauseId = null;
          renderView();
        } else if (action === 'remove-all-ignored') {
          mutateQuery(function (q) {
            var ids = W.getIgnoredClauses(q).map(function (c) { return c.id; });
            q.clauses = q.clauses.filter(function (c) { return ids.indexOf(c.id) === -1; });
            if (ids.indexOf(state.activeClauseId) !== -1) state.activeClauseId = null;
          });
          showToast('Removed ignored filters');
        } else if (action === 'pick-option') {
          var val = target.getAttribute('data-value');
          if (state.activeClauseId === '__implicit_time__' || state.activeClauseId === '__implicit_group__') {
            var newType = state.activeClauseId === '__implicit_time__' ? 'time' : 'groupBy';
            var nid = 'c-' + newType;
            mutateQuery(function (q) {
              q.clauses.push({ id: nid, type: newType, value: val, excluded: false });
            });
            state.activeClauseId = nid;
            renderView();
            focusSlot(nid);
            return;
          }
          mutateQuery(function (q) {
            var cl = q.clauses.find(function (c) { return c.id === state.activeClauseId; });
            if (cl) cl.value = val;
          });
          focusSlot(state.activeClauseId);
        } else if (action === 'pick-add-filter') {
          var ft = target.getAttribute('data-filter-type');
          var dv = target.getAttribute('data-default-val');
          var createdId = 'c-' + ft + '-' + Date.now();
          mutateQuery(function (q) {
            var ex = q.clauses.find(function (c) { return c.type === ft; });
            if (ex) createdId = ex.id;
            else q.clauses.push({ id: createdId, type: ft, value: dv, excluded: false });
          });
          state.activeClauseId = createdId;
          state.pickerSearch = '';
          renderView();
          focusInspectorSearch();
        } else if (action === 'apply-custom-dates') {
          var root = state.overlayMode ? sheetBody : scopeMapPopover;
          var sVal = (root.querySelector('[data-role="date-start"]') || {}).value || '';
          var eVal = (root.querySelector('[data-role="date-end"]') || {}).value || '';
          if (!sVal || !eVal || sVal > eVal) {
            showToast('Start date must be on or before End date');
            return;
          }
          if (state.activeClauseId === '__implicit_time__') {
            mutateQuery(function (q) {
              q.clauses.push({ id: 'c-time', type: 'time', value: 'from ' + sVal + ' to ' + eVal, startDate: sVal, endDate: eVal });
            });
            state.activeClauseId = 'c-time';
          } else {
            mutateQuery(function (q) {
              var cl = q.clauses.find(function (c) { return c.id === state.activeClauseId; });
              if (cl) { cl.value = 'from ' + sVal + ' to ' + eVal; cl.startDate = sVal; cl.endDate = eVal; }
            });
          }
          renderView();
        } else if (action === 'apply-free-text') {
          var fRoot = state.overlayMode ? sheetBody : scopeMapPopover;
          var txt = ((fRoot.querySelector('[data-role="free-text-val"]') || {}).value || '').trim();
          if (!txt) return;
          mutateQuery(function (q) {
            var cl = q.clauses.find(function (c) { return c.id === state.activeClauseId; });
            if (cl) cl.value = txt;
          });
        } else if (action === 'dismiss-overlay') {
          dismissOverlay();
        } else if (action === 'apply-overlay') {
          applyOverlay();
        } else if (action === 'set-palette-tab') {
          state.paletteTab = target.getAttribute('data-tab');
          state.activeClauseId = state.paletteTab === 'wql' ? activeQuery().clauses[0].id : null;
          renderOverlay();
          if (state.paletteTab === 'find') {
            var fi = document.getElementById('palette-find-input');
            if (fi) fi.focus();
          }
        } else if (action === 'clear-find-scope') {
          state.findScopeActive = false;
          renderOverlay();
        } else if (action === 'open-result') {
          var title = target.getAttribute('data-title');
          dismissOverlay();
          showToast('Opened: ' + title);
        }
      });

      // Hover token -> highlight corresponding zone & slot
      appFrameEl.addEventListener('mouseover', function (e) {
        var tok = e.target.closest('.wql-tok[data-clause]');
        if (!tok) return;
        var cid = tok.getAttribute('data-clause');
        var root = state.overlayMode ? sheetBody : scopeMapPopover;
        var cl = activeQuery().clauses.find(function (c) { return c.id === cid; });
        var zn = cl ? zoneForClause(cl) : null;
        Array.prototype.forEach.call(root.querySelectorAll('[data-pill-wrap]'), function (p) {
          p.classList.toggle('is-caret-match', p.getAttribute('data-pill-wrap') === cid);
        });
        Array.prototype.forEach.call(root.querySelectorAll('.zone-card[data-zone]'), function (z) {
          z.classList.toggle('is-zone-caret', z.getAttribute('data-zone') === zn);
        });
      });

      appFrameEl.addEventListener('change', function (e) {
        if (e.target.getAttribute('data-action') === 'toggle-exclude') {
          var checked = e.target.checked;
          mutateQuery(function (q) {
            var cl = q.clauses.find(function (c) { return c.id === state.activeClauseId; });
            if (cl) cl.excluded = checked;
          });
          focusInspectorSearch();
        }
      });

      appFrameEl.addEventListener('input', function (e) {
        var role = e.target.getAttribute('data-role');
        if (role === 'picker-search') {
          state.pickerSearch = e.target.value;
          var root = state.overlayMode ? sheetBody : scopeMapPopover;
          var scroll = root.querySelector('.picker-options-scroll');
          var tmp = document.createElement('div');
          tmp.innerHTML = renderInspectorHtml(activeQuery());
          var nextScroll = tmp.querySelector('.picker-options-scroll');
          if (scroll && nextScroll) scroll.innerHTML = nextScroll.innerHTML;
        } else if (e.target.id === 'palette-find-input') {
          state.findText = e.target.value;
          if (state.findText.charAt(0) === ':') {
            state.paletteTab = 'wql';
            state.activeClauseId = activeQuery().clauses[0].id;
            renderOverlay();
            return;
          }
          var preset = W.PRESETS[state.presetId];
          var pool = state.findScopeActive ? W.filterItems(activeQuery(), '') : W.SAMPLE_ITEMS;
          sheetBody.innerHTML =
            '<div style="display:flex;flex-direction:column;gap:6px">' +
              '<div class="option-group-title">' + (state.findScopeActive ? W.escapeHtml(preset.title) + ' matches' : 'All workspace entries') + '</div>' +
              W.renderPaletteResultsHtml(pool, state.findText) +
            '</div>';
        } else if (role === 'wql-raw-input') {
          var parsed = W.parseWqlLoose(e.target.value, activeQuery());
          if (parsed) {
            if (state.overlayMode) state.draftQuery = parsed;
            else state.committedQuery = parsed;
          }
          syncCaret(e.target);
        }
      });

      appFrameEl.addEventListener('click', function (e) {
        if (e.target.getAttribute('data-role') === 'wql-raw-input') syncCaret(e.target);
      });
      appFrameEl.addEventListener('keyup', function (e) {
        if (e.target.getAttribute('data-role') === 'wql-raw-input') syncCaret(e.target);
      });

      appFrameEl.addEventListener('keydown', function (e) {
        if (e.target.getAttribute('data-role') === 'wql-raw-input' && e.altKey && e.key === 'ArrowDown') {
          e.preventDefault();
          if (state.caretClauseId) {
            state.activeClauseId = state.caretClauseId;
            renderView();
            focusInspectorSearch();
          }
          return;
        }
        if (e.key === 'Escape') {
          if (state.activeClauseId) {
            e.preventDefault();
            var last = state.activeClauseId;
            state.activeClauseId = null;
            renderView();
            focusSlot(last);
            return;
          }
          if (state.desktopMapOpen) {
            e.preventDefault();
            state.desktopMapOpen = false;
            renderView();
            toggleScopeMapBtn.focus();
            return;
          }
          if (state.overlayMode) {
            e.preventDefault();
            dismissOverlay();
          }
        }
        if (e.key === 'Tab' && state.activeClauseId && e.target.closest('.inspector-panel')) {
          e.preventDefault();
          stepClause(e.shiftKey ? -1 : 1);
        }
      });

      document.addEventListener('keydown', function (e) {
        if ((e.metaKey || e.ctrlKey) && (e.key.toLowerCase() === 'k' || e.key === '/')) {
          e.preventDefault();
          if (state.overlayMode === 'palette') dismissOverlay();
          else openOverlay('palette', 'find');
        }
      });

      Array.prototype.forEach.call(document.querySelectorAll('[data-set-vp]'), function (btn) {
        btn.addEventListener('click', function () {
          state.vp = btn.getAttribute('data-set-vp');
          stageEl.setAttribute('data-vp', state.vp);
          Array.prototype.forEach.call(document.querySelectorAll('[data-set-vp]'), function (b) {
            b.classList.toggle('is-active', b === btn);
          });
          state.desktopMapOpen = false;
          state.activeClauseId = null;
          renderView();
        });
      });

      Array.prototype.forEach.call(document.querySelectorAll('[data-set-preset]'), function (btn) {
        btn.addEventListener('click', function () {
          state.presetId = btn.getAttribute('data-set-preset');
          state.committedQuery = W.cloneQuery(W.PRESETS[state.presetId]);
          state.draftQuery = state.overlayMode ? W.cloneQuery(state.committedQuery) : null;
          state.activeClauseId = null;
          state.caretClauseId = null;
          state.findScopeActive = true;
          Array.prototype.forEach.call(document.querySelectorAll('[data-set-preset]'), function (b) {
            b.classList.toggle('is-active', b === btn);
          });
          renderView();
        });
      });

      toggleScopeMapBtn.addEventListener('click', function () {
        state.desktopMapOpen = !state.desktopMapOpen;
        if (state.desktopMapOpen && !state.activeClauseId) {
          state.activeClauseId = state.committedQuery.clauses[0].id;
        }
        renderView();
      });

      document.getElementById('open-palette-toolbar').addEventListener('click', function () { openOverlay('palette', 'find'); });
      document.getElementById('open-palette-header').addEventListener('click', function () { openOverlay('palette', 'find'); });
      document.getElementById('open-mobile-sheet').addEventListener('click', function () { openOverlay('mobile-scope'); });
      document.getElementById('new-entry-btn').addEventListener('click', function () { showToast('New entry triggered for ' + W.PRESETS[state.presetId].title); });
      overlayBackdrop.addEventListener('click', function (e) { if (e.target === overlayBackdrop) dismissOverlay(); });

      renderView();
    })();
  </script>
</body>
</html>
