<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Concept A: Anchored Split-Pill Rail — WQL Composer Prototype</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./shared.css" />
  <style>
    .header-rail-wrap {
      flex: 1;
      min-width: 0;
      display: flex;
      align-items: center;
      gap: 8px;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .header-rail-wrap::-webkit-scrollbar {
      display: none;
    }

    .sheet-mode-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-wrap: wrap;
    }

    .sync-cue {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: var(--primary-active-fg);
      background: var(--primary-soft);
      padding: 3px 9px;
      border-radius: var(--r-full);
      font-weight: 500;
    }
  </style>
</head>
<body>
  <nav class="proto-bar" aria-label="Prototype controls">
    <div class="proto-bar-group">
      <a class="proto-back" href="./index.html" id="back-link">All Prototypes</a>
      <div class="proto-nav" role="navigation" aria-label="Concepts">
        <a href="./concept-a-anchored-rail.html" class="is-current">Concept A</a>
        <a href="./concept-b-clause-inspector.html">Concept B</a>
        <a href="./concept-c-focus-lens.html">Concept C</a>
      </div>
    </div>

    <div class="proto-bar-group">
      <div class="proto-seg" role="group" aria-label="Simulated viewport">
        <button type="button" class="is-active" data-set-vp="desktop">Desktop (1440)</button>
        <button type="button" data-set-vp="tablet">Tablet (768)</button>
        <button type="button" data-set-vp="mobile">Mobile (390)</button>
      </div>
      <div class="proto-seg" role="group" aria-label="Route preset">
        <button type="button" class="is-active" data-set-preset="journal">/journal</button>
        <button type="button" data-set-preset="efforts">/efforts</button>
        <button type="button" data-set-preset="notes">/notes</button>
        <button type="button" data-set-preset="dashboards">/dashboards</button>
      </div>
      <button type="button" class="proto-k-btn" id="open-palette-toolbar">
        <span>Palette</span>
        <span class="kbd-chip">⌘K</span>
      </button>
    </div>
  </nav>

  <div class="stage-outer">
    <div class="stage-viewport" id="stage-viewport" data-vp="desktop">
      <div class="app-frame" id="app-frame">
        <div class="app-scroll" id="app-scroll">
          <!-- Single-row sticky view header (always ~54px) -->
          <header class="view-header" id="view-header">
            <h1 class="view-title" id="view-title">Journal</h1>
            <div class="header-rail-wrap desktop-only-controls" id="header-rail-wrap">
              <div class="pill-rail" id="header-pill-rail" role="toolbar" aria-label="Query clauses"></div>
            </div>
            <div class="header-actions">
              <button type="button" class="icon-btn desktop-only-controls" id="toggle-wql-strip" aria-pressed="false" aria-label="Toggle WQL syntax bar" title="Toggle synchronized WQL bar">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg>
              </button>
              <span class="status-pill is-ok desktop-only-controls tabular" id="header-status-pill">8 notes</span>
              <button type="button" class="icon-btn" id="open-palette-header" aria-label="Open command palette" title="Open Command Palette (⌘K)">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
              </button>
              <button type="button" class="btn btn-primary" id="new-entry-btn">+ New</button>
            </div>
          </header>

          <!-- Advisory strip for ignored filters (e.g. /efforts) -->
          <div id="advisory-container"></div>

          <!-- Optional synchronized WQL token & raw input strip -->
          <div id="wql-strip-container"></div>

          <!-- Main results stream / dashboard bars -->
          <main class="content-body" id="content-body"></main>
        </div>

        <!-- Mobile Bottom Thumb Dock (human readable, >= 48px target) -->
        <div class="mobile-thumb-dock" id="mobile-thumb-dock">
          <button type="button" class="thumb-dock-btn" id="open-mobile-sheet" aria-label="Open query filters">
            <span class="thumb-dock-summary">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/></svg>
              <span id="mobile-dock-text">Journal · Last 4w · By date</span>
            </span>
            <span class="thumb-dock-badge tabular" id="mobile-dock-count">8</span>
          </button>
        </div>

        <!-- Desktop / Tablet Floating Anchored Popover -->
        <div class="floating-popover" id="desktop-popover" role="dialog" aria-label="Edit query clause" style="display:none">
          <div class="popover-caret" id="popover-caret"></div>
          <div id="desktop-popover-inner"></div>
        </div>

        <!-- Unified Overlay (Mobile Filter Sheet OR Command Palette) -->
        <div class="overlay-backdrop" id="overlay-backdrop" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
          <div class="overlay-dialog" id="overlay-dialog">
            <div class="sheet-header" id="sheet-header"></div>
            <div class="sheet-body" id="sheet-body"></div>
            <div class="sheet-footer" id="sheet-footer"></div>
          </div>
        </div>

        <div class="proto-toast" id="proto-toast" role="status" aria-live="polite"></div>
      </div>
    </div>
  </div>

  <script src="./shared-data.js"></script>
  <script>
    (function () {
      var W = window.WqlProto;

      var state = {
        vp: 'desktop',
        presetId: 'journal',
        committedQuery: W.cloneQuery(W.PRESETS.journal),
        draftQuery: null,
        activeClauseId: null,     // clause id or '__add__'
        caretClauseId: null,      // passive caret match from raw WQL input
        pickerSearch: '',
        showWqlStrip: false,
        sheetWqlExpanded: false,
        overlayMode: null,        // null | 'mobile-filter' | 'palette'
        paletteTab: 'find',       // 'find' | 'wql'
        findText: '',
        findScopeActive: true,
        toastTimer: null
      };

      var stageEl = document.getElementById('stage-viewport');
      var appFrameEl = document.getElementById('app-frame');
      var viewTitleEl = document.getElementById('view-title');
      var headerRailEl = document.getElementById('header-pill-rail');
      var headerStatusEl = document.getElementById('header-status-pill');
      var toggleWqlBtn = document.getElementById('toggle-wql-strip');
      var advisoryContainer = document.getElementById('advisory-container');
      var wqlStripContainer = document.getElementById('wql-strip-container');
      var contentBodyEl = document.getElementById('content-body');
      var mobileDockText = document.getElementById('mobile-dock-text');
      var mobileDockCount = document.getElementById('mobile-dock-count');
      var desktopPopover = document.getElementById('desktop-popover');
      var desktopPopoverInner = document.getElementById('desktop-popover-inner');
      var popoverCaret = document.getElementById('popover-caret');
      var overlayBackdrop = document.getElementById('overlay-backdrop');
      var sheetHeader = document.getElementById('sheet-header');
      var sheetBody = document.getElementById('sheet-body');
      var sheetFooter = document.getElementById('sheet-footer');
      var toastEl = document.getElementById('proto-toast');

      function activeQuery() {
        return state.draftQuery || state.committedQuery;
      }

      function showToast(msg) {
        toastEl.innerHTML = W.icons.check(14) + '<span>' + W.escapeHtml(msg) + '</span>';
        toastEl.classList.add('is-shown');
        clearTimeout(state.toastTimer);
        state.toastTimer = setTimeout(function () {
          toastEl.classList.remove('is-shown');
        }, 2400);
      }

      function isMobileContext() {
        return state.vp === 'mobile' || window.innerWidth <= 767;
      }

      function renderSplitPillsHtml(query, opts) {
        var activeId = opts.activeId;
        var caretId = opts.caretId;
        var html = query.clauses.map(function (c) {
          var disp = W.formatClauseDisplay(c);
          var meta = W.CLAUSE_META[c.type] || { label: c.type, removable: true };
          var isAct = activeId === c.id;
          var isCaret = caretId === c.id;
          var cls = 'split-pill';
          if (isAct) cls += ' is-active';
          if (isCaret) cls += ' is-caret-match';
          if (c.ignored) cls += ' is-warn';

          var warnIcon = c.ignored ? W.icons.alert(13) : '';
          var mainBtn =
            '<button type="button" class="split-pill-main" data-action="activate-pill" data-clause-id="' + W.escapeHtml(c.id) + '" aria-pressed="' + (isAct ? 'true' : 'false') + '" title="' + W.escapeHtml(c.reason || meta.description || disp.key) + '">' +
              warnIcon +
              '<span class="pill-key">' + W.escapeHtml(disp.key) + ':</span>' +
              '<span class="pill-val">' + W.escapeHtml(disp.val) + '</span>' +
            '</button>';

          var removeBtn = meta.removable
            ? '<button type="button" class="split-pill-remove" data-action="remove-clause" data-clause-id="' + W.escapeHtml(c.id) + '" aria-label="Remove ' + W.escapeHtml(disp.key) + '">' + W.icons.x(12) + '</button>'
            : '';

          return '<div class="' + cls + '" data-pill-wrap="' + W.escapeHtml(c.id) + '">' + mainBtn + removeBtn + '</div>';
        }).join('');

        var addActive = activeId === '__add__';
        html +=
          '<button type="button" class="add-filter-btn' + (addActive ? ' is-active' : '') + '" data-action="open-add-filter" aria-pressed="' + (addActive ? 'true' : 'false') + '">' +
            W.icons.plus(13) +
            '<span>Filter</span>' +
          '</button>';

        return html;
      }

      function renderWqlTokenStripHtml(query, inputId) {
        var tokens = W.serializeTokens(query);
        var wqlText = W.serializeWql(query);
        var activeClause = query.clauses.find(function (c) {
          return c.id === (state.caretClauseId || state.activeClauseId);
        });
        var syncCueHtml = activeClause
          ? '<span class="sync-cue">' + W.icons.layers(13) + '<span>Scope: ' + W.escapeHtml((W.CLAUSE_META[activeClause.type] || {}).label || activeClause.type) + ' (' + W.escapeHtml(activeClause.value) + ')</span></span>'
          : '<span class="wql-sync-hint">Click any token or move caret to inspect its pill without losing focus</span>';

        var tokensHtml = tokens.map(function (t) {
          var isHi = t.clauseId && (t.clauseId === state.activeClauseId || t.clauseId === state.caretClauseId);
          var cls = 'wql-tok ' + t.tokenClass + (isHi ? ' is-highlighted' : '') + (t.warn ? ' is-warn-tok' : '');
          if (t.clauseId) {
            return '<button type="button" class="' + cls + '" data-action="token-click" data-clause="' + W.escapeHtml(t.clauseId) + '">' + W.escapeHtml(t.text) + '</button>';
          }
          return '<span class="' + cls + '">' + W.escapeHtml(t.text) + '</span>';
        }).join('');

        return (
          '<div class="wql-token-strip">' +
            '<div class="wql-token-row">' +
              '<div class="wql-tokens-interactive" aria-label="Interactive WQL syntax tokens">' + tokensHtml + '</div>' +
              '<div class="wql-raw-input-wrap">' +
                '<input type="text" class="wql-raw-input" id="' + inputId + '" data-role="wql-raw-input" value="' + W.escapeHtml(wqlText) + '" aria-label="Raw WQL expression" />' +
              '</div>' +
            '</div>' +
            '<div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px">' +
              syncCueHtml +
              '<span class="wql-sync-hint">Alt+Down opens options for token under caret</span>' +
            '</div>' +
          '</div>'
        );
      }

      function renderView() {
        var preset = W.PRESETS[state.presetId];
        var q = state.committedQuery;
        var items = W.filterItems(q, '');
        var ignored = W.getIgnoredClauses(q);

        viewTitleEl.textContent = preset.title;
        headerRailEl.innerHTML = renderSplitPillsHtml(q, {
          activeId: state.overlayMode ? null : state.activeClauseId,
          caretId: state.caretClauseId
        });

        toggleWqlBtn.classList.toggle('is-active', state.showWqlStrip);
        toggleWqlBtn.setAttribute('aria-pressed', state.showWqlStrip ? 'true' : 'false');

        if (ignored.length > 0) {
          headerStatusEl.className = 'status-pill is-warn desktop-only-controls tabular';
          headerStatusEl.textContent = ignored.length + ' ignored';
        } else {
          headerStatusEl.className = 'status-pill is-ok desktop-only-controls tabular';
          headerStatusEl.textContent = items.length + (q.kind === 'aggregate' ? ' sessions' : ' matches');
        }

        // Advisory strip
        if (ignored.length > 0) {
          var names = ignored.map(function (c) { return c.type; }).join(', ');
          advisoryContainer.innerHTML =
            '<div class="advisory-strip">' +
              '<div class="advisory-strip-msg">' +
                W.icons.alert(15) +
                '<span>' + ignored.length + ' filter(s) ignored on <code>:' + W.escapeHtml((q.clauses.find(function (c) { return c.type === 'target'; }) || {}).value || 'effort') + '</code> (' + W.escapeHtml(names) + ').</span>' +
              '</div>' +
              '<button type="button" class="btn btn-warn" data-action="remove-all-ignored">Remove ignored (' + ignored.length + ')</button>' +
            '</div>';
        } else {
          advisoryContainer.innerHTML = '';
        }

        // WQL synchronized token strip
        if (state.showWqlStrip) {
          var existingInput = document.getElementById('header-wql-input');
          var hadFocus = existingInput && document.activeElement === existingInput;
          var selPos = hadFocus ? existingInput.selectionStart : null;
          wqlStripContainer.innerHTML = renderWqlTokenStripHtml(q, 'header-wql-input');
          if (hadFocus) {
            var restored = document.getElementById('header-wql-input');
            if (restored) {
              restored.focus();
              if (selPos !== null) restored.setSelectionRange(selPos, selPos);
            }
          }
        } else {
          wqlStripContainer.innerHTML = '';
        }

        // Main content
        contentBodyEl.innerHTML =
          '<div class="results-summary-bar">' +
            '<span>Showing <strong style="color:var(--fg)" class="tabular">' + items.length + '</strong> of ' + W.SAMPLE_ITEMS.length + ' entries</span>' +
            '<span class="mono" style="font-size:12px">' + W.escapeHtml(W.serializeWql(q)) + '</span>' +
          '</div>' +
          W.renderSampleResultsHtml(q, items);

        // Mobile dock (human readable!)
        mobileDockText.textContent = W.humanSummary(q, preset.title);
        mobileDockCount.textContent = items.length + (ignored.length ? ' · ' + ignored.length + '!' : '');

        renderDesktopPopover();
        renderOverlay();
      }

      function renderDesktopPopover() {
        if (state.overlayMode || isMobileContext() || !state.activeClauseId) {
          desktopPopover.style.display = 'none';
          return;
        }
        var q = state.committedQuery;
        var clause = state.activeClauseId === '__add__' ? null : q.clauses.find(function (c) { return c.id === state.activeClauseId; });
        var idx = clause ? q.clauses.indexOf(clause) : -1;

        desktopPopoverInner.innerHTML = W.renderPickerBodyHtml({
          clause: clause,
          clauseIdx: idx,
          totalClauses: q.clauses.length,
          search: state.pickerSearch
        });

        desktopPopover.style.display = 'flex';

        // Anchor directly below the active pill or +Filter button
        var anchor = state.activeClauseId === '__add__'
          ? headerRailEl.querySelector('[data-action="open-add-filter"]')
          : headerRailEl.querySelector('[data-pill-wrap="' + state.activeClauseId + '"]');
        if (anchor) {
          var frameRect = appFrameEl.getBoundingClientRect();
          var anchorRect = anchor.getBoundingClientRect();
          var popWidth = Math.min(390, frameRect.width - 24);
          desktopPopover.style.width = popWidth + 'px';
          var desiredLeft = anchorRect.left - frameRect.left;
          var maxLeft = frameRect.width - popWidth - 12;
          var clampedLeft = Math.max(12, Math.min(desiredLeft, maxLeft));
          var top = anchorRect.bottom - frameRect.top + 8;
          desktopPopover.style.left = clampedLeft + 'px';
          desktopPopover.style.top = top + 'px';
          var caretOffset = (anchorRect.left + anchorRect.width / 2) - (frameRect.left + clampedLeft) - 6;
          popoverCaret.style.left = Math.max(16, Math.min(caretOffset, popWidth - 28)) + 'px';
        }
      }

      function renderOverlay() {
        if (!state.overlayMode) {
          overlayBackdrop.classList.remove('is-open');
          return;
        }
        overlayBackdrop.classList.add('is-open');
        var preset = W.PRESETS[state.presetId];
        var q = activeQuery();
        var items = W.filterItems(q, state.paletteTab === 'find' ? state.findText : '');
        var ignored = W.getIgnoredClauses(q);

        if (state.overlayMode === 'mobile-filter') {
          sheetHeader.innerHTML =
            '<div class="sheet-header-row">' +
              '<h2 class="sheet-title" id="sheet-title">Filter ' + W.escapeHtml(preset.title) + '</h2>' +
              '<div style="display:flex;align-items:center;gap:6px">' +
                '<button type="button" class="btn btn-secondary' + (state.sheetWqlExpanded ? ' is-active' : '') + '" data-action="toggle-sheet-wql" aria-pressed="' + state.sheetWqlExpanded + '">' + W.icons.code(14) + '<span>WQL</span></button>' +
                '<button type="button" class="icon-btn" data-action="dismiss-overlay" aria-label="Close filters">' + W.icons.x(16) + '</button>' +
              '</div>' +
            '</div>' +
            '<div class="pill-rail" role="toolbar" aria-label="Filter clauses">' +
              renderSplitPillsHtml(q, { activeId: state.activeClauseId, caretId: state.caretClauseId }) +
            '</div>';

          var bodyHtml = '';
          if (state.sheetWqlExpanded) {
            bodyHtml += renderWqlTokenStripHtml(q, 'sheet-wql-input');
          }
          if (ignored.length > 0) {
            bodyHtml +=
              '<div class="advisory-strip" style="border-radius:8px;border:1px solid var(--warn-border)">' +
                '<div class="advisory-strip-msg">' + W.icons.alert(15) + '<span>' + ignored.length + ' filter(s) ignored on this target.</span></div>' +
                '<button type="button" class="btn btn-warn" data-action="remove-all-ignored">Remove ignored</button>' +
              '</div>';
          }
          if (state.activeClauseId) {
            var clause = state.activeClauseId === '__add__' ? null : q.clauses.find(function (c) { return c.id === state.activeClauseId; });
            var idx = clause ? q.clauses.indexOf(clause) : -1;
            bodyHtml +=
              '<div class="picker-card-wrap">' +
                W.renderPickerBodyHtml({ clause: clause, clauseIdx: idx, totalClauses: q.clauses.length, search: state.pickerSearch }) +
              '</div>';
          } else {
            bodyHtml +=
              '<div class="entry-card">' +
                '<div class="entry-card-top">' +
                  '<span class="entry-title">Active filter summary</span>' +
                  '<span class="status-pill is-ok tabular">' + items.length + ' matches</span>' +
                '</div>' +
                '<p class="entry-note">' + W.escapeHtml(W.humanSummary(q, preset.title)) + '</p>' +
                '<p class="mono" style="font-size:12px;color:var(--muted-fg)">Tap any pill above to edit its value, or tap + Filter to narrow further.</p>' +
              '</div>';
          }
          sheetBody.innerHTML = bodyHtml;

          sheetFooter.innerHTML =
            '<span class="tabular" style="font-size:12.5px;color:var(--muted-fg)">' + items.length + ' matches</span>' +
            '<div class="sheet-footer-actions">' +
              '<button type="button" class="btn btn-secondary" data-action="dismiss-overlay">Cancel</button>' +
              '<button type="button" class="btn btn-primary" data-action="apply-overlay">Apply · ' + items.length + '</button>' +
            '</div>';
          return;
        }

        // Command Palette mode (Find vs WQL)
        sheetHeader.innerHTML =
          '<div class="sheet-header-row">' +
            '<h2 class="sheet-title" id="sheet-title">Command Palette</h2>' +
            '<div style="display:flex;align-items:center;gap:8px">' +
              '<div class="proto-seg" role="tablist" aria-label="Palette mode">' +
                '<button type="button" role="tab" aria-selected="' + (state.paletteTab === 'find') + '" class="' + (state.paletteTab === 'find' ? 'is-active' : '') + '" data-action="set-palette-tab" data-tab="find">Find</button>' +
                '<button type="button" role="tab" aria-selected="' + (state.paletteTab === 'wql') + '" class="' + (state.paletteTab === 'wql' ? 'is-active' : '') + '" data-action="set-palette-tab" data-tab="wql">WQL</button>' +
              '</div>' +
              '<button type="button" class="icon-btn" data-action="dismiss-overlay" aria-label="Close palette">' + W.icons.x(16) + '</button>' +
            '</div>' +
          '</div>' +
          (state.paletteTab === 'find'
            ? '<div class="find-box">' +
                W.icons.search(16) +
                '<input type="text" id="palette-find-input" value="' + W.escapeHtml(state.findText) + '" placeholder="Search workouts, notes, movements… (type : for WQL)" aria-label="Find records" />' +
                (state.findScopeActive
                  ? '<span class="scope-chip"><span>' + W.escapeHtml(preset.defaultScopeLabel) + '</span><button type="button" data-action="clear-find-scope" aria-label="Search everywhere">' + W.icons.x(12) + '</button></span>'
                  : '') +
              '</div>'
            : '<div style="display:flex;flex-direction:column;gap:8px">' +
                '<div class="sheet-mode-bar">' +
                  '<div class="pill-rail" role="toolbar" aria-label="WQL clauses">' +
                    renderSplitPillsHtml(q, { activeId: state.activeClauseId, caretId: state.caretClauseId }) +
                  '</div>' +
                  '<div style="display:flex;align-items:center;gap:6px">' +
                    '<button type="button" class="btn btn-secondary' + (state.sheetWqlExpanded ? ' is-active' : '') + '" data-action="toggle-sheet-wql">' + W.icons.code(14) + '<span>WQL</span></button>' +
                    '<span class="status-pill ' + (ignored.length ? 'is-warn' : 'is-ok') + ' tabular">' + (ignored.length ? ignored.length + ' ignored' : items.length + ' of ' + W.SAMPLE_ITEMS.length) + '</span>' +
                  '</div>' +
                '</div>' +
              '</div>');

        if (state.paletteTab === 'find') {
          var pool = state.findScopeActive ? items : W.SAMPLE_ITEMS;
          sheetBody.innerHTML =
            '<div style="display:flex;flex-direction:column;gap:6px">' +
              '<div class="option-group-title">' + (state.findScopeActive ? W.escapeHtml(preset.title) + ' matches' : 'All workspace entries') + '</div>' +
              W.renderPaletteResultsHtml(pool, state.findText) +
            '</div>';
          sheetFooter.innerHTML =
            '<span style="font-size:12px;color:var(--muted-fg)">Plain text search · Type <code>:</code> for WQL</span>' +
            '<div class="sheet-footer-actions"><button type="button" class="btn btn-secondary" data-action="dismiss-overlay">Close</button></div>';
        } else {
          var wqlBody = '';
          if (state.sheetWqlExpanded) {
            wqlBody += renderWqlTokenStripHtml(q, 'palette-wql-input');
          }
          if (state.activeClauseId) {
            var pClause = state.activeClauseId === '__add__' ? null : q.clauses.find(function (c) { return c.id === state.activeClauseId; });
            var pIdx = pClause ? q.clauses.indexOf(pClause) : -1;
            wqlBody +=
              '<div class="picker-card-wrap">' +
                W.renderPickerBodyHtml({ clause: pClause, clauseIdx: pIdx, totalClauses: q.clauses.length, search: state.pickerSearch }) +
              '</div>';
          }
          if (!state.activeClauseId || !isMobileContext()) {
            wqlBody +=
              '<div style="display:flex;flex-direction:column;gap:6px">' +
                '<div class="option-group-title">Matching results (' + items.length + ')</div>' +
                W.renderPaletteResultsHtml(items, '') +
              '</div>';
          }
          sheetBody.innerHTML = wqlBody;
          sheetFooter.innerHTML =
            '<span class="mono" style="font-size:11.5px;color:var(--muted-fg);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + W.escapeHtml(W.serializeWql(q)) + '</span>' +
            '<div class="sheet-footer-actions">' +
              '<button type="button" class="btn btn-secondary" data-action="dismiss-overlay">Cancel</button>' +
              '<button type="button" class="btn btn-primary" data-action="apply-overlay">Apply to ' + W.escapeHtml(preset.title) + '</button>' +
            '</div>';
        }
      }

      function focusActivePill() {
        if (!state.activeClauseId) return;
        var root = state.overlayMode ? sheetHeader : headerRailEl;
        var selector = state.activeClauseId === '__add__'
          ? '[data-action="open-add-filter"]'
          : '[data-pill-wrap="' + state.activeClauseId + '"] .split-pill-main';
        var btn = root.querySelector(selector);
        if (btn) btn.focus();
      }

      function focusPickerSearch() {
        var root = state.overlayMode ? sheetBody : desktopPopoverInner;
        var inp = root.querySelector('[data-role="picker-search"], [data-role="free-text-val"]');
        if (inp) inp.focus();
      }

      function openClause(clauseId, focusSearch) {
        state.activeClauseId = clauseId;
        state.pickerSearch = '';
        renderView();
        if (focusSearch) focusPickerSearch();
      }

      function closePicker(restoreFocusToPill) {
        var lastId = state.activeClauseId;
        state.activeClauseId = null;
        state.pickerSearch = '';
        renderView();
        if (restoreFocusToPill && lastId) {
          var root = state.overlayMode ? sheetHeader : headerRailEl;
          var selector = lastId === '__add__'
            ? '[data-action="open-add-filter"]'
            : '[data-pill-wrap="' + lastId + '"] .split-pill-main';
          var btn = root.querySelector(selector);
          if (btn) btn.focus();
        }
      }

      function stepClause(delta) {
        var q = activeQuery();
        if (!q.clauses.length) return;
        var idx = q.clauses.findIndex(function (c) { return c.id === state.activeClauseId; });
        var nextIdx = idx === -1 ? 0 : (idx + delta + q.clauses.length) % q.clauses.length;
        openClause(q.clauses[nextIdx].id, true);
      }

      function mutateQuery(fn) {
        var target = state.overlayMode ? state.draftQuery : state.committedQuery;
        fn(target);
        W.updateIgnoredFlags(target);
        renderView();
      }

      function openOverlay(mode, tab) {
        state.overlayMode = mode;
        state.draftQuery = W.cloneQuery(state.committedQuery);
        state.activeClauseId = null;
        state.pickerSearch = '';
        if (tab) state.paletteTab = tab;
        renderView();
        if (mode === 'palette' && state.paletteTab === 'find') {
          var findInp = document.getElementById('palette-find-input');
          if (findInp) findInp.focus();
        }
      }

      function dismissOverlay() {
        state.overlayMode = null;
        state.draftQuery = null;
        state.activeClauseId = null;
        renderView();
      }

      function applyOverlay() {
        if (state.draftQuery) {
          state.committedQuery = W.cloneQuery(state.draftQuery);
        }
        dismissOverlay();
        showToast('Applied query to ' + W.PRESETS[state.presetId].title);
      }

      // Event Delegation
      appFrameEl.addEventListener('click', function (e) {
        var target = e.target.closest('[data-action]');
        if (!target) {
          if (desktopPopover.style.display !== 'none' && !e.target.closest('#desktop-popover') && !e.target.closest('#header-pill-rail') && !e.target.closest('.wql-token-strip')) {
            closePicker(false);
          }
          return;
        }

        var action = target.getAttribute('data-action');
        if (action === 'activate-pill') {
          var cid = target.getAttribute('data-clause-id');
          if (state.activeClauseId === cid) closePicker(true);
          else openClause(cid, true);
        } else if (action === 'open-add-filter') {
          if (state.activeClauseId === '__add__') closePicker(true);
          else openClause('__add__', true);
        } else if (action === 'remove-clause') {
          var rid = target.getAttribute('data-clause-id');
          mutateQuery(function (q) {
            q.clauses = q.clauses.filter(function (c) { return c.id !== rid; });
          });
          if (state.activeClauseId === rid) state.activeClauseId = null;
          renderView();
        } else if (action === 'remove-all-ignored') {
          mutateQuery(function (q) {
            var ignoredIds = W.getIgnoredClauses(q).map(function (c) { return c.id; });
            q.clauses = q.clauses.filter(function (c) { return ignoredIds.indexOf(c.id) === -1; });
            if (ignoredIds.indexOf(state.activeClauseId) !== -1) state.activeClauseId = null;
          });
          showToast('Removed ignored filters');
        } else if (action === 'close-picker') {
          closePicker(true);
        } else if (action === 'step-prev') {
          stepClause(-1);
        } else if (action === 'step-next') {
          stepClause(1);
        } else if (action === 'pick-option') {
          var val = target.getAttribute('data-value');
          mutateQuery(function (q) {
            var cl = q.clauses.find(function (c) { return c.id === state.activeClauseId; });
            if (cl) cl.value = val;
          });
          closePicker(true);
        } else if (action === 'pick-add-filter') {
          var fType = target.getAttribute('data-filter-type');
          var dVal = target.getAttribute('data-default-val');
          var newId = 'c-' + fType + '-' + Date.now();
          mutateQuery(function (q) {
            var existing = q.clauses.find(function (c) { return c.type === fType; });
            if (existing) {
              newId = existing.id;
            } else {
              q.clauses.push({ id: newId, type: fType, value: dVal, excluded: false });
            }
          });
          openClause(newId, true);
        } else if (action === 'apply-custom-dates') {
          var root = state.overlayMode ? sheetBody : desktopPopoverInner;
          var sInp = root.querySelector('[data-role="date-start"]');
          var eInp = root.querySelector('[data-role="date-end"]');
          var sVal = sInp ? sInp.value : '';
          var eVal = eInp ? eInp.value : '';
          if (!sVal || !eVal || sVal > eVal) {
            showToast('Start date must be on or before End date');
            return;
          }
          mutateQuery(function (q) {
            var cl = q.clauses.find(function (c) { return c.id === state.activeClauseId; });
            if (cl) {
              cl.value = 'from ' + sVal + ' to ' + eVal;
              cl.startDate = sVal;
              cl.endDate = eVal;
            }
          });
          closePicker(true);
        } else if (action === 'apply-free-text') {
          var ftRoot = state.overlayMode ? sheetBody : desktopPopoverInner;
          var ftInp = ftRoot.querySelector('[data-role="free-text-val"]');
          var txt = ftInp ? ftInp.value.trim() : '';
          if (!txt) return;
          mutateQuery(function (q) {
            var cl = q.clauses.find(function (c) { return c.id === state.activeClauseId; });
            if (cl) cl.value = txt;
          });
          closePicker(true);
        } else if (action === 'token-click') {
          var tid = target.getAttribute('data-clause');
          openClause(tid, true);
        } else if (action === 'dismiss-overlay') {
          dismissOverlay();
        } else if (action === 'apply-overlay') {
          applyOverlay();
        } else if (action === 'toggle-sheet-wql') {
          state.sheetWqlExpanded = !state.sheetWqlExpanded;
          renderOverlay();
        } else if (action === 'set-palette-tab') {
          state.paletteTab = target.getAttribute('data-tab');
          state.activeClauseId = null;
          renderOverlay();
          if (state.paletteTab === 'find') {
            var fi = document.getElementById('palette-find-input');
            if (fi) fi.focus();
          }
        } else if (action === 'clear-find-scope') {
          state.findScopeActive = false;
          renderOverlay();
        } else if (action === 'open-result') {
          var title = target.getAttribute('data-title');
          dismissOverlay();
          showToast('Opened: ' + title);
        }
      });

      appFrameEl.addEventListener('change', function (e) {
        if (e.target.getAttribute('data-action') === 'toggle-exclude') {
          var checked = e.target.checked;
          mutateQuery(function (q) {
            var cl = q.clauses.find(function (c) { return c.id === state.activeClauseId; });
            if (cl) cl.excluded = checked;
          });
          focusPickerSearch();
        }
      });

      appFrameEl.addEventListener('input', function (e) {
        var role = e.target.getAttribute('data-role');
        if (role === 'picker-search') {
          state.pickerSearch = e.target.value;
          var root = state.overlayMode ? sheetBody : desktopPopoverInner;
          var scroll = root.querySelector('.picker-options-scroll');
          var q = activeQuery();
          var clause = state.activeClauseId === '__add__' ? null : q.clauses.find(function (c) { return c.id === state.activeClauseId; });
          var idx = clause ? q.clauses.indexOf(clause) : -1;
          var tmp = document.createElement('div');
          tmp.innerHTML = W.renderPickerBodyHtml({ clause: clause, clauseIdx: idx, totalClauses: q.clauses.length, search: state.pickerSearch });
          var newScroll = tmp.querySelector('.picker-options-scroll');
          if (scroll && newScroll) scroll.innerHTML = newScroll.innerHTML;
        } else if (e.target.id === 'palette-find-input') {
          state.findText = e.target.value;
          if (state.findText.charAt(0) === ':') {
            state.paletteTab = 'wql';
            state.sheetWqlExpanded = true;
            renderOverlay();
            return;
          }
          var resBody = sheetBody;
          var preset = W.PRESETS[state.presetId];
          var pool = state.findScopeActive ? W.filterItems(activeQuery(), '') : W.SAMPLE_ITEMS;
          resBody.innerHTML =
            '<div style="display:flex;flex-direction:column;gap:6px">' +
              '<div class="option-group-title">' + (state.findScopeActive ? W.escapeHtml(preset.title) + ' matches' : 'All workspace entries') + '</div>' +
              W.renderPaletteResultsHtml(pool, state.findText) +
            '</div>';
        } else if (role === 'wql-raw-input') {
          var parsed = W.parseWqlLoose(e.target.value, activeQuery());
          if (parsed) {
            if (state.overlayMode) state.draftQuery = parsed;
            else state.committedQuery = parsed;
          }
          syncCaretFromInput(e.target);
        }
      });

      function syncCaretFromInput(inputEl) {
        var pos = inputEl.selectionStart || 0;
        var q = activeQuery();
        var tokens = W.serializeTokens(q);
        var matchId = W.clauseAtOffset(tokens, pos);
        if (matchId !== state.caretClauseId) {
          state.caretClauseId = matchId;
          // Update pill highlights + token strip without disturbing input focus
          var rail = state.overlayMode ? sheetHeader.querySelector('.pill-rail') : headerRailEl;
          if (rail) {
            Array.prototype.forEach.call(rail.querySelectorAll('[data-pill-wrap]'), function (el) {
              el.classList.toggle('is-caret-match', el.getAttribute('data-pill-wrap') === matchId);
            });
          }
          var strip = inputEl.closest('.wql-token-strip');
          if (strip) {
            Array.prototype.forEach.call(strip.querySelectorAll('.wql-tok[data-clause]'), function (tok) {
              tok.classList.toggle('is-highlighted', tok.getAttribute('data-clause') === matchId);
            });
          }
        }
      }

      appFrameEl.addEventListener('click', function (e) {
        if (e.target.getAttribute('data-role') === 'wql-raw-input') syncCaretFromInput(e.target);
      });
      appFrameEl.addEventListener('keyup', function (e) {
        if (e.target.getAttribute('data-role') === 'wql-raw-input') syncCaretFromInput(e.target);
      });

      // Keyboard contract: Tab steps clauses, ArrowLeft/Right roves pills, Escape restores focus to pill
      appFrameEl.addEventListener('keydown', function (e) {
        if (e.target.getAttribute('data-role') === 'wql-raw-input' && e.altKey && e.key === 'ArrowDown') {
          e.preventDefault();
          if (state.caretClauseId) openClause(state.caretClauseId, true);
          return;
        }

        if (e.key === 'Escape') {
          if (state.activeClauseId) {
            e.preventDefault();
            e.stopPropagation();
            closePicker(true);
            return;
          }
          if (state.overlayMode) {
            e.preventDefault();
            dismissOverlay();
            return;
          }
        }

        if (e.key === 'Tab' && state.activeClauseId && (e.target.closest('#desktop-popover') || e.target.closest('.sheet-body'))) {
          e.preventDefault();
          stepClause(e.shiftKey ? -1 : 1);
          return;
        }

        if ((e.key === 'ArrowRight' || e.key === 'ArrowLeft') && (e.target.classList.contains('split-pill-main') || e.target.classList.contains('add-filter-btn'))) {
          var rail = e.target.closest('.pill-rail');
          if (!rail) return;
          var items = Array.prototype.slice.call(rail.querySelectorAll('.split-pill-main, .add-filter-btn'));
          var idx = items.indexOf(e.target);
          if (idx !== -1) {
            e.preventDefault();
            var next = items[(idx + (e.key === 'ArrowRight' ? 1 : -1) + items.length) % items.length];
            next.focus();
          }
        }
      });

      // Global Cmd/Ctrl+K and Ctrl+/
      document.addEventListener('keydown', function (e) {
        if ((e.metaKey || e.ctrlKey) && (e.key.toLowerCase() === 'k' || e.key === '/')) {
          e.preventDefault();
          if (state.overlayMode === 'palette') dismissOverlay();
          else openOverlay('palette', 'find');
        }
      });

      // Prototype Toolbar bindings
      Array.prototype.forEach.call(document.querySelectorAll('[data-set-vp]'), function (btn) {
        btn.addEventListener('click', function () {
          state.vp = btn.getAttribute('data-set-vp');
          stageEl.setAttribute('data-vp', state.vp);
          Array.prototype.forEach.call(document.querySelectorAll('[data-set-vp]'), function (b) {
            b.classList.toggle('is-active', b === btn);
          });
          state.activeClauseId = null;
          renderView();
        });
      });

      Array.prototype.forEach.call(document.querySelectorAll('[data-set-preset]'), function (btn) {
        btn.addEventListener('click', function () {
          state.presetId = btn.getAttribute('data-set-preset');
          state.committedQuery = W.cloneQuery(W.PRESETS[state.presetId]);
          state.draftQuery = state.overlayMode ? W.cloneQuery(state.committedQuery) : null;
          state.activeClauseId = null;
          state.caretClauseId = null;
          state.findScopeActive = true;
          Array.prototype.forEach.call(document.querySelectorAll('[data-set-preset]'), function (b) {
            b.classList.toggle('is-active', b === btn);
          });
          renderView();
        });
      });

      document.getElementById('toggle-wql-strip').addEventListener('click', function () {
        state.showWqlStrip = !state.showWqlStrip;
        renderView();
      });

      document.getElementById('open-palette-toolbar').addEventListener('click', function () {
        openOverlay('palette', 'find');
      });
      document.getElementById('open-palette-header').addEventListener('click', function () {
        openOverlay('palette', 'find');
      });
      document.getElementById('open-mobile-sheet').addEventListener('click', function () {
        openOverlay('mobile-filter');
      });
      document.getElementById('new-entry-btn').addEventListener('click', function () {
        showToast('New entry composer triggered for ' + W.PRESETS[state.presetId].title);
      });
      overlayBackdrop.addEventListener('click', function (e) {
        if (e.target === overlayBackdrop) dismissOverlay();
      });

      renderView();
    })();
  </script>
</body>
</html>
