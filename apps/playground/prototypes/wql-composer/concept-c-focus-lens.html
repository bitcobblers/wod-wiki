<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Concept C: Focus-Lens Spine — WQL Composer Prototype</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./shared.css" />
  <style>
    /* Natural-language sentence phrase bar in header */
    .sentence-bar {
      flex: 1;
      min-width: 0;
      display: flex;
      align-items: center;
      gap: 4px;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .sentence-bar::-webkit-scrollbar {
      display: none;
    }

    .phrase-btn {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 4px 10px;
      min-height: 30px;
      border-radius: var(--r-full);
      border: 1px solid var(--border);
      background: var(--popover);
      font-size: 13px;
      font-weight: 500;
      color: var(--fg);
      white-space: nowrap;
      transition: background-color 140ms ease, border-color 140ms ease;
    }
    .phrase-btn:hover {
      background: var(--muted);
      border-color: var(--field-border);
    }
    .phrase-btn.is-active {
      background: var(--primary);
      border-color: var(--primary);
      color: var(--primary-fg);
    }
    .phrase-btn.is-warn {
      background: var(--warn-bg);
      border-color: var(--warn-border);
      color: var(--warn-fg);
    }

    .phrase-sep {
      color: var(--muted-fg);
      font-size: 12px;
      padding: 0 2px;
      user-select: none;
    }

    /* Desktop Focus Lens Floating Dropdown */
    .focus-lens-popover {
      position: absolute;
      top: 60px;
      left: 20px;
      right: 20px;
      max-width: 720px;
      margin: 0 auto;
      z-index: 60;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--r-lg);
      box-shadow: var(--shadow-float);
      display: none;
      flex-direction: column;
      overflow: hidden;
    }
    .focus-lens-popover.is-open {
      display: flex;
    }

    /* Notched Spine Track — active tab merges smoothly into the Clause Canvas below */
    .spine-rail-bar {
      background: var(--muted);
      border-bottom: 1px solid var(--border);
      padding: 10px 14px 0;
      display: flex;
      align-items: flex-end;
      flex-wrap: wrap;
      gap: 6px;
    }
    .stage-viewport[data-vp="mobile"] .spine-rail-bar {
      padding: 8px 12px 0;
      flex-wrap: nowrap;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .stage-viewport[data-vp="mobile"] .spine-rail-bar::-webkit-scrollbar {
      display: none;
    }

    .spine-tab {
      display: inline-flex;
      align-items: stretch;
      flex-shrink: 0;
      border-radius: 10px 10px 0 0;
      border: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
      background: var(--popover);
      color: var(--fg-2);
      position: relative;
      margin-bottom: -1px;
      overflow: hidden;
      transition: background-color 140ms ease, border-color 140ms ease;
    }
    .spine-tab:hover {
      background: var(--card);
      border-color: var(--field-border);
    }
    .spine-tab.is-active {
      background: var(--card);
      border-color: var(--primary);
      border-bottom-color: var(--card);
      color: var(--primary-active-fg);
      z-index: 2;
    }
    .spine-tab.is-caret-match:not(.is-active) {
      background: var(--primary-soft);
      border-color: var(--primary);
      color: var(--primary-active-fg);
    }
    .spine-tab.is-warn:not(.is-active) {
      background: var(--warn-bg);
      border-color: var(--warn-border);
      color: var(--warn-fg);
    }
    .spine-tab.is-warn.is-active {
      background: var(--card);
      border-color: var(--warn-fg);
      border-bottom-color: var(--card);
      color: var(--warn-fg);
      z-index: 2;
    }

    .spine-tab-main {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 7px 11px;
      min-height: 34px;
      font-size: 12.5px;
      font-weight: 600;
      white-space: nowrap;
    }
    .spine-tab-key {
      font-size: 11.5px;
      font-weight: 500;
      color: var(--muted-fg);
    }
    .spine-tab.is-active .spine-tab-key {
      color: var(--primary);
    }
    .spine-tab.is-warn .spine-tab-key {
      color: var(--warn-fg);
    }

    .spine-tab-remove {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0 8px 0 6px;
      border-left: 1px solid var(--border-soft);
      color: var(--muted-fg);
      min-width: 28px;
    }
    .spine-tab-remove:hover {
      background: rgba(38, 33, 28, 0.08);
      color: var(--fg);
    }

    .spine-add-tab {
      display: inline-flex;
      align-items: center;
      flex-shrink: 0;
      gap: 5px;
      padding: 7px 11px;
      min-height: 34px;
      border-radius: 10px 10px 0 0;
      border: 1px dashed var(--field-border);
      border-bottom: 1px solid var(--border);
      background: var(--popover);
      color: var(--primary);
      font-size: 12px;
      font-weight: 600;
      margin-bottom: -1px;
      white-space: nowrap;
    }
    .spine-add-tab:hover {
      background: var(--primary-soft);
      border-style: solid;
      border-color: var(--primary);
    }
    .spine-add-tab.is-active {
      background: var(--card);
      border-style: solid;
      border-color: var(--primary);
      border-bottom-color: var(--card);
      color: var(--primary-active-fg);
      z-index: 2;
    }

    .stage-viewport[data-vp="mobile"] .spine-tab-main,
    .stage-viewport[data-vp="mobile"] .spine-tab-remove,
    .stage-viewport[data-vp="mobile"] .spine-add-tab {
      min-height: 44px;
    }
    .stage-viewport[data-vp="mobile"] .spine-tab-remove {
      min-width: 44px;
    }

    .lens-canvas {
      background: var(--card);
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }
    .stage-viewport[data-vp="mobile"] .lens-canvas .picker-options-scroll {
      flex: 1;
      min-height: 0;
      max-height: none;
    }
    @media (max-width: 767px) {
      .spine-rail-bar {
        padding: 8px 12px 0;
        flex-wrap: nowrap;
        overflow-x: auto;
        scrollbar-width: none;
      }
      .spine-rail-bar::-webkit-scrollbar {
        display: none;
      }
      .spine-tab-main,
      .spine-tab-remove,
      .spine-add-tab {
        min-height: 44px;
      }
      .spine-tab-remove {
        min-width: 44px;
      }
      .lens-canvas .picker-options-scroll {
        flex: 1;
        min-height: 0;
        max-height: none;
      }
    }

    .wql-drawer-toggle {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      width: 100%;
      padding: 8px 14px;
      min-height: 36px;
      background: var(--popover);
      border-top: 1px solid var(--border);
      font-size: 12px;
      color: var(--fg-2);
      text-align: left;
    }
    .wql-drawer-toggle:hover {
      background: var(--muted);
    }
    .wql-drawer-code {
      font-family: var(--font-mono);
      font-size: 12px;
      color: var(--fg);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      flex: 1;
      min-width: 0;
    }
  </style>
</head>
<body>
  <nav class="proto-bar" aria-label="Prototype controls">
    <div class="proto-bar-group">
      <a class="proto-back" href="./index.html">All Prototypes</a>
      <div class="proto-nav" role="navigation" aria-label="Concepts">
        <a href="./concept-a-anchored-rail.html">Concept A</a>
        <a href="./concept-b-clause-inspector.html">Concept B</a>
        <a href="./concept-c-focus-lens.html" class="is-current">Concept C</a>
      </div>
    </div>

    <div class="proto-bar-group">
      <div class="proto-seg" role="group" aria-label="Simulated viewport">
        <button type="button" class="is-active" data-set-vp="desktop">Desktop (1440)</button>
        <button type="button" data-set-vp="tablet">Tablet (768)</button>
        <button type="button" data-set-vp="mobile">Mobile (390)</button>
      </div>
      <div class="proto-seg" role="group" aria-label="Route preset">
        <button type="button" class="is-active" data-set-preset="journal">/journal</button>
        <button type="button" data-set-preset="efforts">/efforts</button>
        <button type="button" data-set-preset="notes">/notes</button>
        <button type="button" data-set-preset="dashboards">/dashboards</button>
      </div>
      <button type="button" class="proto-k-btn" id="open-palette-toolbar">
        <span>Palette</span>
        <span class="kbd-chip">⌘K</span>
      </button>
    </div>
  </nav>

  <div class="stage-outer">
    <div class="stage-viewport" id="stage-viewport" data-vp="desktop">
      <div class="app-frame" id="app-frame">
        <div class="app-scroll">
          <header class="view-header">
            <h1 class="view-title" id="view-title">Journal</h1>
            <div class="sentence-bar desktop-only-controls" id="header-sentence-bar" role="toolbar" aria-label="Query sentence phrases"></div>
            <div class="header-actions">
              <span class="status-pill is-ok desktop-only-controls tabular" id="header-status-pill">8 matches</span>
              <button type="button" class="icon-btn" id="open-palette-header" aria-label="Open command palette">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
              </button>
              <button type="button" class="btn btn-primary" id="new-entry-btn">+ New</button>
            </div>
          </header>

          <div id="advisory-container"></div>
          <main class="content-body" id="content-body"></main>
        </div>

        <!-- Mobile Bottom Thumb Dock -->
        <div class="mobile-thumb-dock">
          <button type="button" class="thumb-dock-btn" id="open-mobile-sheet" aria-label="Open query focus lens">
            <span class="thumb-dock-summary">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><line x1="4" x2="4" y1="21" y2="14"/><line x1="4" x2="4" y1="10" y2="3"/><line x1="12" x2="12" y1="21" y2="12"/><line x1="12" x2="12" y1="8" y2="3"/><line x1="20" x2="20" y1="21" y2="16"/><line x1="20" x2="20" y1="12" y2="3"/><line x1="1" x2="7" y1="14" y2="14"/><line x1="9" x2="15" y1="8" y2="8"/><line x1="17" x2="23" y1="16" y2="16"/></svg>
              <span id="mobile-dock-text">Journal notes · Past month · By date</span>
            </span>
            <span class="thumb-dock-badge tabular" id="mobile-dock-count">8</span>
          </button>
        </div>

        <!-- Desktop Focus Lens Floating Panel -->
        <section class="focus-lens-popover" id="desktop-lens" role="dialog" aria-label="WQL Focus Lens"></section>

        <!-- Mobile Sheet / Command Palette Overlay -->
        <div class="overlay-backdrop" id="overlay-backdrop" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
          <div class="overlay-dialog">
            <div class="sheet-header" id="sheet-header"></div>
            <div class="sheet-body" id="sheet-body"></div>
            <div class="sheet-footer" id="sheet-footer"></div>
          </div>
        </div>

        <div class="proto-toast" id="proto-toast" role="status" aria-live="polite"></div>
      </div>
    </div>
  </div>

  <script src="./shared-data.js"></script>
  <script>
    (function () {
      var W = window.WqlProto;

      var state = {
        vp: 'desktop',
        presetId: 'journal',
        committedQuery: W.cloneQuery(W.PRESETS.journal),
        draftQuery: null,
        desktopLensOpen: false,
        activeClauseId: null,     // clause id | '__add__'
        caretClauseId: null,
        pickerSearch: '',
        wqlDrawerOpen: false,
        overlayMode: null,        // null | 'mobile-lens' | 'palette'
        paletteTab: 'find',       // 'find' | 'wql'
        paletteWqlSubView: 'edit',// 'edit' | 'preview'
        findText: '',
        findScopeActive: true,
        toastTimer: null
      };

      var stageEl = document.getElementById('stage-viewport');
      var appFrameEl = document.getElementById('app-frame');
      var viewTitleEl = document.getElementById('view-title');
      var sentenceBarEl = document.getElementById('header-sentence-bar');
      var headerStatusEl = document.getElementById('header-status-pill');
      var advisoryContainer = document.getElementById('advisory-container');
      var contentBodyEl = document.getElementById('content-body');
      var desktopLensEl = document.getElementById('desktop-lens');
      var mobileDockText = document.getElementById('mobile-dock-text');
      var mobileDockCount = document.getElementById('mobile-dock-count');
      var overlayBackdrop = document.getElementById('overlay-backdrop');
      var sheetHeader = document.getElementById('sheet-header');
      var sheetBody = document.getElementById('sheet-body');
      var sheetFooter = document.getElementById('sheet-footer');
      var toastEl = document.getElementById('proto-toast');

      function activeQuery() {
        return state.draftQuery || state.committedQuery;
      }

      function isMobileContext() {
        return state.vp === 'mobile' || window.innerWidth <= 767;
      }

      function showToast(msg) {
        toastEl.innerHTML = W.icons.check(14) + '<span>' + W.escapeHtml(msg) + '</span>';
        toastEl.classList.add('is-shown');
        clearTimeout(state.toastTimer);
        state.toastTimer = setTimeout(function () { toastEl.classList.remove('is-shown'); }, 2400);
      }

      function phraseForClause(c) {
        if (c.type === 'target') {
          var map = { note: 'Notes', block: 'Workout blocks', effort: 'Efforts', session: 'Sessions', page: 'Guide pages', notebook: 'Notebooks', tag: 'Tags', equipment: 'Equipment' };
          return map[c.value] || c.value;
        }
        if (c.type === 'agg') return c.value.toUpperCase();
        if (c.type === 'metric') return c.value;
        if (c.type === 'notebook') return (c.excluded ? 'Not ' : 'in ') + (c.value === '*' ? 'all notebooks' : c.value);
        if (c.type === 'effort') return (c.excluded ? 'excl. ' : 'on ') + c.value;
        if (c.type === 'tags') return (c.excluded ? 'excl. #' : '#') + c.value;
        if (c.type === 'equipment') return 'gear: ' + c.value;
        if (c.type === 'quality') return 'focus: ' + c.value;
        if (c.type === 'text') return '"' + c.value + '"';
        if (c.type === 'time') {
          if (c.value === 'last 1w') return 'Past week';
          if (c.value === 'last 4w') return 'Past month';
          if (c.value === 'last 12w') return 'Past 12w';
          if (c.value === 'last 1y') return 'Past year';
          if (c.value === 'all') return 'Any time';
          return c.value;
        }
        if (c.type === 'groupBy') return 'Grouped by ' + c.value;
        return c.value;
      }

      function renderSentenceBar(q) {
        var html = q.clauses.map(function (c, i) {
          var isAct = state.desktopLensOpen && state.activeClauseId === c.id;
          var cls = 'phrase-btn' + (isAct ? ' is-active' : '') + (c.ignored ? ' is-warn' : '');
          var sep = i > 0 ? '<span class="phrase-sep" aria-hidden="true">·</span>' : '';
          return (
            sep +
            '<button type="button" class="' + cls + '" data-action="open-phrase" data-clause-id="' + W.escapeHtml(c.id) + '" title="' + W.escapeHtml(c.reason || 'Edit ' + (W.CLAUSE_META[c.type] || {}).label) + '">' +
              (c.ignored ? W.icons.alert(13) : '') +
              '<span>' + W.escapeHtml(phraseForClause(c)) + '</span>' +
            '</button>'
          );
        }).join('');

        html +=
          '<span class="phrase-sep" aria-hidden="true">·</span>' +
          '<button type="button" class="add-filter-btn' + (state.desktopLensOpen && state.activeClauseId === '__add__' ? ' is-active' : '') + '" data-action="open-phrase" data-clause-id="__add__">' +
            W.icons.plus(13) +
            '<span>Filter</span>' +
          '</button>';

        return html;
      }

      function renderSpineRailHtml(q) {
        var html = q.clauses.map(function (c) {
          var disp = W.formatClauseDisplay(c);
          var meta = W.CLAUSE_META[c.type] || { label: c.type, removable: true };
          var isAct = state.activeClauseId === c.id;
          var isCaret = state.caretClauseId === c.id;
          var cls = 'spine-tab' + (isAct ? ' is-active' : '') + (isCaret ? ' is-caret-match' : '') + (c.ignored ? ' is-warn' : '');
          return (
            '<div class="' + cls + '" data-pill-wrap="' + W.escapeHtml(c.id) + '">' +
              '<button type="button" class="spine-tab-main" data-action="select-spine-tab" data-clause-id="' + W.escapeHtml(c.id) + '" role="tab" aria-selected="' + (isAct ? 'true' : 'false') + '">' +
                (c.ignored ? W.icons.alert(13) : '') +
                '<span class="spine-tab-key">' + W.escapeHtml(disp.key) + ':</span>' +
                '<span class="mono" style="font-size:12px">' + W.escapeHtml(disp.val) + '</span>' +
              '</button>' +
              (meta.removable
                ? '<button type="button" class="spine-tab-remove" data-action="remove-clause" data-clause-id="' + W.escapeHtml(c.id) + '" aria-label="Remove ' + W.escapeHtml(disp.key) + '">' + W.icons.x(12) + '</button>'
                : '') +
            '</div>'
          );
        }).join('');

        html +=
          '<button type="button" class="spine-add-tab' + (state.activeClauseId === '__add__' ? ' is-active' : '') + '" data-action="select-spine-tab" data-clause-id="__add__" role="tab" aria-selected="' + (state.activeClauseId === '__add__' ? 'true' : 'false') + '">' +
            W.icons.plus(13) +
            '<span>Add filter</span>' +
          '</button>';

        return '<div class="spine-rail-bar" role="tablist" aria-label="Query clauses">' + html + '</div>';
      }

      function renderCanvasHtml(q) {
        var cid = state.activeClauseId || (q.clauses[0] ? q.clauses[0].id : '__add__');
        var clause = cid === '__add__' ? null : q.clauses.find(function (c) { return c.id === cid; });
        var idx = clause ? q.clauses.indexOf(clause) : -1;
        return (
          '<div class="lens-canvas">' +
            W.renderPickerBodyHtml({
              clause: clause,
              clauseIdx: idx,
              totalClauses: q.clauses.length,
              search: state.pickerSearch
            }) +
          '</div>'
        );
      }

      function renderWqlDrawerHtml(q, rawInputId) {
        var wqlText = W.serializeWql(q);
        var tokens = W.serializeTokens(q);
        var tokensHtml = tokens.map(function (t) {
          var isHi = t.clauseId && (t.clauseId === state.activeClauseId || t.clauseId === state.caretClauseId);
          var cls = 'wql-tok ' + t.tokenClass + (isHi ? ' is-highlighted' : '') + (t.warn ? ' is-warn-tok' : '');
          return t.clauseId
            ? '<button type="button" class="' + cls + '" data-action="token-jump" data-clause="' + W.escapeHtml(t.clauseId) + '">' + W.escapeHtml(t.text) + '</button>'
            : '<span class="' + cls + '">' + W.escapeHtml(t.text) + '</span>';
        }).join('');

        return (
          '<button type="button" class="wql-drawer-toggle" data-action="toggle-wql-drawer" aria-expanded="' + state.wqlDrawerOpen + '">' +
            '<span style="display:inline-flex;align-items:center;gap:6px;font-weight:600;flex-shrink:0">' + W.icons.code(14) + '<span>WQL</span></span>' +
            '<span class="wql-drawer-code">' + W.escapeHtml(wqlText) + '</span>' +
            '<span style="flex-shrink:0">' + (state.wqlDrawerOpen ? W.icons.chevronDown(14) : W.icons.chevronUp(14)) + '</span>' +
          '</button>' +
          (state.wqlDrawerOpen
            ? '<div class="wql-token-strip" style="border-bottom:none;border-top:1px solid var(--border-soft)">' +
                '<div class="wql-token-row">' +
                  '<div class="wql-tokens-interactive">' + tokensHtml + '</div>' +
                  '<div class="wql-raw-input-wrap">' +
                    '<input type="text" class="wql-raw-input" id="' + rawInputId + '" data-role="wql-raw-input" value="' + W.escapeHtml(wqlText) + '" aria-label="Edit raw WQL" />' +
                  '</div>' +
                '</div>' +
                '<div class="wql-sync-hint">Moving the caret or clicking any token jumps the notched spine tab above without stealing text focus.</div>' +
              '</div>'
            : '')
        );
      }

      function renderView() {
        var preset = W.PRESETS[state.presetId];
        var q = state.committedQuery;
        var items = W.filterItems(q, '');
        var ignored = W.getIgnoredClauses(q);

        viewTitleEl.textContent = preset.title;
        sentenceBarEl.innerHTML = renderSentenceBar(q);

        if (ignored.length > 0) {
          headerStatusEl.className = 'status-pill is-warn desktop-only-controls tabular';
          headerStatusEl.textContent = ignored.length + ' ignored';
        } else {
          headerStatusEl.className = 'status-pill is-ok desktop-only-controls tabular';
          headerStatusEl.textContent = items.length + (q.kind === 'aggregate' ? ' sessions' : ' matches');
        }

        if (ignored.length > 0) {
          advisoryContainer.innerHTML =
            '<div class="advisory-strip">' +
              '<div class="advisory-strip-msg">' + W.icons.alert(15) + '<span>' + ignored.length + ' filter(s) ignored on <code>:effort</code> (equipment, quality).</span></div>' +
              '<button type="button" class="btn btn-warn" data-action="remove-all-ignored">Remove ignored (' + ignored.length + ')</button>' +
            '</div>';
        } else {
          advisoryContainer.innerHTML = '';
        }

        contentBodyEl.innerHTML =
          '<div class="results-summary-bar">' +
            '<span>Showing <strong style="color:var(--fg)" class="tabular">' + items.length + '</strong> of ' + W.SAMPLE_ITEMS.length + ' entries</span>' +
            '<span class="mono" style="font-size:12px">' + W.escapeHtml(W.serializeWql(q)) + '</span>' +
          '</div>' +
          W.renderSampleResultsHtml(q, items);

        mobileDockText.textContent = W.humanSummary(q, preset.title);
        mobileDockCount.textContent = String(items.length);

        if (state.desktopLensOpen && !state.overlayMode && !isMobileContext()) {
          desktopLensEl.classList.add('is-open');
          var rawInp = document.getElementById('lens-raw-input');
          var hadFocus = rawInp && document.activeElement === rawInp;
          var pos = hadFocus ? rawInp.selectionStart : null;

          desktopLensEl.innerHTML =
            renderSpineRailHtml(q) +
            renderCanvasHtml(q) +
            renderWqlDrawerHtml(q, 'lens-raw-input') +
            '<div class="sheet-footer">' +
              '<span class="status-pill ' + (ignored.length ? 'is-warn' : 'is-ok') + ' tabular">' + (ignored.length ? ignored.length + ' ignored' : items.length + ' of ' + W.SAMPLE_ITEMS.length + ' matching') + '</span>' +
              '<div class="sheet-footer-actions">' +
                '<button type="button" class="btn btn-secondary" data-action="close-desktop-lens">Done</button>' +
              '</div>' +
            '</div>';

          if (hadFocus) {
            var restored = document.getElementById('lens-raw-input');
            if (restored) { restored.focus(); if (pos !== null) restored.setSelectionRange(pos, pos); }
          }
        } else {
          desktopLensEl.classList.remove('is-open');
          desktopLensEl.innerHTML = '';
        }

        renderOverlay();
      }

      function renderOverlay() {
        if (!state.overlayMode) {
          overlayBackdrop.classList.remove('is-open');
          return;
        }
        overlayBackdrop.classList.add('is-open');
        var preset = W.PRESETS[state.presetId];
        var q = activeQuery();
        var items = W.filterItems(q, state.paletteTab === 'find' ? state.findText : '');
        var ignored = W.getIgnoredClauses(q);

        if (state.overlayMode === 'mobile-lens') {
          sheetHeader.style.padding = '0';
          sheetHeader.innerHTML =
            '<div class="sheet-header-row" style="padding:12px 14px 8px">' +
              '<h2 class="sheet-title" id="sheet-title">Edit ' + W.escapeHtml(preset.title) + ' Query</h2>' +
              '<button type="button" class="icon-btn" data-action="dismiss-overlay" aria-label="Close lens">' + W.icons.x(16) + '</button>' +
            '</div>' +
            renderSpineRailHtml(q);

          var activeTab = sheetHeader.querySelector('.spine-tab.is-active, .spine-add-tab.is-active');
          if (activeTab && activeTab.scrollIntoView) activeTab.scrollIntoView({ inline: 'nearest', block: 'nearest' });

          sheetBody.style.padding = '0';
          sheetBody.innerHTML = renderCanvasHtml(q);

          sheetFooter.style.padding = '0';
          sheetFooter.style.flexDirection = 'column';
          sheetFooter.style.alignItems = 'stretch';
          sheetFooter.style.gap = '0';
          sheetFooter.innerHTML =
            renderWqlDrawerHtml(q, 'mobile-lens-raw-input') +
            '<div style="display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border-top:1px solid var(--border);background:var(--popover)">' +
              '<span class="status-pill ' + (ignored.length ? 'is-warn' : 'is-ok') + ' tabular">' + items.length + ' matches</span>' +
              '<div class="sheet-footer-actions">' +
                '<button type="button" class="btn btn-secondary" data-action="dismiss-overlay">Cancel</button>' +
                '<button type="button" class="btn btn-primary" data-action="apply-overlay">Apply · ' + items.length + '</button>' +
              '</div>' +
            '</div>';
          return;
        }

        // Command Palette mode
        if (state.paletteTab === 'find') {
          sheetHeader.style.padding = '12px 16px';
          sheetHeader.innerHTML =
            '<div class="sheet-header-row">' +
              '<h2 class="sheet-title" id="sheet-title">Command Palette</h2>' +
              '<div style="display:flex;align-items:center;gap:8px">' +
                '<button type="button" class="btn btn-secondary" data-action="set-palette-tab" data-tab="wql">' + W.icons.sliders(14) + '<span>Compose WQL</span></button>' +
                '<button type="button" class="icon-btn" data-action="dismiss-overlay" aria-label="Close palette">' + W.icons.x(16) + '</button>' +
              '</div>' +
            '</div>' +
            '<div class="find-box">' +
              W.icons.search(16) +
              '<input type="text" id="palette-find-input" value="' + W.escapeHtml(state.findText) + '" placeholder="Search workouts, notes, movements… (type : for WQL)" aria-label="Find records" />' +
              (state.findScopeActive
                ? '<span class="scope-chip"><span>' + W.escapeHtml(preset.defaultScopeLabel) + '</span><button type="button" data-action="clear-find-scope" aria-label="Clear scope">' + W.icons.x(12) + '</button></span>'
                : '') +
            '</div>';

          var pool = state.findScopeActive ? items : W.SAMPLE_ITEMS;
          sheetBody.style.padding = '12px 16px';
          sheetBody.innerHTML =
            '<div style="display:flex;flex-direction:column;gap:6px">' +
              '<div class="option-group-title">' + (state.findScopeActive ? W.escapeHtml(preset.title) + ' matches' : 'All workspace entries') + '</div>' +
              W.renderPaletteResultsHtml(pool, state.findText) +
            '</div>';

          sheetFooter.style.padding = '10px 16px';
          sheetFooter.style.flexDirection = 'row';
          sheetFooter.style.alignItems = 'center';
          sheetFooter.innerHTML =
            '<span style="font-size:12px;color:var(--muted-fg)">Plain text search · Type <code>:</code> for Focus-Lens WQL</span>' +
            '<div class="sheet-footer-actions"><button type="button" class="btn btn-secondary" data-action="dismiss-overlay">Close</button></div>';
        } else {
          // Palette WQL tab — uses the exact same Focus-Lens Spine + Edit/Preview toggle on mobile!
          var subSegHtml =
            '<div class="proto-seg" role="tablist" aria-label="WQL view">' +
              '<button type="button" role="tab" aria-selected="' + (state.paletteWqlSubView === 'edit') + '" class="' + (state.paletteWqlSubView === 'edit' ? 'is-active' : '') + '" data-action="set-wql-subview" data-sub="edit">Edit filter</button>' +
              '<button type="button" role="tab" aria-selected="' + (state.paletteWqlSubView === 'preview') + '" class="' + (state.paletteWqlSubView === 'preview' ? 'is-active' : '') + '" data-action="set-wql-subview" data-sub="preview">Preview (' + items.length + ')</button>' +
            '</div>';

          sheetHeader.style.padding = '0';
          sheetHeader.innerHTML =
            '<div class="sheet-header-row" style="padding:12px 14px 8px">' +
              '<div style="display:flex;align-items:center;gap:8px">' +
                '<button type="button" class="btn btn-ghost" data-action="set-palette-tab" data-tab="find" style="padding:4px 8px">' + W.icons.chevronLeft(14) + '<span>Find</span></button>' +
                '<h2 class="sheet-title" id="sheet-title">WQL Lens</h2>' +
              '</div>' +
              '<div style="display:flex;align-items:center;gap:6px">' +
                subSegHtml +
                '<button type="button" class="icon-btn" data-action="dismiss-overlay" aria-label="Close palette">' + W.icons.x(16) + '</button>' +
              '</div>' +
            '</div>' +
            (state.paletteWqlSubView === 'edit' ? renderSpineRailHtml(q) : '');

          sheetBody.style.padding = state.paletteWqlSubView === 'preview' ? '12px 14px' : '0';
          sheetBody.innerHTML = state.paletteWqlSubView === 'preview'
            ? '<div style="display:flex;flex-direction:column;gap:6px">' +
                '<div class="option-group-title">Matching records (' + items.length + ')</div>' +
                W.renderPaletteResultsHtml(items, '') +
              '</div>'
            : renderCanvasHtml(q);

          sheetFooter.style.padding = '0';
          sheetFooter.style.flexDirection = 'column';
          sheetFooter.style.alignItems = 'stretch';
          sheetFooter.style.gap = '0';
          sheetFooter.innerHTML =
            renderWqlDrawerHtml(q, 'palette-lens-raw-input') +
            '<div style="display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border-top:1px solid var(--border);background:var(--popover)">' +
              '<span class="status-pill ' + (ignored.length ? 'is-warn' : 'is-ok') + ' tabular">' + items.length + ' of ' + W.SAMPLE_ITEMS.length + '</span>' +
              '<div class="sheet-footer-actions">' +
                '<button type="button" class="btn btn-secondary" data-action="dismiss-overlay">Cancel</button>' +
                '<button type="button" class="btn btn-primary" data-action="apply-overlay">Apply to ' + W.escapeHtml(preset.title) + '</button>' +
              '</div>' +
            '</div>';
        }
      }

      function focusActiveSpineTab() {
        var cid = state.activeClauseId;
        if (!cid) return;
        var root = state.overlayMode ? sheetHeader : desktopLensEl;
        var el = root.querySelector('[data-pill-wrap="' + cid + '"] .spine-tab-main, [data-clause-id="' + cid + '"]');
        if (el) {
          el.focus();
          if (el.scrollIntoView) el.scrollIntoView({ inline: 'nearest', block: 'nearest' });
        }
      }

      function focusCanvasSearch() {
        var root = state.overlayMode ? sheetBody : desktopLensEl;
        var inp = root.querySelector('[data-role="picker-search"], [data-role="free-text-val"]');
        if (inp) inp.focus();
      }

      function mutateQuery(fn) {
        var q = activeQuery();
        fn(q);
        W.updateIgnoredFlags(q);
        renderView();
      }

      function stepClause(delta) {
        var q = activeQuery();
        if (!q.clauses.length) return;
        var idx = q.clauses.findIndex(function (c) { return c.id === state.activeClauseId; });
        var next = idx === -1 ? 0 : (idx + delta + q.clauses.length) % q.clauses.length;
        state.activeClauseId = q.clauses[next].id;
        state.pickerSearch = '';
        renderView();
        focusCanvasSearch();
      }

      function syncCaret(inputEl) {
        var pos = inputEl.selectionStart || 0;
        var q = activeQuery();
        var tokens = W.serializeTokens(q);
        var matchId = W.clauseAtOffset(tokens, pos);
        if (matchId && matchId !== state.activeClauseId) {
          state.caretClauseId = matchId;
          var root = state.overlayMode ? document.querySelector('.overlay-dialog') : desktopLensEl;
          if (!root) return;
          Array.prototype.forEach.call(root.querySelectorAll('.spine-tab'), function (tab) {
            tab.classList.toggle('is-caret-match', tab.getAttribute('data-pill-wrap') === matchId);
          });
          Array.prototype.forEach.call(root.querySelectorAll('.wql-tok[data-clause]'), function (tok) {
            tok.classList.toggle('is-highlighted', tok.getAttribute('data-clause') === matchId);
          });
        }
      }

      function openOverlay(mode, tab) {
        state.overlayMode = mode;
        state.draftQuery = W.cloneQuery(state.committedQuery);
        state.desktopLensOpen = false;
        state.activeClauseId = state.draftQuery.clauses[0] ? state.draftQuery.clauses[0].id : '__add__';
        state.pickerSearch = '';
        state.paletteWqlSubView = 'edit';
        if (tab) state.paletteTab = tab;
        renderView();
        if (mode === 'palette' && state.paletteTab === 'find') {
          var fi = document.getElementById('palette-find-input');
          if (fi) fi.focus();
        }
      }

      function dismissOverlay() {
        state.overlayMode = null;
        state.draftQuery = null;
        state.activeClauseId = null;
        renderView();
      }

      function applyOverlay() {
        if (state.draftQuery) state.committedQuery = W.cloneQuery(state.draftQuery);
        dismissOverlay();
        showToast('Applied query to ' + W.PRESETS[state.presetId].title);
      }

      appFrameEl.addEventListener('click', function (e) {
        var target = e.target.closest('[data-action]');
        if (!target) {
          if (state.desktopLensOpen && !e.target.closest('#desktop-lens') && !e.target.closest('#header-sentence-bar')) {
            state.desktopLensOpen = false;
            state.activeClauseId = null;
            renderView();
          }
          return;
        }

        var action = target.getAttribute('data-action');
        if (action === 'open-phrase') {
          var cid = target.getAttribute('data-clause-id');
          if (state.desktopLensOpen && state.activeClauseId === cid) {
            state.desktopLensOpen = false;
            state.activeClauseId = null;
          } else {
            state.desktopLensOpen = true;
            state.activeClauseId = cid;
            state.pickerSearch = '';
          }
          renderView();
          if (state.desktopLensOpen) focusCanvasSearch();
        } else if (action === 'select-spine-tab' || action === 'token-jump') {
          var tid = target.getAttribute('data-clause-id') || target.getAttribute('data-clause');
          state.activeClauseId = tid;
          state.pickerSearch = '';
          renderView();
          if (action === 'select-spine-tab') focusCanvasSearch();
        } else if (action === 'close-desktop-lens') {
          state.desktopLensOpen = false;
          state.activeClauseId = null;
          renderView();
        } else if (action === 'close-picker') {
          // Return focus cleanly to the active spine tab
          focusActiveSpineTab();
        } else if (action === 'step-prev') {
          stepClause(-1);
        } else if (action === 'step-next') {
          stepClause(1);
        } else if (action === 'remove-clause') {
          var rid = target.getAttribute('data-clause-id');
          mutateQuery(function (q) { q.clauses = q.clauses.filter(function (c) { return c.id !== rid; }); });
          var q = activeQuery();
          if (state.activeClauseId === rid) {
            state.activeClauseId = q.clauses[0] ? q.clauses[0].id : '__add__';
          }
          renderView();
        } else if (action === 'remove-all-ignored') {
          mutateQuery(function (q) {
            var ids = W.getIgnoredClauses(q).map(function (c) { return c.id; });
            q.clauses = q.clauses.filter(function (c) { return ids.indexOf(c.id) === -1; });
            if (ids.indexOf(state.activeClauseId) !== -1) {
              state.activeClauseId = q.clauses[0] ? q.clauses[0].id : '__add__';
            }
          });
          showToast('Removed ignored filters');
        } else if (action === 'pick-option') {
          var val = target.getAttribute('data-value');
          mutateQuery(function (q) {
            var cl = q.clauses.find(function (c) { return c.id === state.activeClauseId; });
            if (cl) cl.value = val;
          });
          focusActiveSpineTab();
        } else if (action === 'pick-add-filter') {
          var ft = target.getAttribute('data-filter-type');
          var dv = target.getAttribute('data-default-val');
          var newId = 'c-' + ft + '-' + Date.now();
          mutateQuery(function (q) {
            var ex = q.clauses.find(function (c) { return c.type === ft; });
            if (ex) newId = ex.id;
            else q.clauses.push({ id: newId, type: ft, value: dv, excluded: false });
          });
          state.activeClauseId = newId;
          state.pickerSearch = '';
          renderView();
          focusCanvasSearch();
        } else if (action === 'apply-custom-dates') {
          var root = state.overlayMode ? sheetBody : desktopLensEl;
          var sVal = (root.querySelector('[data-role="date-start"]') || {}).value || '';
          var eVal = (root.querySelector('[data-role="date-end"]') || {}).value || '';
          if (!sVal || !eVal || sVal > eVal) {
            showToast('Start date must be on or before End date');
            return;
          }
          mutateQuery(function (q) {
            var cl = q.clauses.find(function (c) { return c.id === state.activeClauseId; });
            if (cl) { cl.value = 'from ' + sVal + ' to ' + eVal; cl.startDate = sVal; cl.endDate = eVal; }
          });
          focusActiveSpineTab();
        } else if (action === 'apply-free-text') {
          var ftRoot = state.overlayMode ? sheetBody : desktopLensEl;
          var txt = ((ftRoot.querySelector('[data-role="free-text-val"]') || {}).value || '').trim();
          if (!txt) return;
          mutateQuery(function (q) {
            var cl = q.clauses.find(function (c) { return c.id === state.activeClauseId; });
            if (cl) cl.value = txt;
          });
          focusActiveSpineTab();
        } else if (action === 'toggle-wql-drawer') {
          state.wqlDrawerOpen = !state.wqlDrawerOpen;
          renderView();
        } else if (action === 'dismiss-overlay') {
          dismissOverlay();
        } else if (action === 'apply-overlay') {
          applyOverlay();
        } else if (action === 'set-palette-tab') {
          state.paletteTab = target.getAttribute('data-tab');
          state.paletteWqlSubView = 'edit';
          if (state.paletteTab === 'wql' && !state.activeClauseId) {
            state.activeClauseId = activeQuery().clauses[0].id;
          }
          renderOverlay();
          if (state.paletteTab === 'find') {
            var fi = document.getElementById('palette-find-input');
            if (fi) fi.focus();
          }
        } else if (action === 'set-wql-subview') {
          state.paletteWqlSubView = target.getAttribute('data-sub');
          renderOverlay();
        } else if (action === 'clear-find-scope') {
          state.findScopeActive = false;
          renderOverlay();
        } else if (action === 'open-result') {
          var title = target.getAttribute('data-title');
          dismissOverlay();
          showToast('Opened: ' + title);
        }
      });

      appFrameEl.addEventListener('change', function (e) {
        if (e.target.getAttribute('data-action') === 'toggle-exclude') {
          var checked = e.target.checked;
          mutateQuery(function (q) {
            var cl = q.clauses.find(function (c) { return c.id === state.activeClauseId; });
            if (cl) cl.excluded = checked;
          });
          focusCanvasSearch();
        }
      });

      appFrameEl.addEventListener('input', function (e) {
        var role = e.target.getAttribute('data-role');
        if (role === 'picker-search') {
          state.pickerSearch = e.target.value;
          var root = state.overlayMode ? sheetBody : desktopLensEl;
          var scroll = root.querySelector('.picker-options-scroll');
          var tmp = document.createElement('div');
          tmp.innerHTML = renderCanvasHtml(activeQuery());
          var newScroll = tmp.querySelector('.picker-options-scroll');
          if (scroll && newScroll) scroll.innerHTML = newScroll.innerHTML;
        } else if (e.target.id === 'palette-find-input') {
          state.findText = e.target.value;
          if (state.findText.charAt(0) === ':') {
            state.paletteTab = 'wql';
            state.wqlDrawerOpen = true;
            state.activeClauseId = activeQuery().clauses[0].id;
            renderOverlay();
            return;
          }
          var preset = W.PRESETS[state.presetId];
          var pool = state.findScopeActive ? W.filterItems(activeQuery(), '') : W.SAMPLE_ITEMS;
          sheetBody.innerHTML =
            '<div style="display:flex;flex-direction:column;gap:6px">' +
              '<div class="option-group-title">' + (state.findScopeActive ? W.escapeHtml(preset.title) + ' matches' : 'All workspace entries') + '</div>' +
              W.renderPaletteResultsHtml(pool, state.findText) +
            '</div>';
        } else if (role === 'wql-raw-input') {
          var parsed = W.parseWqlLoose(e.target.value, activeQuery());
          if (parsed) {
            if (state.overlayMode) state.draftQuery = parsed;
            else state.committedQuery = parsed;
          }
          syncCaret(e.target);
        }
      });

      appFrameEl.addEventListener('click', function (e) {
        if (e.target.getAttribute('data-role') === 'wql-raw-input') syncCaret(e.target);
      });
      appFrameEl.addEventListener('keyup', function (e) {
        if (e.target.getAttribute('data-role') === 'wql-raw-input') syncCaret(e.target);
      });

      appFrameEl.addEventListener('keydown', function (e) {
        if (e.target.getAttribute('data-role') === 'wql-raw-input' && e.altKey && e.key === 'ArrowDown') {
          e.preventDefault();
          if (state.caretClauseId) {
            state.activeClauseId = state.caretClauseId;
            renderView();
            focusCanvasSearch();
          }
          return;
        }
        if (e.key === 'Escape') {
          if (e.target.closest('.lens-canvas')) {
            e.preventDefault();
            focusActiveSpineTab();
            return;
          }
          if (state.desktopLensOpen) {
            e.preventDefault();
            var prev = state.activeClauseId;
            state.desktopLensOpen = false;
            renderView();
            var pBtn = sentenceBarEl.querySelector('[data-clause-id="' + prev + '"]');
            if (pBtn) pBtn.focus();
            return;
          }
          if (state.overlayMode) {
            e.preventDefault();
            dismissOverlay();
          }
        }
        if (e.key === 'Tab' && e.target.closest('.lens-canvas')) {
          e.preventDefault();
          stepClause(e.shiftKey ? -1 : 1);
        }
        if ((e.key === 'ArrowLeft' || e.key === 'ArrowRight') && (e.target.classList.contains('spine-tab-main') || e.target.classList.contains('spine-add-tab'))) {
          var rail = e.target.closest('.spine-rail-bar');
          if (!rail) return;
          var items = Array.prototype.slice.call(rail.querySelectorAll('.spine-tab-main, .spine-add-tab'));
          var idx = items.indexOf(e.target);
          if (idx !== -1) {
            e.preventDefault();
            var nxt = items[(idx + (e.key === 'ArrowRight' ? 1 : -1) + items.length) % items.length];
            nxt.focus();
          }
        }
      });

      document.addEventListener('keydown', function (e) {
        if ((e.metaKey || e.ctrlKey) && (e.key.toLowerCase() === 'k' || e.key === '/')) {
          e.preventDefault();
          if (state.overlayMode === 'palette') dismissOverlay();
          else openOverlay('palette', 'find');
        }
      });

      Array.prototype.forEach.call(document.querySelectorAll('[data-set-vp]'), function (btn) {
        btn.addEventListener('click', function () {
          state.vp = btn.getAttribute('data-set-vp');
          stageEl.setAttribute('data-vp', state.vp);
          Array.prototype.forEach.call(document.querySelectorAll('[data-set-vp]'), function (b) {
            b.classList.toggle('is-active', b === btn);
          });
          state.desktopLensOpen = false;
          renderView();
        });
      });

      Array.prototype.forEach.call(document.querySelectorAll('[data-set-preset]'), function (btn) {
        btn.addEventListener('click', function () {
          state.presetId = btn.getAttribute('data-set-preset');
          state.committedQuery = W.cloneQuery(W.PRESETS[state.presetId]);
          state.draftQuery = state.overlayMode ? W.cloneQuery(state.committedQuery) : null;
          state.activeClauseId = state.committedQuery.clauses[0] ? state.committedQuery.clauses[0].id : '__add__';
          state.caretClauseId = null;
          state.findScopeActive = true;
          Array.prototype.forEach.call(document.querySelectorAll('[data-set-preset]'), function (b) {
            b.classList.toggle('is-active', b === btn);
          });
          renderView();
        });
      });

      document.getElementById('open-palette-toolbar').addEventListener('click', function () { openOverlay('palette', 'find'); });
      document.getElementById('open-palette-header').addEventListener('click', function () { openOverlay('palette', 'find'); });
      document.getElementById('open-mobile-sheet').addEventListener('click', function () { openOverlay('mobile-lens'); });
      document.getElementById('new-entry-btn').addEventListener('click', function () { showToast('New entry triggered for ' + W.PRESETS[state.presetId].title); });
      overlayBackdrop.addEventListener('click', function (e) { if (e.target === overlayBackdrop) dismissOverlay(); });

      renderView();
    })();
  </script>
</body>
</html>
