<!DOCTYPE html>
<html lang="en" class="antialiased lg:bg-zinc-100 dark:bg-zinc-900 dark:lg:bg-zinc-950">

<head>
  <meta charset="UTF-8" />
  <script>
    // Pre-paint theme boot (Dark-Mode Standard host rule, wayfinder #999):
    // resolve the theme BEFORE first paint so system-dark users never flash
    // light. Must agree with ThemeProvider: same storage key, same class
    // target (documentElement), same light|dark|system semantics.
    (function () {
      try {
        var theme = localStorage.getItem('wod-wiki-playground-theme') || 'system';
        if (theme === 'system') {
          theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        var root = document.documentElement;
        root.classList.remove('light', 'dark');
        root.classList.add(theme);
        root.setAttribute('data-theme-boot', '1');
      } catch (e) { /* storage blocked — ThemeProvider still applies post-mount */ }
    })();
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wod.Wiki</title>
  <meta name="description" content="Wod.Wiki — write, run, and analyze your workouts. Query and explore your training data." />
  <link rel="canonical" href="https://wod.wiki/" />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Wod.Wiki" />
  <meta property="og:title" content="Wod.Wiki — workouts, notes, analytics" />
  <meta property="og:description" content="Wod.Wiki — write, run, and analyze your workouts. Query and explore your training data." />
  <meta property="og:url" content="https://wod.wiki/" />
  <meta property="og:image" content="https://wod.wiki/images/wod-wiki-logo-light.png" />
  <meta name="twitter:card" content="summary" />
  <link rel="icon" type="image/png" href="%BASE_URL%images/wod-wiki-logo-light.png" />
  <!-- Fonts are self-hosted via @fontsource imports in app/main.tsx (external render-blocking font stylesheets once blocked startup). -->
  <!-- Google tag is injected by app/lib/telemetry-gtag.ts unless opted out in settings (PRD #767). -->
</head>

<body class="min-h-svh w-full bg-white dark:bg-zinc-900">
  <script>
    // Restore path stored by 404.html (GitHub Pages SPA routing)
    (function () {
      var r = sessionStorage.getItem('spa-redirect');
      if (r) {
        sessionStorage.removeItem('spa-redirect');
        history.replaceState(null, '', r.replace(location.origin, '') || '/');
      }
    })();
  </script>
  <div id="root"><div data-testid="boot-shell" role="status" style="min-height:100svh;display:grid;place-items:center;font:14px system-ui,sans-serif">Downloading the app shell…</div></div>
  <script type="module" src="/app/main.tsx"></script>
</body>

</html>
