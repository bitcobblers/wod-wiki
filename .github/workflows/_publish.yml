name: Publish

# Production publication leg on main (docs/build-process.canvas):
#   - publish-npm:   publishes @bitcobblers/* from packages-dist to npmjs.org
#   - publish-pages: deploys playground-dist to GitHub Pages (https://wod.wiki)

on:
  workflow_call:
    inputs:
      run-id:
        description: Optional workflow run ID to download packages-dist and playground-dist from (defaults to current run)
        required: false
        type: string
        default: ''
    outputs:
      page-url:
        value: ${{ jobs.publish-pages.outputs.page-url }}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  publish-npm:
    name: Publish @bitcobblers/* to npm
    runs-on: ubuntu-22.04
    environment: npm
    permissions:
      contents: read
      actions: read
    steps:
      - name: Configure npm auth
        uses: actions/setup-node@v6
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Download packages-dist (current run)
        if: inputs.run-id == ''
        uses: actions/download-artifact@v7
        with:
          name: packages-dist
          path: packages/

      - name: Download packages-dist (from main build run)
        if: inputs.run-id != ''
        uses: actions/download-artifact@v7
        with:
          name: packages-dist
          path: packages/
          run-id: ${{ inputs.run-id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish workspace packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          for pkg in packages/*/; do
            if [ -f "$pkg/package.json" ]; then
              echo "Publishing $pkg"
              (cd "$pkg" && npm publish --access public)
            fi
          done

  publish-pages:
    name: Publish wod.wiki (GitHub Pages)
    runs-on: ubuntu-22.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page-url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    steps:
      - name: Download playground-dist (current run)
        if: inputs.run-id == ''
        uses: actions/download-artifact@v7
        with:
          name: playground-dist
          path: ./dist/

      - name: Download playground-dist (from main build run)
        if: inputs.run-id != ''
        uses: actions/download-artifact@v7
        with:
          name: playground-dist
          path: ./dist/
          run-id: ${{ inputs.run-id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify hidden discovery files in Pages bundle
        run: |
          test -f ./dist/.well-known/agent-capabilities.json
          test -f ./dist/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist/

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
