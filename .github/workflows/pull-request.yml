name: CI – Pull Request

# Unified parallel PR pipeline (6-phase DAG):
#   slug/version → [ packages | verify(playground) | storybook ]   (phase 2, parallel)
#   → preview deploys to S3 <slug>/dist + <slug>/storybook          (phase 3)
#   → deployed-artifact e2e vs <slug>.preview.wod.wiki + <slug>.story.wod.wiki (4)
#   → pr summary / destroy on close                                 (5-6)
# Concurrency: a new push cancels the previous run for the same PR.


on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, closed]
    # Only pull requests targeting main run this preview pipeline. Production
    # publication is handled by the main branch workflow after merge; preview
    # resources are isolated by the source branch slug.
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  slug:
    runs-on: ubuntu-22.04
    if: github.event.action != 'closed'
    outputs:
      slug: ${{ steps.slug.outputs.slug }}
      preview-version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Derive branch slug
        id: slug
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          SLUG=$(echo "$BRANCH" | sed 's/[^a-z0-9]/-/g' | sed 's/--*/-/g' | sed 's/^-\+//;s/-\+$//' | tr '[:upper:]' '[:lower:]')
          echo "slug=$SLUG" >> "$GITHUB_OUTPUT"

      # PR previews may only increment {build}: major/minor come from the
      # latest release tag (read-only — never bumped here), build is the run
      # number, and the -pr.N prerelease suffix marks it as a preview.
      - name: Compute preview version
        id: version
        run: |
          LATEST_TAG=$(git for-each-ref refs/tags \
            --sort=-v:refname \
            --format '%(refname:short)' \
            | grep -E '^v?[0-9]+\.[0-9]+(\.[0-9]+)?$' \
            | head -1)

          if [ -n "$LATEST_TAG" ]; then
            BASE="${LATEST_TAG#v}"
          else
            BASE=$(node -p "require('./package.json').version")
          fi

          MAJOR=$(echo "$BASE" | cut -d. -f1)
          MINOR=$(echo "$BASE" | cut -d. -f2)
          VERSION="${MAJOR}.${MINOR}.${{ github.run_number }}-pr.${{ github.event.pull_request.number || 'manual' }}"
          echo "Preview version: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  # Static analysis — independent leg, runs in parallel with the whole DAG.
  # Self-disables when QODANA_TOKEN is unset (repo currently has no such secret).
  qodana:
    if: github.event.action != 'closed'
    uses: ./.github/workflows/_code_quality.yml
    secrets: inherit

  verify:
    if: github.event.action != 'closed'
    needs: [slug]
    uses: ./.github/workflows/_verify.yml
    secrets: inherit
    with:
      build-preview-artifact: true
      preview-base-path: /${{ needs.slug.outputs.slug }}/dist/
      app-version: ${{ needs.slug.outputs.preview-version }}



  build-test-packages:
    name: Build & test packages
    if: github.event.action != 'closed'
    needs: [slug]
    uses: ./.github/workflows/_packages.yml
    secrets: inherit
    with:
      version: ${{ needs.slug.outputs.preview-version }}

  storybook:
    name: Build, test & deploy Storybook
    if: github.event.action != 'closed'
    needs: [slug]
    uses: ./.github/workflows/_storybook.yml
    secrets: inherit
    with:
      version: ${{ needs.slug.outputs.preview-version }}
      deploy: true
      s3-prefix: ${{ needs.slug.outputs.slug }}/storybook
      cloudfront-prefix: /${{ needs.slug.outputs.slug }}/storybook*
  # Preview deploy — downloads the deploy-shaped playground bundle the verify
  # job already built (receiver included — verify builds it with the dedicated
  # chrome92 receiver pipeline) and syncs to S3 in one job. Storybook previews
  # are the engine repo's.
  preview:
    name: Deploy preview
    runs-on: ubuntu-22.04
    if: github.event.action != 'closed'
    needs: [slug, verify]
    environment: preview
    outputs:
      bundle-hash: ${{ steps.fingerprint.outputs.hash }}
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_PREVIEW_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_PREVIEW_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: us-east-1
      S3_BUCKET: ${{ secrets.AWS_PREVIEW_S3_BUCKET }}
      CF_DISTRIBUTION_ID: ${{ secrets.AWS_PREVIEW_CF_DISTRIBUTION_ID }}
      BRANCH_SLUG: ${{ needs.slug.outputs.slug }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      PREVIEW_VERSION: ${{ needs.slug.outputs.preview-version }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up environment (Bun + caches, no browsers)
        uses: ./.github/actions/setup-env
        with:
          browsers: ''

      - name: Download playground dist (built by verify)
        uses: actions/download-artifact@v7
        with:
          name: playground-dist
          path: ./dist/

      # Fingerprint of the deployed entry bundle; the e2e job polls the live
      # index.html until it references main-<hash>.js so tests never race a
      # stale CloudFront cache.
      - name: Compute build fingerprint
        id: fingerprint
        run: |
          HASH=$(ls dist/assets/main-*.js | head -n1 | sed -E 's/.*main-([^.]+)\.js/\1/')
          echo "hash=$HASH" >> "$GITHUB_OUTPUT"

      # Receiver ships via the playground-dist artifact — the verify job
      # builds it with the dedicated chrome92 receiver pipeline.


      - name: Deploy playground to S3
        run: |
          set -euo pipefail
          PREFIX="${{ env.BRANCH_SLUG }}/dist/"
          echo "Uploading to s3://$S3_BUCKET/$PREFIX"
          aws s3 sync ./dist/ "s3://$S3_BUCKET/$PREFIX" \
            --delete \
            --cache-control "max-age=300, must-revalidate" \
            --exclude "*.map"



      - name: Create CloudFront invalidation (best-effort)
        continue-on-error: true
        run: |
          set -uo pipefail
          PREFIX="/${{ env.BRANCH_SLUG }}/*"
          if aws cloudfront create-invalidation \
               --distribution-id "$CF_DISTRIBUTION_ID" \
               --paths "$PREFIX"; then
            echo "CloudFront invalidation submitted for $PREFIX"
          else
            echo "::warning::CloudFront invalidation failed; content refreshes within 5 minutes via max-age."
          fi

      - name: Post preview link
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const slug = process.env.BRANCH_SLUG;
            const pr = process.env.PR_NUMBER;
            const version = process.env.PREVIEW_VERSION;
            const previewUrl = `https://${slug}.preview.wod.wiki`;
            const storybookUrl = `https://${slug}.story.wod.wiki`;
            const e2eUrl = `https://${slug}.e2e.wod.wiki`;
            const marker = `<!-- wod-wiki-preview-${pr} -->`;
            const body = `${marker}\n` +
              `## 🚀 Preview deployed\n\n` +
              `| Item | Value |\n` +
              `| --- | --- |\n` +
              `| PR | #${pr} |\n` +
              `| Branch | \`${slug}\` |\n` +
              `| Version | \`${version}\` |\n` +
              `| 🚀 Playground | [${previewUrl}](${previewUrl}) |\n` +
              `| 📚 Storybook | [${storybookUrl}](${storybookUrl}) |\n` +
              `| 📊 E2E report | [${e2eUrl}](${e2eUrl}) (after the E2E jobs run) |\n\n` +
              `> Build and deploy powered by AWS S3 + CloudFront. ` +
              `Destroyed automatically when this PR is closed or merged.`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: parseInt(pr),
            });

            const existing = comments.find((c) =>
              c.user.type === 'Bot' && c.body.includes(marker)
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: parseInt(pr),
                body,
              });
            }

  # Deployed-artifact e2e against the just-deployed preview. Publishes the
  # Playwright HTML report to s3://<bucket>/<slug>/e2e-report/, browsable at
  # https://<slug>.e2e.wod.wiki; gated on the preview build fingerprint so
  # tests never race a stale CloudFront cache.
  e2e:
    name: Preview E2E
    needs: [slug, preview]
    if: github.event.action != 'closed'
    uses: ./.github/workflows/preview-e2e.yml
    secrets: inherit
    with:
      preview-url: https://${{ needs.slug.outputs.slug }}.preview.wod.wiki
      branch-slug: ${{ needs.slug.outputs.slug }}
      build-hash: ${{ needs.preview.outputs.bundle-hash }}

  e2e-storybook:
    name: Storybook E2E
    runs-on: ubuntu-22.04
    needs: [slug, storybook]
    if: github.event.action != 'closed' && needs.storybook.outputs.deploy-status == 'success'
    steps:
      - uses: actions/checkout@v7

      - name: Set up environment (Bun + chromium)
        uses: ./.github/actions/setup-env

      - name: Run Storybook smoke against deployed preview
        run: bun x playwright test --config playwright.storybook.config.ts
        env:
          CI: true
          STORYBOOK_URL: https://${{ needs.slug.outputs.slug }}.story.wod.wiki

      - name: Upload Playwright report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: storybook-playwright-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 14

  pr-summary:
    runs-on: ubuntu-22.04
    if: always() && github.event_name == 'pull_request' && github.event.action != 'closed'
    needs: [build-test-packages, verify, storybook]
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Post PR summary
        uses: actions/github-script@v9
        env:
          VERIFY_RESULT: ${{ needs.verify.result }}
          UNIT_STATUS: ${{ needs.verify.outputs.unit-status }}
          COVERAGE_STATUS: ${{ needs.verify.outputs.coverage-status }}
          BUILD_STATUS: ${{ needs.verify.outputs.build-status }}
          PKG_RESULT: ${{ needs.build-test-packages.result }}
          PKG_TEST: ${{ needs.build-test-packages.outputs.test-status }}
          STORYBOOK_TEST: ${{ needs.storybook.outputs.test-status }}
          STORYBOOK_BUILD: ${{ needs.storybook.outputs.build-status }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const statusIcon = (result) => {
              if (result === 'success') return '✅';
              if (result === 'skipped') return '⏭️';
              return '❌';
            };

            const statuses = {
              overall: process.env.VERIFY_RESULT,
              unit: process.env.UNIT_STATUS || 'skipped',
              coverage: process.env.COVERAGE_STATUS || 'skipped',
              build: process.env.BUILD_STATUS || 'skipped',
              packages: process.env.PKG_TEST || process.env.PKG_RESULT || 'skipped',
              storybookTest: process.env.STORYBOOK_TEST || 'skipped',
              storybookBuild: process.env.STORYBOOK_BUILD || 'skipped',
            };

            const headline = statuses.overall === 'success'
              ? '## ✅ PR verification passed'
              : '## ⚠️ PR verification needs attention';

            const marker = '<!-- wod-wiki-pr-verification -->';
            const body = `${marker}\n${headline}\n\n| Check | Status |\n| --- | --- |\n| Packages (lint/typecheck/test/build) | ${statusIcon(statuses.packages)} ${statuses.packages} |\n| Playground unit | ${statusIcon(statuses.unit)} ${statuses.unit} |\n| Playground coverage | ${statusIcon(statuses.coverage)} ${statuses.coverage} |\n| Playground build | ${statusIcon(statuses.build)} ${statuses.build} |\n| Storybook tests | ${statusIcon(statuses.storybookTest)} ${statuses.storybookTest} |\n| Storybook build | ${statusIcon(statuses.storybookBuild)} ${statuses.storybookBuild} |\n\n- Actions run: [View run](${runUrl})\n- Coverage artifact: [Artifacts](${runUrl}#artifacts)`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existing = comments.find((comment) =>
              comment.user.type === 'Bot' && comment.body.includes(marker)
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

  destroy:
    name: Destroy Preview
    runs-on: ubuntu-22.04
    if: github.event.action == 'closed'
    permissions:
      contents: read
      pull-requests: write
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_PREVIEW_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_PREVIEW_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: us-east-1
      S3_BUCKET: ${{ secrets.AWS_PREVIEW_S3_BUCKET }}
      CF_DISTRIBUTION_ID: ${{ secrets.AWS_PREVIEW_CF_DISTRIBUTION_ID }}
      PR_BRANCH: ${{ github.event.pull_request.head.ref }}
    steps:
      - name: Derive branch slug
        id: slug
        run: |
          SLUG=$(echo "$PR_BRANCH" | sed 's/[^a-z0-9]/-/g' | sed 's/--*/-/g' | sed 's/^-\+//;s/-\+$//' | tr '[:upper:]' '[:lower:]')
          echo "slug=$SLUG" >> "$GITHUB_OUTPUT"

      - name: Delete S3 prefix objects
        run: |
          set -euo pipefail
          PREFIX="${{ steps.slug.outputs.slug }}/"
          echo "Deleting s3://$S3_BUCKET/$PREFIX"
          aws s3 rm "s3://$S3_BUCKET/$PREFIX" --recursive 2>&1

      - name: Create CloudFront invalidation for deleted path (best-effort)
        continue-on-error: true
        run: |
          set -uo pipefail
          PREFIX="/${{ steps.slug.outputs.slug }}/*"
          if aws cloudfront create-invalidation \
               --distribution-id "$CF_DISTRIBUTION_ID" \
               --paths "$PREFIX"; then
            echo "CloudFront invalidation for cleanup submitted."
          else
            echo "::warning::CloudFront invalidation failed; S3 objects are deleted and the cache will self-expire within 5 minutes."
          fi

      - name: Post destroy comment
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const merged = context.payload.pull_request?.merged;
            const action = merged ? 'merged' : 'closed';
            const pr = context.payload.pull_request?.number;
            const marker = `<!-- wod-wiki-preview-${pr} -->`;
            const body = `${marker}\n` +
              `## 🗑️ Preview destroyed\n\n` +
              `PR #${pr} was **${action}** — preview resources have been removed.`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: parseInt(pr),
            });

            const existing = comments.find((c) =>
              c.user.type === 'Bot' && c.body.includes(marker)
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: parseInt(pr),
                body,
              });
            }
