name: CI – Pull Request

# Merge Request pipeline (docs/build-process.canvas):
#   Slug → [ Build Verify | Build Deploy Playground -> s3 | Build Deploy Storybook -> s3 ]
#        → E2E tests against deployed s3 branch ({slug}.preview.wod.wiki + {slug}.story.wod.wiki)
#        → Report (or Destroy Preview on close)

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, closed]
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  slug:
    name: Slug
    runs-on: ubuntu-22.04
    if: github.event.action != 'closed'
    outputs:
      slug: ${{ steps.slug.outputs.slug }}
      preview-version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Derive branch slug
        id: slug
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          SLUG=$(echo "$BRANCH" | sed 's/[^a-z0-9]/-/g' | sed 's/--*/-/g' | sed 's/^-\+//;s/-\+$//' | tr '[:upper:]' '[:lower:]')
          echo "slug=$SLUG" >> "$GITHUB_OUTPUT"

      - name: Compute preview version
        id: version
        run: |
          LATEST_TAG=$(git for-each-ref refs/tags \
            --sort=-v:refname \
            --format '%(refname:short)' \
            | grep -E '^v?[0-9]+\.[0-9]+(\.[0-9]+)?$' \
            | head -1)

          if [ -n "$LATEST_TAG" ]; then
            BASE="${LATEST_TAG#v}"
          else
            BASE=$(node -p "require('./package.json').version")
          fi

          MAJOR=$(echo "$BASE" | cut -d. -f1)
          MINOR=$(echo "$BASE" | cut -d. -f2)
          VERSION="${MAJOR}.${MINOR}.${{ github.run_number }}-pr.${{ github.event.pull_request.number || 'manual' }}"
          echo "Preview version: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  qodana:
    if: github.event.action != 'closed'
    permissions:
      contents: read
      pull-requests: write
      checks: write
    uses: ./.github/workflows/_code_quality.yml
    secrets: inherit

  build-verify:
    name: Build Verify
    if: github.event.action != 'closed'
    needs: [slug]
    uses: ./.github/workflows/_verify.yml
    secrets: inherit
    with:
      version: ${{ needs.slug.outputs.preview-version }}

  deploy-playground:
    name: Build Deploy Playground -> s3
    if: github.event.action != 'closed'
    needs: [slug]
    uses: ./.github/workflows/_deploy-playground.yml
    secrets: inherit
    with:
      slug: ${{ needs.slug.outputs.slug }}
      version: ${{ needs.slug.outputs.preview-version }}
      base-path: /${{ needs.slug.outputs.slug }}/dist/
      pr-number: ${{ github.event.pull_request.number && format('{0}', github.event.pull_request.number) || '' }}

  deploy-storybook:
    name: Build Deploy Storybook -> s3
    if: github.event.action != 'closed'
    needs: [slug]
    uses: ./.github/workflows/_storybook.yml
    secrets: inherit
    with:
      slug: ${{ needs.slug.outputs.slug }}
      version: ${{ needs.slug.outputs.preview-version }}

  e2e:
    name: E2E (S3 branch)
    if: github.event.action != 'closed'
    needs: [slug, deploy-playground, deploy-storybook]
    uses: ./.github/workflows/preview-e2e.yml
    secrets: inherit
    with:
      branch-slug: ${{ needs.slug.outputs.slug }}
      build-hash: ${{ needs.deploy-playground.outputs.bundle-hash }}

  report:
    name: Report
    runs-on: ubuntu-22.04
    if: always() && github.event_name == 'pull_request' && github.event.action != 'closed'
    needs: [slug, build-verify, deploy-playground, deploy-storybook, e2e]
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Post PR summary
        uses: actions/github-script@v9
        env:
          SLUG: ${{ needs.slug.outputs.slug }}
          VERIFY_RESULT: ${{ needs.build-verify.result }}
          PACKAGES_STATUS: ${{ needs.build-verify.outputs.packages-status }}
          PLAYGROUND_UNIT_STATUS: ${{ needs.build-verify.outputs.playground-status }}
          STORYBOOK_TEST_STATUS: ${{ needs.build-verify.outputs.storybook-status }}
          DEPLOY_PLAYGROUND_RESULT: ${{ needs.deploy-playground.result }}
          DEPLOY_STORYBOOK_RESULT: ${{ needs.deploy-storybook.result }}
          E2E_RESULT: ${{ needs.e2e.result }}
          PLAYGROUND_E2E_RESULT: ${{ needs.e2e.outputs.playground-outcome }}
          STORYBOOK_E2E_RESULT: ${{ needs.e2e.outputs.storybook-outcome }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const slug = process.env.SLUG;
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const e2eReportUrl = `https://${slug}.e2e.wod.wiki`;
            const statusIcon = (result) => {
              if (result === 'success') return '✅';
              if (result === 'skipped') return '⏭️';
              return '❌';
            };

            const overallOk = [
              process.env.VERIFY_RESULT,
              process.env.DEPLOY_PLAYGROUND_RESULT,
              process.env.DEPLOY_STORYBOOK_RESULT,
              process.env.E2E_RESULT,
            ].every((r) => r === 'success');

            const headline = overallOk
              ? '## ✅ PR verification passed'
              : '## ⚠️ PR verification needs attention';

            const rows = [
              ['Verify: Packages (lint/typecheck/test/build)', process.env.PACKAGES_STATUS || process.env.VERIFY_RESULT || 'skipped'],
              ['Verify: Playground (types/unit)', process.env.PLAYGROUND_UNIT_STATUS || process.env.VERIFY_RESULT || 'skipped'],
              ['Verify: Storybook (interaction tests)', process.env.STORYBOOK_TEST_STATUS || process.env.VERIFY_RESULT || 'skipped'],
              ['Deploy: Playground -> S3', process.env.DEPLOY_PLAYGROUND_RESULT || 'skipped'],
              ['Deploy: Storybook -> S3', process.env.DEPLOY_STORYBOOK_RESULT || 'skipped'],
              ['E2E: Playground ({slug}.preview.wod.wiki)', process.env.PLAYGROUND_E2E_RESULT || process.env.E2E_RESULT || 'skipped'],
              ['E2E: Storybook ({slug}.story.wod.wiki)', process.env.STORYBOOK_E2E_RESULT || process.env.E2E_RESULT || 'skipped'],
            ];

            const table = rows
              .map(([label, st]) => `| ${label.replace('{slug}', slug)} | ${statusIcon(st)} ${st} |`)
              .join('\n');

            const marker = '<!-- wod-wiki-pr-verification -->';
            const body = `${marker}\n${headline}\n\n| Check | Status |\n| --- | --- |\n${table}\n\n- E2E HTML report: [${e2eReportUrl}](${e2eReportUrl})\n- Actions run: [View run](${runUrl})`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existing = comments.find((comment) =>
              comment.user.type === 'Bot' && comment.body.includes(marker)
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

  destroy:
    name: Destroy Preview
    runs-on: ubuntu-22.04
    if: github.event.action == 'closed'
    permissions:
      contents: read
      pull-requests: write
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_PREVIEW_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_PREVIEW_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: us-east-1
      S3_BUCKET: ${{ secrets.AWS_PREVIEW_S3_BUCKET }}
      CF_DISTRIBUTION_ID: ${{ secrets.AWS_PREVIEW_CF_DISTRIBUTION_ID }}
      PR_BRANCH: ${{ github.event.pull_request.head.ref }}
    steps:
      - name: Derive branch slug
        id: slug
        run: |
          SLUG=$(echo "$PR_BRANCH" | sed 's/[^a-z0-9]/-/g' | sed 's/--*/-/g' | sed 's/^-\+//;s/-\+$//' | tr '[:upper:]' '[:lower:]')
          echo "slug=$SLUG" >> "$GITHUB_OUTPUT"

      - name: Delete S3 prefix objects
        run: |
          set -euo pipefail
          PREFIX="${{ steps.slug.outputs.slug }}/"
          echo "Deleting s3://$S3_BUCKET/$PREFIX"
          aws s3 rm "s3://$S3_BUCKET/$PREFIX" --recursive 2>&1

      - name: Create CloudFront invalidation for deleted path (best-effort)
        continue-on-error: true
        run: |
          set -uo pipefail
          PREFIX="/${{ steps.slug.outputs.slug }}/*"
          if aws cloudfront create-invalidation \
               --distribution-id "$CF_DISTRIBUTION_ID" \
               --paths "$PREFIX"; then
            echo "CloudFront invalidation for cleanup submitted."
          else
            echo "::warning::CloudFront invalidation failed; S3 objects are deleted and the cache will self-expire."
          fi

      - name: Post destroy comment
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const merged = context.payload.pull_request?.merged;
            const action = merged ? 'merged' : 'closed';
            const pr = context.payload.pull_request?.number;
            const marker = `<!-- wod-wiki-preview-${pr} -->`;
            const body = `${marker}\n` +
              `## 🗑️ Preview destroyed\n\n` +
              `PR #${pr} was **${action}** — preview resources have been removed.`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: parseInt(pr, 10),
            });

            const existing = comments.find((c) =>
              c.user.type === 'Bot' && c.body.includes(marker)
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: parseInt(pr, 10),
                body,
              });
            }
