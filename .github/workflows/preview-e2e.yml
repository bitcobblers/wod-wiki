name: Preview E2E

# Runs deployed-branch E2E tests against S3 + CloudFront (docs/build-process.canvas):
#   - Playground (4 parallel shards): https://{slug}.preview.wod.wiki
#   - Storybook smoke:                https://{slug}.story.wod.wiki
# Merges shard blob reports and publishes the HTML report to s3://<bucket>/<slug>/e2e-report/.

on:
  workflow_call:
    inputs:
      branch-slug:
        description: Branch slug ('main' or PR slug); determines {slug}.preview.wod.wiki, {slug}.story.wod.wiki, and s3://<bucket>/<slug>/e2e-report/
        required: false
        type: string
        default: main
      preview-url:
        description: Optional override for Playground URL (defaults to https://<branch-slug>.preview.wod.wiki)
        required: false
        type: string
        default: ''
      storybook-url:
        description: Optional override for Storybook URL (defaults to https://<branch-slug>.story.wod.wiki)
        required: false
        type: string
        default: ''
      build-hash:
        description: Hashed entry-bundle fingerprint (main-<hash>.js) of the playground build under test
        required: false
        type: string
        default: ''
    outputs:
      outcome:
        value: ${{ jobs.e2e-report.outputs.outcome }}
      playground-outcome:
        value: ${{ jobs.e2e-report.outputs.playground-outcome }}
      storybook-outcome:
        value: ${{ jobs.e2e-report.outputs.storybook-outcome }}
      webkit-outcome:
        value: ${{ jobs.e2e-report.outputs.webkit-outcome }}
      tests:
        value: ${{ jobs.e2e-report.outputs.tests }}
      passed:
        value: ${{ jobs.e2e-report.outputs.passed }}
      failures:
        value: ${{ jobs.e2e-report.outputs.failures }}
      flaky:
        value: ${{ jobs.e2e-report.outputs.flaky }}
      skipped:
        value: ${{ jobs.e2e-report.outputs.skipped }}
  workflow_dispatch:
    inputs:
      branch-slug:
        description: Branch slug ('main' or PR slug)
        required: false
        default: main
      preview-url:
        description: Optional override for Playground URL
        required: false
        default: ''
      storybook-url:
        description: Optional override for Storybook URL
        required: false
        default: ''
      build-hash:
        description: Optional build fingerprint (main-<hash>.js)
        required: false
        default: ''

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  playground-e2e:
    name: Playground E2E (${{ matrix.shard }}/4)
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      TARGET_URL: ${{ inputs.preview-url || format('https://{0}.preview.wod.wiki', inputs.branch-slug || 'main') }}
      BUILD_HASH: ${{ inputs.build-hash }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up environment (Bun + caches + chromium)
        uses: ./.github/actions/setup-env

      - name: Build workspace runtime packages
        run: bun run build:packages:runtime

      - name: Wait for current Playground build on S3/CloudFront
        run: |
          set -euo pipefail
          for i in $(seq 1 45); do
            html=$(curl -fsS "$TARGET_URL" 2>/dev/null || true)
            if [ -n "$html" ]; then
              if [ -z "$BUILD_HASH" ] || grep -q "main-$BUILD_HASH.js" <<<"$html"; then
                echo "Playground live: $TARGET_URL"
                exit 0
              fi
              echo "Playground reachable but stale (want main-$BUILD_HASH.js) ($i/45)"
            else
              echo "Waiting for $TARGET_URL ($i/45)"
            fi
            sleep 5
          done
          echo "::error::Playground at $TARGET_URL did not serve main-$BUILD_HASH.js"
          exit 1

      - name: Run Playground E2E shard ${{ matrix.shard }}/4
        run: bun x playwright test --config playwright.journal.config.ts --shard=${{ matrix.shard }}/4
        env:
          CI: true
          PLAYWRIGHT_BLOB_REPORT: '1'
          E2E_APP_URL: ${{ env.TARGET_URL }}

      - name: Run Playground smoke suite
        if: matrix.shard == 1
        run: bun run test:e2e:smoke
        env:
          CI: true
          E2E_APP_URL: ${{ env.TARGET_URL }}

      - name: Upload shard blob report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: blob-report-${{ matrix.shard }}
          path: blob-report/
          if-no-files-found: error
          retention-days: 1

      - name: Upload failure traces for shard ${{ matrix.shard }}
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: preview-e2e-failures-shard-${{ matrix.shard }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 14

  storybook-e2e:
    name: Storybook E2E
    runs-on: ubuntu-22.04
    env:
      STORYBOOK_TARGET_URL: ${{ inputs.storybook-url || format('https://{0}.story.wod.wiki', inputs.branch-slug || 'main') }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up environment (Bun + caches + chromium)
        uses: ./.github/actions/setup-env

      - name: Wait for Storybook preview to respond
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            if curl -fsS "$STORYBOOK_TARGET_URL" >/dev/null 2>&1; then
              echo "Storybook live: $STORYBOOK_TARGET_URL"
              exit 0
            fi
            echo "Waiting for $STORYBOOK_TARGET_URL ($i/30)"
            sleep 5
          done
          echo "::error::Storybook unreachable at $STORYBOOK_TARGET_URL"
          exit 1

      - name: Run Storybook smoke against deployed S3 branch
        run: bun x playwright test --config playwright.storybook.config.ts
        env:
          CI: true
          STORYBOOK_URL: ${{ env.STORYBOOK_TARGET_URL }}

      - name: Upload Storybook report on failure
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: storybook-playwright-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 14

  webkit-smoke:
    name: WebKit Smoke
    runs-on: ubuntu-22.04
    env:
      TARGET_URL: ${{ inputs.preview-url || format('https://{0}.preview.wod.wiki', inputs.branch-slug || 'main') }}
      BUILD_HASH: ${{ inputs.build-hash }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up environment (Bun + caches + webkit)
        uses: ./.github/actions/setup-env
        with:
          browsers: 'webkit'

      - name: Build workspace runtime packages
        run: bun run build:packages:runtime

      - name: Wait for current Playground build on S3/CloudFront
        run: |
          set -euo pipefail
          for i in $(seq 1 45); do
            html=$(curl -fsS "$TARGET_URL" 2>/dev/null || true)
            if [ -n "$html" ]; then
              if [ -z "$BUILD_HASH" ] || grep -q "main-$BUILD_HASH.js" <<<"$html"; then
                echo "Playground live: $TARGET_URL"
                exit 0
              fi
              echo "Playground reachable but stale (want main-$BUILD_HASH.js) ($i/45)"
            else
              echo "Waiting for $TARGET_URL ($i/45)"
            fi
            sleep 5
          done
          echo "::error::Playground at $TARGET_URL did not serve main-$BUILD_HASH.js"
          exit 1

      - name: Run WebKit cross-browser smoke against deployed S3 branch
        run: bun x playwright test --config playwright.webkit.config.ts
        env:
          CI: true
          E2E_APP_URL: ${{ env.TARGET_URL }}

      - name: Upload WebKit report on failure
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: webkit-playwright-report
          path: |
            playwright-report/webkit/
            test-results/
          if-no-files-found: ignore
          retention-days: 14

  e2e-report:
    name: Merge & publish E2E report
    runs-on: ubuntu-22.04
    needs: [playground-e2e, storybook-e2e, webkit-smoke]
    if: always()
    outputs:
      outcome: ${{ steps.gate.outputs.outcome }}
      playground-outcome: ${{ needs.playground-e2e.result }}
      storybook-outcome: ${{ needs.storybook-e2e.result }}
      webkit-outcome: ${{ needs.webkit-smoke.result }}
      tests: ${{ steps.preview_stats.outputs.tests }}
      passed: ${{ steps.preview_stats.outputs.passed }}
      failures: ${{ steps.preview_stats.outputs.failures }}
      flaky: ${{ steps.preview_stats.outputs.flaky }}
      skipped: ${{ steps.preview_stats.outputs.skipped }}
    env:
      DEPLOY_URL: ${{ inputs.preview-url || format('https://{0}.preview.wod.wiki', inputs.branch-slug || 'main') }}
      STORY_URL: ${{ inputs.storybook-url || format('https://{0}.story.wod.wiki', inputs.branch-slug || 'main') }}
      BRANCH_SLUG: ${{ inputs.branch-slug || 'main' }}
      BUILD_HASH: ${{ inputs.build-hash }}
      S3_BUCKET: ${{ secrets.AWS_PREVIEW_S3_BUCKET }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up environment (Bun + caches, no browsers)
        uses: ./.github/actions/setup-env
        with:
          browsers: ''

      - name: Download shard blob reports
        id: download_blobs
        uses: actions/download-artifact@v7
        continue-on-error: true
        with:
          pattern: blob-report-*
          path: all-blob-reports
          merge-multiple: true

      - name: Merge Playwright shard reports
        id: merge_reports
        if: steps.download_blobs.outcome == 'success'
        run: bun x playwright merge-reports --config playwright.merge.config.ts ./all-blob-reports

      - name: Post-process Playwright HTML report (specs & annotations)
        if: steps.merge_reports.outcome == 'success'
        run: bun run report:postprocess

      - name: Collect Playground E2E stats
        id: preview_stats
        if: always()
        run: |
          set -euo pipefail
          report="test-results/live-e2e-results.json"
          if [ ! -f "$report" ]; then
            echo "::error::merged e2e report $report is missing"
            for k in tests passed failures flaky skipped; do
              echo "$k=n/a" >> "$GITHUB_OUTPUT"
            done
            exit 1
          fi
          E2E_SUMMARY_MD=test-results/e2e-per-file-summary.md \
            bun scripts/e2e-report-summary.mjs "$report"
          mkdir -p playwright-report
          cat > playwright-report/e2e-run-metadata.json <<EOF
          {
            "commit": "$GITHUB_SHA",
            "buildHash": "$BUILD_HASH",
            "generatedAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "deployUrl": "$DEPLOY_URL",
            "storybookUrl": "$STORY_URL",
            "runUrl": "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          }
          EOF

      - name: Publish HTML report to S3 folder
        if: always() && env.BRANCH_SLUG != '' && env.S3_BUCKET != ''
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_PREVIEW_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_PREVIEW_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-1
        run: |
          set -euo pipefail
          PREFIX="${BRANCH_SLUG}/e2e-report/"
          if [ ! -f playwright-report/index.html ]; then
            echo "::error::no fresh playwright-report/index.html; refusing to overwrite s3://$S3_BUCKET/$PREFIX"
            exit 1
          fi
          echo "Publishing playwright-report/ to s3://$S3_BUCKET/$PREFIX"
          aws s3 sync playwright-report/ "s3://$S3_BUCKET/$PREFIX" \
            --delete \
            --cache-control "max-age=60, must-revalidate"

      - name: Upload Playwright HTML report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: preview-playwright-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 14

      - name: Write summary & enforce gate
        id: gate
        if: always()
        env:
          PLAYGROUND_RESULT: ${{ needs.playground-e2e.result }}
          STORYBOOK_RESULT: ${{ needs.storybook-e2e.result }}
          WEBKIT_RESULT: ${{ needs.webkit-smoke.result }}
          FAILURES: ${{ steps.preview_stats.outputs.failures }}
        run: |
          set -euo pipefail
          if [ "$PLAYGROUND_RESULT" = "success" ] && [ "$STORYBOOK_RESULT" = "success" ] && [ "$WEBKIT_RESULT" = "success" ] && [ "${FAILURES:-1}" = "0" ]; then
            outcome="success"
          else
            outcome="failure"
          fi
          echo "outcome=$outcome" >> "$GITHUB_OUTPUT"

          if [ "$BRANCH_SLUG" = "main" ]; then
            report_url="https://e2e.wod.wiki"
          else
            report_url="https://$BRANCH_SLUG.e2e.wod.wiki"
          fi

          cat <<EOF >> "$GITHUB_STEP_SUMMARY"
          ## Deployed S3 branch E2E summary

          - Playground URL: $DEPLOY_URL ($PLAYGROUND_RESULT)
          - Storybook URL: $STORY_URL ($STORYBOOK_RESULT)
          - WebKit smoke: $DEPLOY_URL ($WEBKIT_RESULT)
          - Overall outcome: $outcome
          - Commit: $GITHUB_SHA
          - Generated: $(date -u +%Y-%m-%dT%H:%M:%SZ)
          - Playground tests: ${{ steps.preview_stats.outputs.tests }} (pass ${{ steps.preview_stats.outputs.passed }}, fail ${{ steps.preview_stats.outputs.failures }}, flaky ${{ steps.preview_stats.outputs.flaky }}, skipped ${{ steps.preview_stats.outputs.skipped }})
          - HTML report: [$report_url]($report_url)
          EOF
          if [ -n "$BUILD_HASH" ]; then
            echo "- Deployed build: main-$BUILD_HASH.js" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f test-results/e2e-per-file-summary.md ]; then
            cat test-results/e2e-per-file-summary.md >> "$GITHUB_STEP_SUMMARY"
          fi

          if [ "$outcome" != "success" ]; then
            exit 1
          fi
