name: Verify

on:
  workflow_call:
    inputs:
      build-preview-artifact:
        description: Whether to run the deploy-shaped playground build gate and upload the dist artifact for the preview job (true on PRs; false on main — the site job builds for real)
        required: false
        type: boolean
        default: true
      preview-base-path:
        description: VITE_BASE_PATH for the deploy-shaped playground build gate (e.g. /<slug>/dist/ on PRs); empty = default '/'
        required: false
        type: string
        default: ''
      app-version:
        description: VITE_APP_VERSION stamped into the playground bundle (e.g. X.Y.Z-pr.N on PR previews); empty = package.json version
        required: false
        type: string
        default: ''
    outputs:
      unit-status:
        description: Unit test outcome
        value: ${{ jobs.verify.outputs.unit-status }}
      coverage-status:
        description: Coverage outcome
        value: ${{ jobs.verify.outputs.coverage-status }}
      build-status:
        description: Playground build outcome
        value: ${{ jobs.verify.outputs.build-status }}

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  verify:
    runs-on: ubuntu-22.04
    env:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    outputs:
      unit-status: ${{ steps.unit.outcome }}
      coverage-status: ${{ steps.coverage.outcome }}
      build-status: ${{ steps.build.outcome }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up environment (Bun + caches)
        uses: ./.github/actions/setup-env
        with:
          browsers: ''

      # Playground unit tests (isolated runner). Package tests run in the
      # parallel packages leg (_packages.yml); Storybook in its own leg.
      # e2e runs post-deploy against the published artifact (preview-e2e.yml).


      # Workspace packages must be built before bun-run app tests: the
      # playground resolves @bitcobblers/wod-wiki-* through their dist
      # exports maps (Vite aliases source only at bundle time).
      - name: Build packages
        run: bun run build:packages
      - name: Run validation script tests
        run: bun run test:validation-scripts
      # Baseline-aware tsc gate: fails only on NEW playground diagnostics
      # relative to scripts/baselines/playground-types.json (line moves and
      # resolved diagnostics never fail). Regenerate intentionally with
      # `bun scripts/check-playground-types.mjs --update-baseline`.
      - name: Check playground types
        run: bun run check:playground-types
      - name: Run unit tests
        id: unit
        run: bun run test:playground:unit

      - name: Run coverage
        id: coverage
        run: bun run --filter '@bitcobblers/wod-wiki-playground' test:coverage

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-report
          path: apps/playground/coverage/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload coverage to Codecov
        if: always() && env.CODECOV_TOKEN != '' && steps.coverage.outcome == 'success'
        uses: codecov/codecov-action@v7
        with:
          files: apps/playground/coverage/lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

      # Deploy-shaped build gate (PRs only — on main the site job builds for
      # real, so a second smoke build is pure duplication). The preview job
      # downloads this artifact instead of building again.
      - name: Build playground
        id: build
        if: inputs.build-preview-artifact
        run: bun run build:app
        env:
          VITE_BASE_PATH: ${{ inputs.preview-base-path }}
          VITE_APP_VERSION: ${{ inputs.app-version }}
          VITE_API_URL: ${{ vars.VITE_API_URL || 'https://wod.wiki/api' }}
          VITE_CAST_APP_ID: ${{ vars.VITE_CAST_APP_ID }}

      # The receiver ships from its dedicated pipeline — Chrome 92 target for
      # the Cast Android TV engine plus legacy CSS lowering. Never ship the
      # main playground bundle as the receiver; it crashes Cast Chromium with
      # SyntaxError before React mounts (spinner-forever incident 2026-10).
      # Writes into apps/playground/dist so it uploads with the same artifact.
      - name: Build receiver
        if: inputs.build-preview-artifact && steps.build.outcome == 'success'
        run: bun x vite build --config apps/playground/vite.receiver.config.ts --outDir dist

      # The Cast Android TV engine is Chromium 92 and silently drops CSS it
      # does not implement — a container-query unit once left the TV timer
      # with no sizes at all. Guard the built stylesheet's feature floor.
      - name: Check receiver CSS compatibility
        if: inputs.build-preview-artifact && steps.build.outcome == 'success'
        run: bun scripts/check-receiver-css-compat.cjs apps/playground/dist/assets/receiver-*.css

      # GA measurement ID substitution, restored from the pre-consolidation
      # _build-bun.yml step: the sources ship a G-PROD-ID placeholder
      # (app/lib/telemetry-gtag.ts bundled into assets/*.js, receiver-rpc.html)
      # and this rewrites the built dist. Empty vars.G_TAG → placeholder
      # ships untouched (dev/fork builds).
      - name: Inject GA tag
        if: inputs.build-preview-artifact && steps.build.outcome == 'success' && vars.G_TAG != ''
        run: |
          grep -rl 'G-PROD-ID' apps/playground/dist \
            | xargs -r sed -i 's/G-PROD-ID/${{ vars.G_TAG }}/g'

      - name: Upload playground dist
        if: inputs.build-preview-artifact && steps.build.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: playground-dist
          path: apps/playground/dist/
          retention-days: 1

      - name: Write verification summary
        if: always()
        run: |
          cat <<EOF >> "$GITHUB_STEP_SUMMARY"
          ## Verification summary

          | Check | Outcome |
          | --- | --- |
          | Unit tests | ${{ steps.unit.outcome }} |
          | Coverage | ${{ steps.coverage.outcome }} |
          | Playground build | ${{ steps.build.outcome }} |
          EOF
