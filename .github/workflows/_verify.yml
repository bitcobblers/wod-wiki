name: Build Verify

# Unified non-deploy verification leg (docs/build-process.canvas):
#   - packages:   lint, typecheck, skill sync check, vitest, tsup build, CLI web assets
#   - playground: validation script tests, baseline type gate, isolated unit suite
#   - storybook:  Playwright component / story interaction tests

on:
  workflow_call:
    inputs:
      version:
        description: Unified version string stamped into package manifests before building
        required: false
        type: string
        default: ''
      upload-packages-dist:
        description: Upload stamped packages-dist artifact for downstream npm publishing on main
        required: false
        type: boolean
        default: false
    outputs:
      packages-status:
        value: ${{ jobs.packages.outputs.status }}
      playground-status:
        value: ${{ jobs.playground.outputs.status }}
      storybook-status:
        value: ${{ jobs.storybook.outputs.status }}

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  packages:
    name: Verify packages
    runs-on: ubuntu-22.04
    outputs:
      status: ${{ steps.status.outputs.status }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up environment (Bun + caches, no browsers)
        uses: ./.github/actions/setup-env
        with:
          browsers: ''

      - name: Stamp version
        if: inputs.version != ''
        run: bun scripts/stamp-version.ts --version "${{ inputs.version }}"

      - name: Lint packages
        run: bun run lint:packages

      - name: Typecheck packages
        run: bun run typecheck:package

      - name: Check generated skill copies
        run: bun run check:skills

      - name: Unit tests (vitest workspace)
        run: bun run test:package

      - name: Build packages (tsup)
        run: bun run build:packages

      - name: Build CLI web assets
        run: bun run build:cli:assets && bun packages/tools/tests/cli-extension-check.ts

      - name: Upload packages-dist artifact
        if: inputs.upload-packages-dist
        uses: actions/upload-artifact@v7
        with:
          name: packages-dist
          path: |
            packages/*/dist/
            packages/*/package.json
          retention-days: 1

      - name: Record status
        id: status
        if: always()
        run: echo "status=${{ job.status }}" >> "$GITHUB_OUTPUT"

  playground:
    name: Verify playground
    runs-on: ubuntu-22.04
    outputs:
      status: ${{ steps.status.outputs.status }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up environment (Bun + caches, no browsers)
        uses: ./.github/actions/setup-env
        with:
          browsers: ''

      - name: Build packages
        run: bun run build:packages

      - name: Run validation script tests
        run: bun run test:validation-scripts

      - name: Check playground types
        run: bun run check:playground-types

      - name: Run playground unit tests
        run: bun run test:playground:unit

      - name: Record status
        id: status
        if: always()
        run: echo "status=${{ job.status }}" >> "$GITHUB_OUTPUT"

  storybook:
    name: Verify Storybook
    runs-on: ubuntu-22.04
    outputs:
      status: ${{ steps.test.outputs.status }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up environment (Bun + chromium)
        uses: ./.github/actions/setup-env

      - name: Build packages
        run: bun run build:packages

      # addon-vitest browser mode occasionally flakes on a cold Vite cache; one
      # bounded retry absorbs transient dynamic-import startup races.
      - name: Storybook interaction tests (attempt 1)
        id: test-attempt-1
        continue-on-error: true
        run: bun run --filter '@bitcobblers/wod-wiki-storybook' test

      - name: Storybook interaction tests (attempt 2)
        id: test-attempt-2
        if: steps.test-attempt-1.outcome == 'failure'
        run: bun run --filter '@bitcobblers/wod-wiki-storybook' test

      - name: Record status
        id: test
        if: always()
        run: |
          if [ "${{ steps.test-attempt-1.outcome }}" = "success" ] || [ "${{ steps.test-attempt-2.outcome }}" = "success" ]; then
            echo "status=success" >> "$GITHUB_OUTPUT"
          else
            echo "status=failure" >> "$GITHUB_OUTPUT"
            exit 1
          fi
