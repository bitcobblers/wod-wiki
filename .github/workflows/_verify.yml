name: Build Verify

# Unified non-deploy verification leg (docs/build-process.canvas):
#   - packages:   lint, typecheck, skill sync check, vitest, full package build,
#                 CLI web assets smoke check, and Storybook interaction tests
#                 (sharing the single package build in one VM to save CPU)
#   - playground: validation script tests, baseline type gate, isolated unit suite

on:
  workflow_call:
    inputs:
      version:
        description: Unified version string stamped into package manifests before building
        required: false
        type: string
        default: ''
      upload-packages-dist:
        description: Upload stamped packages-dist artifact for downstream npm publishing on main
        required: false
        type: boolean
        default: false
    outputs:
      packages-status:
        value: ${{ jobs.packages.outputs.packages-status }}
      playground-status:
        value: ${{ jobs.playground.outputs.status }}
      storybook-status:
        value: ${{ jobs.packages.outputs.storybook-status }}

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  packages:
    name: Verify packages & Storybook
    runs-on: ubuntu-22.04
    outputs:
      packages-status: ${{ steps.pkg-status.outputs.status }}
      storybook-status: ${{ steps.sb-status.outputs.status }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up environment (Bun + caches + chromium)
        uses: ./.github/actions/setup-env

      - name: Stamp version
        if: inputs.version != ''
        run: bun scripts/stamp-version.ts --version "${{ inputs.version }}"

      - name: Lint packages
        run: bun run lint:packages

      - name: Typecheck packages
        run: bun run typecheck:package

      - name: Check generated skill copies
        run: bun run check:skills

      - name: Unit tests (vitest workspace)
        run: bun run test:package

      - name: Build packages (ESM + CJS + DTS)
        run: bun run build:packages

      - name: Build CLI web assets & smoke check
        run: bun run build:cli:assets && bun packages/tools/tests/cli-extension-check.ts

      - name: Upload packages-dist artifact
        if: inputs.upload-packages-dist
        uses: actions/upload-artifact@v7
        with:
          name: packages-dist
          path: |
            packages/*/dist/
            packages/*/package.json
          include-hidden-files: true
          retention-days: 1

      - name: Record packages status
        id: pkg-status
        if: always()
        run: echo "status=${{ job.status }}" >> "$GITHUB_OUTPUT"

      # Reuses the already-built workspace packages in the same runner; one
      # bounded retry absorbs cold Vite dev-server dynamic-import races.
      - name: Storybook interaction tests (attempt 1)
        id: sb-attempt-1
        continue-on-error: true
        run: bun run --filter '@bitcobblers/wod-wiki-storybook' test

      - name: Storybook interaction tests (attempt 2)
        id: sb-attempt-2
        if: steps.sb-attempt-1.outcome == 'failure'
        run: bun run --filter '@bitcobblers/wod-wiki-storybook' test

      - name: Record Storybook status
        id: sb-status
        if: always()
        run: |
          if [ "${{ steps.sb-attempt-1.outcome }}" = "success" ] || [ "${{ steps.sb-attempt-2.outcome }}" = "success" ]; then
            echo "status=success" >> "$GITHUB_OUTPUT"
          else
            echo "status=failure" >> "$GITHUB_OUTPUT"
            exit 1
          fi

  playground:
    name: Verify playground
    runs-on: ubuntu-22.04
    outputs:
      status: ${{ steps.status.outputs.status }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up environment (Bun + caches, no browsers)
        uses: ./.github/actions/setup-env
        with:
          browsers: ''

      - name: Build packages (ESM + CJS + DTS for type gate)
        run: bun run build:packages

      - name: Run validation script tests
        run: bun run test:validation-scripts

      - name: Check E2E Markdown <-> Playwright spec parity
        run: bun scripts/check-e2e-specs.ts

      - name: Check documentation links
        run: bun run docs:check

      - name: Check playground types
        run: bun run check:playground-types

      - name: Run playground unit tests
        run: bun run test:playground:unit

      - name: Record status
        id: status
        if: always()
        run: echo "status=${{ job.status }}" >> "$GITHUB_OUTPUT"
