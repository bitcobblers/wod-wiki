name: Build & Deploy Storybook

# Builds static Storybook and deploys directly to s3://<bucket>/<slug>/storybook/
# ({slug}.story.wod.wiki) in one job. Storybook interaction tests live in _verify.yml.

on:
  workflow_call:
    inputs:
      slug:
        description: Branch slug (PR branch slug or 'main')
        required: true
        type: string
      version:
        description: Unified version string stamped before building
        required: false
        type: string
        default: ''
    outputs:
      deploy-status:
        value: ${{ jobs.deploy-storybook.outputs.deploy-status }}

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy-storybook:
    name: Build & deploy Storybook (${{ inputs.slug }})
    runs-on: ubuntu-22.04
    environment: preview
    outputs:
      deploy-status: ${{ steps.sync.outcome }}
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_PREVIEW_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_PREVIEW_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: us-east-1
      S3_BUCKET: ${{ secrets.AWS_PREVIEW_S3_BUCKET }}
      CF_DISTRIBUTION_ID: ${{ secrets.AWS_PREVIEW_CF_DISTRIBUTION_ID }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up environment (Bun + caches, no browsers)
        uses: ./.github/actions/setup-env
        with:
          browsers: ''

      - name: Stamp version
        if: inputs.version != ''
        run: bun scripts/stamp-version.ts --version "${{ inputs.version }}"

      - name: Build packages
        run: bun run build:packages

      - name: Build Storybook
        run: bun run --filter '@bitcobblers/wod-wiki-storybook' build

      - name: Sync Storybook to S3
        id: sync
        run: |
          set -euo pipefail
          PREFIX="${{ inputs.slug }}/storybook/"
          echo "Uploading to s3://$S3_BUCKET/$PREFIX"
          aws s3 sync ./apps/storybook/storybook-static/ "s3://$S3_BUCKET/$PREFIX" \
            --cache-control "public, max-age=31536000, immutable" \
            --exclude "*" --include "assets/*"
          aws s3 sync ./apps/storybook/storybook-static/ "s3://$S3_BUCKET/$PREFIX" \
            --delete \
            --cache-control "max-age=30, must-revalidate" \
            --exclude "*.map" \
            --exclude "assets" --exclude "assets/*"

      - name: Invalidate CloudFront (best-effort)
        continue-on-error: true
        run: |
          set -uo pipefail
          PREFIX="/${{ inputs.slug }}/storybook*"
          if aws cloudfront create-invalidation \
               --distribution-id "$CF_DISTRIBUTION_ID" \
               --paths "$PREFIX"; then
            echo "CloudFront invalidation submitted for $PREFIX"
          else
            echo "::warning::CloudFront invalidation failed; content refreshes within 30s via max-age."
          fi
