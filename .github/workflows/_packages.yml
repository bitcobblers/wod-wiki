name: Packages

# Reusable leg 2a of the unified parallel DAG: lint, typecheck, unit-test and
# build the @bitcobblers/wod-wiki-* workspaces under packages/.
#
# Consumed by:
#   - pull-request.yml (PR preview gate)
#   - main.yml         (production gate feeding release-npm)
#
# The optional packages-dist artifact is uploaded only when `upload-dist` is
# true (main), because publish downloads it instead of rebuilding.

on:
  workflow_call:
    inputs:
      version:
        description: Unified version string stamped into every package manifest
        required: false
        type: string
        default: ''
      upload-dist:
        description: Upload packages-dist artifact for downstream publishing
        required: false
        type: boolean
        default: false
    outputs:
      lint-status:
        value: ${{ jobs.build-test-packages.outputs.lint-status }}
      typecheck-status:
        value: ${{ jobs.build-test-packages.outputs.typecheck-status }}
      test-status:
        value: ${{ jobs.build-test-packages.outputs.test-status }}
      build-status:
        value: ${{ jobs.build-test-packages.outputs.build-status }}

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-test-packages:
    runs-on: ubuntu-22.04
    outputs:
      lint-status: ${{ steps.lint.outcome }}
      typecheck-status: ${{ steps.typecheck.outcome }}
      test-status: ${{ steps.test.outcome }}
      build-status: ${{ steps.build.outcome }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up environment (Bun + caches, no browsers)
        uses: ./.github/actions/setup-env
        with:
          browsers: ''

      - name: Stamp version
        if: inputs.version != ''
        run: bun scripts/stamp-version.ts --version "${{ inputs.version }}"

      - name: Lint packages
        id: lint
        run: bun run lint:packages

      - name: Typecheck packages
        id: typecheck
        run: bun run typecheck:package

      - name: Unit tests (vitest workspace)
        id: test
        run: bun run test:package

      - name: Build packages (tsup)
        id: build
        run: bun run build:packages

      # Stage playground app builds into packages/tools/dist/web so the
      # published tools package can serve `wod server`/`wod playground`
      # without a repo checkout.
      - name: Build CLI web assets
        id: assets
        run: bun run build:cli:assets && bun packages/tools/tests/cli-extension-check.ts

      - name: Upload packages-dist artifact
        if: inputs.upload-dist && steps.build.outcome == 'success' && steps.assets.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: packages-dist
          path: |
            packages/*/dist/
            packages/*/package.json
          retention-days: 1

      - name: Write summary
        if: always()
        run: |
          cat <<EOF >> "$GITHUB_STEP_SUMMARY"
          ## Packages leg

          | Check | Outcome |
          | --- | --- |
          | Lint | ${{ steps.lint.outcome }} |
          | Typecheck | ${{ steps.typecheck.outcome }} |
          | Unit tests | ${{ steps.test.outcome }} |
          | Build | ${{ steps.build.outcome }} |
          | CLI web assets | ${{ steps.assets.outcome }} |
          EOF
