name: Build & Deploy Ontology Explorer

# Builds the self-contained Ontology Explorer + dataset and deploys to
# s3://<bucket>/<slug>/ontology/ ({slug}.preview.wod.wiki/ontology/ or
# S3 prefix /{slug}/ontology/). Non-blocking (continue-on-error: true).

on:
  workflow_call:
    inputs:
      slug:
        description: Branch slug (PR branch slug or 'main')
        required: true
        type: string
    outputs:
      deploy-status:
        value: ${{ jobs.deploy-ontology.outputs.deploy-status }}

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy-ontology:
    name: Build & deploy Ontology (${{ inputs.slug }})
    runs-on: ubuntu-22.04
    environment: preview
    continue-on-error: true
    outputs:
      deploy-status: ${{ steps.sync.outcome }}
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_PREVIEW_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_PREVIEW_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: us-east-1
      S3_BUCKET: ${{ secrets.AWS_PREVIEW_S3_BUCKET }}
      CF_DISTRIBUTION_ID: ${{ secrets.AWS_PREVIEW_CF_DISTRIBUTION_ID }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up environment (Bun + caches, no browsers)
        uses: ./.github/actions/setup-env
        with:
          browsers: ''

      - name: Build Ontology Explorer & dataset
        run: |
          bun run ontology:build -- --offline
          bun run ontology:codegen
          bun run ontology:query -- --chains
          bun run ontology:viewer

      - name: Stage ontology site
        run: |
          set -euo pipefail
          rm -rf /tmp/ontology-site
          mkdir -p /tmp/ontology-site
          cp ontology/generated/explorer.html /tmp/ontology-site/index.html
          cp ontology/generated/explorer.html /tmp/ontology-site/explorer.html
          cp ontology/generated/chains.md /tmp/ontology-site/chains.md
          cp ontology/generated/unified-dataset.trig /tmp/ontology-site/unified-dataset.trig

      - name: Sync Ontology Explorer to S3
        id: sync
        run: |
          set -euo pipefail
          PREFIX="${{ inputs.slug }}/ontology/"
          echo "Uploading to s3://$S3_BUCKET/$PREFIX"
          aws s3 sync /tmp/ontology-site/ "s3://$S3_BUCKET/$PREFIX" \
            --delete \
            --cache-control "max-age=30, must-revalidate"

      - name: Invalidate CloudFront (best-effort)
        continue-on-error: true
        run: |
          set -uo pipefail
          PREFIX="/${{ inputs.slug }}/ontology*"
          if aws cloudfront create-invalidation \
               --distribution-id "$CF_DISTRIBUTION_ID" \
               --paths "$PREFIX"; then
            echo "CloudFront invalidation submitted for $PREFIX"
          else
            echo "::warning::CloudFront invalidation failed; content refreshes within 30s via max-age."
          fi
