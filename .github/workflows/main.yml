name: Release – Main

# Merge To Main pipeline (docs/build-process.canvas):
#   Slug (main + version) → [ Build Verify | Build Deploy Playground -> s3 | Build Deploy Storybook -> s3 ]
#                         → E2E tests against deployed s3 branch (main.preview.wod.wiki + main.story.wod.wiki)
#                         → Publish (npm @bitcobblers/* + GitHub Pages wod.wiki)
#                         → Create Release

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  slug:
    name: Slug
    runs-on: ubuntu-22.04
    outputs:
      slug: ${{ steps.slug.outputs.slug }}
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set main branch slug
        id: slug
        run: echo "slug=main" >> "$GITHUB_OUTPUT"

      - name: Compute next version (conventional commits)
        id: version
        run: |
          LATEST_TAG=$(git for-each-ref refs/tags \
            --sort=-v:refname \
            --format '%(refname:short)' \
            | grep -E '^v?[0-9]+\.[0-9]+(\.[0-9]+)?$' \
            | head -1)

          if [ -n "$LATEST_TAG" ]; then
            BASE="${LATEST_TAG#v}"
            COMMITS=$(git log "${LATEST_TAG}..HEAD" --format="%s%n%b")
          else
            BASE=$(node -p "require('./package.json').version")
            COMMITS=$(git log --format="%s%n%b")
          fi

          MAJOR=$(echo "$BASE" | cut -d. -f1)
          MINOR=$(echo "$BASE" | cut -d. -f2)

          BUMP="patch"
          if echo "$COMMITS" | grep -qE "^(breaking[:(]|BREAKING CHANGE:)" || \
             echo "$COMMITS" | grep -qiE "^[a-z]+(\([^)]*\))?!:"; then
            BUMP="major"
          elif echo "$COMMITS" | grep -qiE "^(feature[:(]|feat[:(])"; then
            BUMP="minor"
          fi

          if [ "$BUMP" = "major" ]; then
            MAJOR=$((MAJOR + 1)); MINOR=0
          elif [ "$BUMP" = "minor" ]; then
            MINOR=$((MINOR + 1))
          fi

          VERSION="${MAJOR}.${MINOR}.${{ github.run_number }}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

  qodana:
    permissions:
      contents: read
      pull-requests: write
      checks: write
    uses: ./.github/workflows/_code_quality.yml
    secrets: inherit

  build-verify:
    name: Build Verify
    needs: [slug]
    uses: ./.github/workflows/_verify.yml
    secrets: inherit
    with:
      version: ${{ needs.slug.outputs.version }}
      upload-packages-dist: true

  deploy-playground:
    name: Build Deploy Playground -> s3
    needs: [slug]
    uses: ./.github/workflows/_deploy-playground.yml
    secrets: inherit
    with:
      slug: ${{ needs.slug.outputs.slug }}
      version: ${{ needs.slug.outputs.version }}
      upload-dist: true

  deploy-storybook:
    name: Build Deploy Storybook -> s3
    needs: [slug]
    uses: ./.github/workflows/_storybook.yml
    secrets: inherit
    with:
      slug: ${{ needs.slug.outputs.slug }}
      version: ${{ needs.slug.outputs.version }}

  e2e:
    name: E2E (S3 branch)
    needs: [slug, deploy-playground, deploy-storybook]
    uses: ./.github/workflows/preview-e2e.yml
    secrets: inherit
    with:
      branch-slug: ${{ needs.slug.outputs.slug }}
      build-hash: ${{ needs.deploy-playground.outputs.bundle-hash }}

  publish:
    name: Publish
    needs: [slug, build-verify, deploy-playground, e2e]
    uses: ./.github/workflows/_publish.yml
    secrets: inherit

  create-release:
    name: Create Release
    runs-on: ubuntu-22.04
    needs: [slug, publish]
    permissions:
      contents: write
    steps:
      - name: Create or update GitHub release and tag
        uses: actions/github-script@v9
        with:
          script: |
            const tag = '${{ needs.slug.outputs.tag }}';
            const sha = context.sha;
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            try {
              const ref = await github.rest.git.getRef({ owner, repo, ref: `tags/${tag}` });
              if (ref.data.object.sha !== sha) {
                core.setFailed(`Tag ${tag} already exists at ${ref.data.object.sha}; refusing to move it.`);
                return;
              }
            } catch (error) {
              if (error.status !== 404) throw error;
              await github.rest.git.createRef({ owner, repo, ref: `refs/tags/${tag}`, sha });
            }

            try {
              const existing = await github.rest.repos.getReleaseByTag({ owner, repo, tag });
              await github.rest.repos.updateRelease({
                owner, repo, release_id: existing.data.id, target_commitish: sha,
                name: tag, draft: false, prerelease: false,
              });
            } catch (error) {
              if (error.status !== 404) throw error;
              await github.rest.repos.createRelease({
                owner, repo, tag_name: tag, target_commitish: sha, name: tag,
                generate_release_notes: true, draft: false, prerelease: false,
              });
            }

      - name: Write release summary
        run: |
          cat <<EOF >> "$GITHUB_STEP_SUMMARY"
          ## Main release pipeline

          - Version: ${{ needs.slug.outputs.version }} (${{ needs.slug.outputs.tag }})
          - Pages URL: ${{ needs.publish.outputs.page-url }}
          - S3 staging verified: https://main.preview.wod.wiki & https://main.story.wod.wiki
          - E2E report: https://e2e.wod.wiki
          EOF
