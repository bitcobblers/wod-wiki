name: Build & Stage – Main

# Merge To Main pipeline (step 1 of 2):
#   Slug (main + version) → [ Build Verify | Build Deploy Playground -> s3 | Build Deploy Storybook -> s3 ]
#
# E2E testing against S3 staging (main.preview.wod.wiki + main.story.wod.wiki)
# is executed externally. Once E2E passes, tagging the commit `prod` triggers
# deploy-prod.yml (step 2) to publish the staged artifacts to wod.wiki and npm.

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  notify-ha-start:
    name: Notify Home Assistant (build started)
    runs-on: ubuntu-22.04
    if: always()
    steps:
      - name: Connect to Tailscale
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}
      - name: Publish ci/running QA event
        env:
          TAILNET_MQTT_PASSWORD: ${{ secrets.TAILNET_MQTT_PASSWORD }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq >/dev/null 2>&1 || true
          sudo apt-get install -y -qq mosquitto-clients >/dev/null 2>&1 || true
          export SHORT=${GITHUB_SHA:0:7} STATUS=running
          PAYLOAD=$(node -e 'console.log(JSON.stringify({kind:"ci",status:process.env.STATUS,title:`main.yml build #${process.env.GITHUB_RUN_ID} started @ ${process.env.SHORT}`,sha:process.env.GITHUB_SHA,run_id:process.env.GITHUB_RUN_ID,url:`https://github.com/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`,source:"github-actions",ts:new Date().toISOString()}))')
          timeout 20 mosquitto_pub -h mqtt.forest-adhara.ts.net -u qa -P "${TAILNET_MQTT_PASSWORD}" -t qa/wod-wiki/events -m "$PAYLOAD" || echo "::warning::HA event emit failed (non-fatal)"

  slug:
    name: Slug
    runs-on: ubuntu-22.04
    outputs:
      slug: ${{ steps.slug.outputs.slug }}
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set main branch slug
        id: slug
        run: echo "slug=main" >> "$GITHUB_OUTPUT"

      - name: Compute next version (conventional commits)
        id: version
        run: |
          LATEST_TAG=$(git for-each-ref refs/tags \
            --sort=-v:refname \
            --format '%(refname:short)' \
            | grep -E '^v?[0-9]+\.[0-9]+(\.[0-9]+)?$' \
            | head -1)

          if [ -n "$LATEST_TAG" ]; then
            BASE="${LATEST_TAG#v}"
            COMMITS=$(git log "${LATEST_TAG}..HEAD" --format="%s%n%b")
          else
            BASE=$(node -p "require('./package.json').version")
            COMMITS=$(git log --format="%s%n%b")
          fi

          MAJOR=$(echo "$BASE" | cut -d. -f1)
          MINOR=$(echo "$BASE" | cut -d. -f2)

          BUMP="patch"
          if echo "$COMMITS" | grep -qE "^(breaking[:(]|BREAKING CHANGE:)" || \
             echo "$COMMITS" | grep -qiE "^[a-z]+(\([^)]*\))?!:"; then
            BUMP="major"
          elif echo "$COMMITS" | grep -qiE "^(feature[:(]|feat[:(])"; then
            BUMP="minor"
          fi

          if [ "$BUMP" = "major" ]; then
            MAJOR=$((MAJOR + 1)); MINOR=0
          elif [ "$BUMP" = "minor" ]; then
            MINOR=$((MINOR + 1))
          fi

          VERSION="${MAJOR}.${MINOR}.${{ github.run_number }}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

  qodana:
    permissions:
      contents: read
      pull-requests: write
      checks: write
    uses: ./.github/workflows/_code_quality.yml
    secrets: inherit

  build-verify:
    name: Build Verify
    needs: [slug]
    uses: ./.github/workflows/_verify.yml
    secrets: inherit
    with:
      version: ${{ needs.slug.outputs.version }}
      upload-packages-dist: true

  deploy-playground:
    name: Build Deploy Playground -> s3
    needs: [slug]
    uses: ./.github/workflows/_deploy-playground.yml
    secrets: inherit
    with:
      slug: ${{ needs.slug.outputs.slug }}
      version: ${{ needs.slug.outputs.version }}
      upload-dist: true

  deploy-storybook:
    name: Build Deploy Storybook -> s3
    needs: [slug]
    uses: ./.github/workflows/_storybook.yml
    secrets: inherit
    with:
      slug: ${{ needs.slug.outputs.slug }}
      version: ${{ needs.slug.outputs.version }}

  deploy-ontology:
    name: Build Deploy Ontology -> s3
    needs: [slug]
    uses: ./.github/workflows/_ontology.yml
    secrets: inherit
    with:
      slug: ${{ needs.slug.outputs.slug }}

  push-build-diff:
    name: Push Build Summary -> Tailscale S3
    if: always()
    needs: [slug, build-verify, deploy-playground, deploy-storybook, deploy-ontology]
    uses: ./.github/workflows/_push-build-diff.yml
    secrets: inherit
    with:
      version: ${{ needs.slug.outputs.version }}
      tag: ${{ needs.slug.outputs.tag }}
      slug: ${{ needs.slug.outputs.slug || 'main' }}
      bundle-hash: ${{ needs.deploy-playground.outputs.bundle-hash }}
      slug-result: ${{ needs.slug.result }}
      build-verify-result: ${{ needs.build-verify.result }}
      packages-status: ${{ needs.build-verify.outputs.packages-status }}
      playground-status: ${{ needs.build-verify.outputs.playground-status }}
      storybook-status: ${{ needs.build-verify.outputs.storybook-status }}
      deploy-playground-result: ${{ needs.deploy-playground.result }}
      deploy-storybook-result: ${{ needs.deploy-storybook.result }}
      deploy-ontology-result: ${{ needs.deploy-ontology.result }}

  summary:
    name: Staging Summary
    if: always()
    runs-on: ubuntu-22.04
    needs: [slug, build-verify, deploy-playground, deploy-storybook, deploy-ontology, push-build-diff]
    steps:
      - name: Write staging summary
        run: |
          cat <<EOF >> "$GITHUB_STEP_SUMMARY"
          ## Main staging build (${{ needs.push-build-diff.outputs.overall-status || 'unknown' }})

          - Version: \`${{ needs.slug.outputs.version }}\` (\`${{ needs.slug.outputs.tag }}\`)
          - Commit: \`${{ github.sha }}\`
          - Playground S3 staging: https://main.preview.wod.wiki
          - Storybook S3 staging: https://main.story.wod.wiki
          - Bundle hash: \`${{ needs.deploy-playground.outputs.bundle-hash }}\`
          - Build summary (Markdown): \`${{ needs.push-build-diff.outputs.summary-path }}\`
          - Build summary (JSON): \`${{ needs.push-build-diff.outputs.summary-json-path }}\`
          - Artifacts uploaded: \`packages-dist\`, \`playground-dist\`

          ### Job Results
          - \`slug\`: \`${{ needs.slug.result }}\`
          - \`build-verify\`: \`${{ needs.build-verify.result }}\` (packages=\`${{ needs.build-verify.outputs.packages-status }}\`, playground=\`${{ needs.build-verify.outputs.playground-status }}\`, storybook=\`${{ needs.build-verify.outputs.storybook-status }}\`)
          - \`deploy-playground\`: \`${{ needs.deploy-playground.result }}\`
          - \`deploy-storybook\`: \`${{ needs.deploy-storybook.result }}\`
          - \`deploy-ontology\`: \`${{ needs.deploy-ontology.result }}\`

          > External E2E testing can now run against the S3 staging URLs.
          > Tag this commit \`prod\` when E2E passes to trigger \`deploy-prod.yml\` (GitHub Pages + npm + release).
          EOF
