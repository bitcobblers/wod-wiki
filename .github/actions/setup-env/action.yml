name: setup-env
description: >-
  Shared environment seam for all wod-wiki CI jobs: Bun + dependency cache +
  optional Playwright browser cache. One interface for "a ready runner" —
  cache keys and install flags live here, not in 12 copy-pasted job setups.
inputs:
  browsers:
    description: "Playwright browser set to install: 'chromium', 'all' (chromium+firefox+webkit), or '' for none"
    required: false
    default: 'chromium'
  bun-version:
    description: Bun version
    required: false
    default: '1.4.x'

runs:
  using: composite
  steps:
    - name: Set up Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: ${{ inputs.bun-version }}

    # Restore Bun's global install cache; `bun install` on a hit is seconds,
    # not minutes. Keyed on the lockfile; fall back to any prior cache.
    - name: Restore Bun install cache
      uses: actions/cache@v6
      with:
        path: ~/.bun/install/cache
        key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
        restore-keys: ${{ runner.os }}-bun-

    - name: Install dependencies
      run: bun install --frozen-lockfile
      shell: bash

    - name: Restore Playwright browser cache
      if: inputs.browsers != ''
      id: pw-cache
      uses: actions/cache@v6
      with:
        path: ~/.cache/ms-playwright
        key: ${{ runner.os }}-playwright-${{ inputs.browsers }}-${{ hashFiles('bun.lock') }}
        restore-keys: ${{ runner.os }}-playwright-${{ inputs.browsers }}-

    # Full install (binaries + apt deps) when the browser cache missed.
    # GitHub ubuntu-22.04 runners include all Chromium runtime shared libs
    # pre-installed (libgbm1, libnss3, libasound2, xvfb, etc.); install-deps
    # for chromium-only only fetches optional CJK/xfonts packages and fails the
    # entire job when azure.archive.ubuntu.com has transient DNS/mirror outages.
    - name: Install Playwright browsers (full, on cache miss)
      if: inputs.browsers != '' && steps.pw-cache.outputs.cache-hit != 'true'
      run: |
        if [ "${{ inputs.browsers }}" = "all" ]; then
          bun x playwright install --with-deps chromium firefox webkit
        elif [ "${{ inputs.browsers }}" = "chromium" ]; then
          bun x playwright install chromium
          shopt -s nullglob
          bins=(
            ~/.cache/ms-playwright/chromium*/chrome-linux*/chrome
            ~/.cache/ms-playwright/chromium_headless_shell*/chrome-headless-shell-linux*/chrome-headless-shell
            ~/.cache/ms-playwright/chromium_headless_shell*/chrome-linux*/headless_shell
          )
          shopt -u nullglob
          missing_libs=0
          for bin in "${bins[@]}"; do
            if ldd "$bin" 2>/dev/null | grep -q 'not found'; then
              missing_libs=1
              break
            fi
          done
          if [ "${#bins[@]}" -eq 0 ] || [ "$missing_libs" -ne 0 ]; then
            bun x playwright install-deps chromium || echo "::warning::Optional Chromium apt font packages skipped due to apt mirror error"
          fi
        else
          bun x playwright install --with-deps ${{ inputs.browsers }}
        fi
      shell: bash

    # Binaries are cached, but their apt system libraries are NOT — always
    # install deps when non-chromium browsers (webkit/firefox) are requested.
    # WebKit's WPE MiniBrowser needs libwoff2dec & co., which are absent from
    # the stock runner image; skip this and webkit fails to launch with "error
    # while loading shared libraries". For chromium-only, all required shared
    # libraries are pre-installed on ubuntu-22.04, so optional font apt failures
    # should warn rather than abort the job.
    - name: Install Playwright system deps + verify browsers (on cache hit)
      if: inputs.browsers != '' && steps.pw-cache.outputs.cache-hit == 'true'
      run: |
        if [ "${{ inputs.browsers }}" = "all" ]; then
          bun x playwright install-deps chromium firefox webkit
          bun x playwright install chromium firefox webkit
        elif [ "${{ inputs.browsers }}" = "chromium" ]; then
          bun x playwright install chromium
          shopt -s nullglob
          bins=(
            ~/.cache/ms-playwright/chromium*/chrome-linux*/chrome
            ~/.cache/ms-playwright/chromium_headless_shell*/chrome-headless-shell-linux*/chrome-headless-shell
            ~/.cache/ms-playwright/chromium_headless_shell*/chrome-linux*/headless_shell
          )
          shopt -u nullglob
          missing_libs=0
          for bin in "${bins[@]}"; do
            if ldd "$bin" 2>/dev/null | grep -q 'not found'; then
              missing_libs=1
              break
            fi
          done
          if [ "${#bins[@]}" -eq 0 ] || [ "$missing_libs" -ne 0 ]; then
            bun x playwright install-deps chromium || echo "::warning::Optional Chromium apt font packages skipped due to apt mirror error"
          fi
        else
          bun x playwright install-deps ${{ inputs.browsers }}
          bun x playwright install ${{ inputs.browsers }}
        fi
      shell: bash
