  <script id="whiteboard-data" type="application/json">{"title":"PR #1103 Review: Language Alignment (Notebook, Feed, Note, Page)","subtitle":"Architectural evaluation, spec compliance audit, missed items, and post-cutover code simplification catalog for feat/language-alignment-integrated vs main","components":[{"type":"hero","id":"executive-verdict","eyebrow":"Pull Request #1103 · Isolated Worktree Audit","title":"Strong architectural unification across 12 tickets, with one user-facing WQL guide bug and ~300 lines of post-cutover dead weight ready to trim","body":"PR #1103 executes a repo-wide domain cutover across packages/core, packages/wql, packages/storage, packages/engine, packages/tools, packages/ui, and apps/playground. It collapses four competing container terms (notebook, collection, catalog, dated feed) into Notebook, re-anchors Feed as the configured publishing source, makes Page a true many-to-many placement layer, and unifies L1/L2/L3 navigation with WQL list surfaces. The core architecture, storage invariants, and read-side migrations are solid. Before or immediately after merge, fix the stale source:feeds examples in the WQL guide (which fail the parser) and trim the orphaned functions, duplicate fields, and transitional adapters left behind."},{"type":"metrics","id":"pr-scale-metrics","title":"Diff scale and audit counts","body":"Measured against origin/main (f09e107e6) in /home/serge/Projects/wod-wiki__worktrees/pr-1103-review (ebb6321d2).","items":[{"value":"476","label":"Files touched","detail":"+14,256 / -12,098 lines across 12 tickets"},{"value":"38 / 38","label":"Deleted / renamed files","detail":"38 legacy modules deleted, 38 renamed to feed/notebook"},{"value":"6","label":"Canonical concepts","detail":"Notebook, Feed, Note, Page, Journal, Tag"},{"value":"1","label":"Pre-merge doc blocker","detail":"wql.md & CONTEXT.md teach retired source:feeds"},{"value":"6","label":"Zero-caller dead items","detail":"5 exported functions + 2 orphaned layout files"},{"value":"~300 LOC","label":"Trim opportunity","detail":"Dead exports, dual fields, and duplicate registry tables"}]},{"type":"section","id":"what-was-done-well","title":"1. What was done well and architectural improvements","body":"This PR does not stop at string renames. It replaces scattered per-surface heuristics with single-owner resolvers and shared tables across storage, WQL, and the UI.","components":[{"type":"cards","id":"architectural-wins","title":"Nine structural improvements delivered by PR #1103","columns":2,"items":[{"badge":"Single Resolver","title":"One container decision shared by JS and SQL","body":"packages/wql/src/QueryService.ts:149-291 defines notebookOfItem, notebookOriginOfItem, and SOURCE_ID_SHAPES. packages/storage/src/sql/domain.ts:683-695 generates sourceKindSql from the same sourceShape accessor, so the SQL projection and JS residual filter cannot drift."},{"badge":"Ownership Rule","title":"Editability follows notebook ownership, not per-note stamps","body":"packages/core/src/types/notebook.ts:32-46 (isNoteEditable) and QueryService.ts:213-220 (notebookOriginOfItem) derive editability from the notebook. Cloning a feed note into a user notebook makes it editable by location while preserving its seed/feed provenance."},{"badge":"N:M Placements","title":"Pages are genuine many-to-many placements with atomic moves","body":"packages/core/src/models/PagePlacement.ts:54-89 defines canonical position-first ordering. StorageService.ts:403-484 implements addNoteToPage (append position, no detach), removeNoteFromPage, and transactional moveNoteBetweenPages, verified by fault-injection rollback tests."},{"badge":"Definitions as Notes","title":"Efforts and equipment import as notes + registry projections in one tx","body":"packages/tools/src/cli/persist.ts and packages/engine/src/seed/runtime.ts write the definition Note and its typed IEffort/IEquipment projection atomically. WQL :effort queries filter via the registry and resolve to owning definition notes via ownerNoteId."},{"badge":"WQL Planes","title":"First-class :notebook, :page, :tag, and :equipment planes","body":"packages/wql/src/vocabulary.ts:111,188 and QueryService.ts:2495-2690 add the four planes, add the contributes: filter on :tag{}, push typed-tag predicates down to SQL on the note plane, and delete the unimplemented has: and retired catalog: keys."},{"badge":"Nav Ladder","title":"Sidebar L1 zones derive directly from canonical list routes","body":"apps/playground/app/nav/appNavTree.ts:118-148 derives L1 id and label from the route path (/notebooks -> Notebooks). Journal and Playgrounds fold into NotebookZonePanel.tsx while keeping route-keyed query settings and L3 document outlines."},{"badge":"Library Lists","title":"Every library list route is a WQL stream surface","body":"apps/playground/app/views/stream/streamProfile.ts:109-281 binds every list route (/notebooks, /notes, /feeds, /pages, /efforts, /equipment, /tags, /journal, /sessions, /playgrounds) to QueriableStreamView. /tags replaces its bespoke chip list with :tag{} rows linking to /t/:type/:tag."},{"badge":"Read-Side Migration","title":"Idempotent storage, checkpoint, and settings migrations","body":"packages/wql/src/notebookVocabulary.ts:18-102 rewrites legacy collection.*/feed.* chunk IDs, sourcePaths, and sourceIds in one boot transaction (runtime.ts:517-549). viewSettingsStorage.ts and routeWqlConfig.ts migrate saved settings across two-hop route renames while isolating new /feeds settings."},{"badge":"Boot Hydration Fix","title":"Effort stream re-queries when the effort registry hydrates","body":"apps/playground/src/services/effortRegistry.ts:18-24 and QueriableStreamView.tsx subscribe the effort plane to registry hydration notifications, eliminating the race where :effort ran once against an empty registry during cold boot."}]},{"type":"table","id":"concept-alignment-matrix","title":"Before vs. after concept alignment across the four surfaces","body":"Every domain concept now has one noun, one direct route prefix, one plural list route, and a WQL head.","columns":["Concept","Before (Fragmented)","After (Canonical)","Direct Route","List Route","WQL Surface"],"rows":[["Container","notebook, collection, catalog, feed (dated)","Notebook","/notebook/{slug}","/notebooks",":notebook{} / notebook:{slug}"],["Configured Source","seed, seed source, library, sourceEntryId","Feed","/feed/{slug}","/feeds",":notebook{source:notebooks}"],["Authored Entry","note, entry, session, post, item, template","Note","/note/{uuid}","/notes",":note{}"],["Note Placement","page (mixed container/junction), /p/*","Page (N:M placement)","/page/{slug}","/pages",":page{} / page:{slug}"],["Calendar Slice","journal date (/journal/:date)","Day / Journal","/day/{date}","/journal",":note{notebook:journal} by {date} last 4w"],["Typed Bundle","tag (hand-rolled /tags page, no direct route)","Tag + Contributions","/t/{type}/{tag}","/tags",":tag{} / contributes:..."],["Definitions","separate registries + /e/:slug","Definition Notes + Projections","/effort/{slug}, /equipment/{slug}","/efforts, /equipment",":effort{}, :equipment{}"],["Dashboard","dashboard note + /d/:slug","Dashboard Note","/dashboard/{slug}","/dashboards",":dashboard{}"]]}]},{"type":"section","id":"missed-items-and-divergences","title":"2. What was missed: bugs, stale docs, and spec divergences","body":"Comparing the implementation against docs/language-alignment.html and scanning the worktree for retired vocabulary surfaced one user-visible documentation bug, several stale glossary/comment references, and a set of deliberate or partial spec divergences.","components":[{"type":"note","id":"critical-wql-guide-bug","tone":"warning","title":"Pre-merge fix required: seeded WQL guide and CONTEXT.md teach unparseable source:feeds","body":"packages/wql/src/wql.ts:579-581 explicitly rejects source:feed, source:feeds, and source:feed:* with a parse error ('source:feeds is retired — the feed corpus is the notebook plane; use source:notebooks or notebook:\u003cslug>'). However, markdown/canvas/guide/wql.md:118 and :164 still instruct users to write source:feeds, and CONTEXT.md:594,598 repeats source:feeds and feed:\u003cslug>. Because markdown/canvas/guide/wql.md is compiled into the core seed and rendered at /page/guide-wql, the live app currently teaches syntax that the WQL parser rejects."},{"type":"table","id":"spec-divergences-table","title":"Spec vs. implementation audit (docs/language-alignment.html vs. PR #1103)","body":"Items from the proposal document that were narrowed, implemented differently in tickets 01-12, or left out.","columns":["Area","Proposal Spec (docs/language-alignment.html)","Actual Implementation in PR #1103","Assessment"],"rows":[["Feed WQL Plane (§1, §8.2, §10.2)",":feed{} target plane listing configured feed sources on /feeds","No :feed target in WQL_FIND_TARGETS (vocabulary.ts:111). /feeds binds :notebook{source:notebooks} (streamProfile.ts:153) and renders feed cards via FeedCard/useLibraryList; /feed/:slug renders FeedDetailPage","Deliberate ticket scope reduction (disclosed in PR summary table), but leaves /feeds WQL query returning notebook notes rather than feed source rows"],["Filter Keys: feed:, date:, tag: (§10.3)","Add feed:{slug}, date:{YYYY-MM-DD}, and tag:{type}:{slug} filter keys","catalog: was replaced by notebook: (no feed: filter key). Dates still use window suffixes (from/to/last), not date:. Typed tags remain the 5 fixed keys (domain, format, equipment, quality, intent); tag: is label-only on :tag{}","Missed from §10.3; /day/{date} and /t/{type}/{tag} do not have 1:1 filter-key equivalents on the note plane"],["Block Plane Filters (§10.1, §10.3)","Make page:{slug} and typed tags work on :block{} as well as :note{}","capabilities.ts:31 and QueryService.ts:426-428,1655-1770 apply page: and typed-tag pushdown on the note plane only; :block{} still ignores both","Partial implementation; block plane still lacks page: and typed-tag filtering"],["Dated Notebook Item URL (§8.4)","Drop 4-segment /feeds/:feedSlug/:date/:item URLs in favor of /note/\u003cuuid> or 2-segment routes","routes.ts:38,144-146 keeps 4-segment /notebook/:slug/:itemDate/:item for seeded dated items","Pragmatic retention: needed for deterministic seeded dated-item routing before a journal note is minted on Play"],["Legacy URL Redirects (§8.4, D8)","Redirect /c/:slug, /d/:slug, /e/:slug to canonical routes","routes.ts and routeRedirects.tsx delete all retired content route redirects so old paths 404 (pinned by e2e/live-app/url-scheme.e2e.ts)","Intentional ticket 09 decision ('no backwards compatibility, clean cutover')"],["Seed Provenance Fields (§3.2)","Rename seedOrigin, seedVersion, seedChunkId -> feedId, feedVersion, feedChunkId","storage.ts:48-57 keeps seedOrigin/seedVersion/seedChunkId for artifact wire compatibility and adds feedOrigin/feedSourceId alongside them","Documented exception in CONTEXT.md:140-142 to avoid breaking persisted wire state, though feedOrigin is redundant with feedSourceId"],["WQL_FIND_TARGETS Docstring (vocabulary.ts:108)",":notebook{} described in doc comment as 'lists the notebook containers'","QueryService.ts:2495-2497 delegates :notebook{} to target: 'note' (returns member notes of all notebooks, not container rows)","Docstring contradiction inside packages/wql/src/vocabulary.ts:108 vs QueryService.ts:2485"]]},{"type":"table","id":"leftover-vocabulary-table","title":"Leftover retired vocabulary & stale references across the repo","body":"Exact locations where retired terms, routes, or deleted filenames survived the ticket 12 sweep.","columns":["Category","Location","Stale Reference","Recommended Fix"],"rows":[["Live App Guide (Seeded)","markdown/canvas/guide/wql.md:118, 164","`feeds` (notebook notes) and `source:feeds` narrows to feed-delivered notes","Replace with `notebooks` and `source:notebooks`, then run seed sync"],["Live App Guide (Seeded)","markdown/canvas/guide/wql.md:122","Says 'Only user-created notes (seedOrigin !== seed) are editable'","Update to state the ticket 05 rule: editability follows user-owned notebooks (isNoteEditable)"],["Canonical Glossary","CONTEXT.md:585","Grouping entry still cites deleted `script-collections.ts` and `script-feeds.ts`","Update to `script-notebooks.ts`"],["Canonical Glossary","CONTEXT.md:594, 598","WQL Composer Panel & WQL Source Filter cite `feeds`, `find:block{!source:feeds}`, and `feed:\u003cslug>`","Update to `notebooks`, `!source:notebooks`, and `notebook:\u003cslug>`"],["Root & App Docs","README.md:234, 243-246; apps/playground/CONTEXT.md:48-50","Cites `markdown/collections`, `/notes/:noteId`, `/collections`, `/feeds` (as date-indexed workouts), and `/catalogs`","Refresh route tour in README.md and stream-route list in apps/playground/CONTEXT.md"],["Code Comments","apps/playground/app/lib/entryMapper.ts:94, 111","Line 94 says `Named Page.slug — the /p/:slug route slug`; line 111 says `true only for user-created notes (seedOrigin !== 'seed')`","Update comments to `/page/:slug` and notebook-ownership editability"],["Code Comments","apps/playground/app/lib/entryActions.ts:14; FacetProperties.tsx:142; QueryService.ts:287","entryActions cites `/feed/:feedSlug/:date/:item`; FacetProperties cites `collection` head; QueryService cites `feed:\u003cslug>` targets","Update comments to match current route and WQL grammar"],["Test Fixtures / Titles","AnalyticsExplorerPage.test.tsx:45-46; journal-entry.e2e.ts:4,36,212; notebook-plane.e2e.ts:212; note-persistence-save-load.e2e.ts:252","Test fixture casts retired `catalog: 'stronglifts'`; E2E titles/comments cite `/journal/:date`, `/p/`, and `/notes/:id`","Clean up test descriptions and remove retired `catalog` property from fixture"]]}]},{"type":"section","id":"code-quality-and-risks","title":"3. Standards, code smells, and edge-case risks","body":"Inspection of the 476-file diff against repo conventions (AGENTS.md, .github/copilot-instructions.md) and Qodana's PR report.","components":[{"type":"table","id":"standards-and-risks-table","title":"Standards violations, Qodana warnings, and runtime edge cases","columns":["Severity","Location","Finding","Fix"],"rows":[["Standard / Qodana","packages/wql/src/QueryService.ts:98-118","Mid-file import & re-export of DEFAULT_NOTEBOOK_SLUGS, isNoteEditable, etc. placed after function notebookSlugOfSourceId (line 91)","Move import and re-export block to top of file with the other @bitcobblers/wod-wiki-core imports (lines 22-23)"],["Standard / Qodana","apps/playground/src/services/content/IndexedDBContentProvider.ts:2-8; NotebookService.ts:18","Mixes deep relative imports (../../types/..., ../types/notebook) with @/* path aliases in the same file (Qodana 'Import can be shortened')","Use @/* path alias consistently for src/ imports per .github/copilot-instructions.md"],["Edge Case (YAML)","apps/playground/src/services/NotebookService.ts:389-393","landingRawContent interpolates user notebook description and icon into YAML frontmatter without quoting (`description: ${meta.description}`); colons or hashes in descriptions corrupt generic frontmatter parsers","JSON.stringify or YAML-quote scalar values when serializing landing note frontmatter"],["Edge Case (Error UX)","apps/playground/src/components/organisms/notebook/NotebookList.tsx:49-54","handleDelete uses try { ... } finally { ... } without a catch block; a rejected delete leaves an unhandled promise rejection with no user feedback","Add catch block to surface or log deletion errors cleanly"],["Edge Case (Reset)","apps/playground/app/lib/viewSettingsStorage.ts:110-115","resetViewSettings removes the current key and first-hop legacy alias, but misses the second-hop /collections key behind /notes","Walk the full LEGACY_ROUTE_ALIASES chain on reset just as readRaw does on load"],["Edge Case (Placement)","apps/playground/app/components/organisms/journal/NotePlacementDialog.tsx:176-190 vs 150-188","Add and Move reject supplying both date and slug, but Clone passes both journalDate and slug simultaneously; line 209 also throws an Error caught immediately at line 213 for local control flow (Qodana warning)","Align Clone validation with Add/Move and replace the local throw/catch with a direct state setter return"],["Edge Case (Race)","apps/playground/src/services/content/IndexedDBContentProvider.ts:208-214","Slug page creation does getPageBySlug -> savePage without the unique-index collision catch-and-reread used by getOrCreatePageForDate (StorageService.ts:487-501)","Add a getOrCreatePageForSlug helper on StorageService mirroring getOrCreatePageForDate"]]}]},{"type":"section","id":"dead-code-and-simplifications","title":"4. Dead code & simplification opportunities unlocked by PR #1103","body":"Because PR #1103 collapsed collections, feeds, and templates into notebooks and notes, several helper functions, legacy layout templates, dual provenance fields, and parallel adapter layers are now unused or redundant.","components":[{"type":"table","id":"dead-code-table","title":"4.1 Immediately deletable dead code (verified 0 production callers across repo)","body":"Every item below was verified via repo-wide grep across packages/, apps/, e2e/, and scripts/.","columns":["Symbol / File","Location","Evidence & Why It Is Dead"],"rows":[["getAllScriptIds()","apps/playground/src/repositories/script-loader.ts:13-21","0 callers outside tests/unit-setup.ts mock. Still greps for retired `/markdown/collections/` which no longer exists on disk."],["getScriptNotebook() & getScriptNotebookItem()","apps/playground/src/repositories/script-notebooks.ts:90-102","0 callers outside tests/unit-setup.ts:88-89 mock. All consumers use getScriptNotebooks() or sync buildScriptNotebooks() + findNotebookItem()."],["getNotebookDateKeys()","apps/playground/src/repositories/script-notebooks.ts:116-118","0 callers anywhere. Date-key summarization moved to notebookGalleryModel.summarizeGrouping (notebookGalleryModel.ts:88-97)."],["groupEntriesByDate() & UNDATED_KEY","apps/playground/app/lib/entryGrouping.ts:14, 29-39","Docstring says 'Legacy signature kept for existing callers and tests', but 0 callers or tests reference either symbol."],["AuthLayout.tsx, StackedLayout.tsx, src/templates/index.ts","apps/playground/src/templates/AuthLayout.tsx, StackedLayout.tsx, index.ts","WorkbenchTemplate.tsx was deleted in this PR and templates/index.ts was reduced to `export {}`. Neither AuthLayout nor StackedLayout has any imports in the repository."],["Duplicate & orphaned test mocks","apps/playground/tests/unit-setup.ts:88-104","`@/repositories/script-loader` is mocked twice with identical code (lines 92-95 and 101-104); `@/repositories/page-examples` is mocked at lines 97-100 but that module was deleted."],["Unused PagePlacement helpers","packages/core/src/models/PagePlacement.ts:92-99, 142-152","primaryPlacement, placementTarget, placementsOnDate, and placementsOnSlug have 0 production callers (only unit-tested in PagePlacement.test.ts)."],["fromNotebookTag()","packages/core/src/types/notebook.ts:77-78 & apps/playground/src/types/notebook.ts:51-53","0 production callers (only tested in packages/core/tests/index.test.ts); QueryService uses notebookSlugFromId(tag) instead."]]},{"type":"cards","id":"simplification-cards","title":"4.2 Structural simplifications and de-duplication opportunities","columns":2,"items":[{"badge":"Dual Field #1","title":"Drop Entry.noteId (always identical to Entry.id)","body":"In apps/playground/app/lib/entryMapper.ts:224,229, toEntry sets both id: note.id and noteId: note.id, while effortToEntry, rowsRunToEntry, and unifiedEventToEntry never set noteId. All 10 consumer sites doing `entry.noteId ?? entry.id` (entrySearch.ts:148, FacetProperties.tsx:235,515, conditionsFacets.ts:483-515, LibraryRow.tsx:251, StreamFeed.tsx:202, QueriableStreamView.tsx:1207) can use `entry.id` directly."},{"badge":"Dual Field #2","title":"Collapse Notebook.id + 5 write-only fields on Notebook","body":"Every Notebook constructor in NotebookService.ts sets `id` and `notebookId` to the exact same `notebook/{slug}` value. Moreover, `feedEntryId`, `packageId`, `sourceUrl`, `repositoryUrl`, and `lastEditedAt` on the Notebook interface (packages/core/src/types/notebook.ts:60-70) are populated by NotebookService.ts:74-80,135-183 and never read anywhere in apps/. `getFeedNotebooks(options?: { onlySubscribed })` also has 0 callers passing options."},{"badge":"Dual Field #3","title":"Note.feedOrigin is 100% derivable from Note.feedSourceId","body":"packages/storage/src/validation.ts:42-44 enforces `feedOrigin === 'feed' \u003c=> Boolean(feedSourceId)`. Only two places read `feedOrigin` (`isNoteEditable` in notebook.ts:45 and `isJournalRow` in QueryService.ts:247), both of which can check `!note.feedSourceId`. Removing `feedOrigin` (or deriving it at read time) eliminates `FeedOrigin` across core, engine, storage, and WQL."},{"badge":"Triple Duplication","title":"Unify the 3 copies of the core/default notebooks table","body":"The built-in notebooks (journal, playground, defaults, guides, efforts, equipment, dashboards) are defined three times: DEFAULT_NOTEBOOK_SLUGS in packages/core/src/types/notebook.ts:11, RESERVED_SLUGS + getDefaultNotebooks() in NotebookService.ts:32-40,92-186, and CORE_NOTEBOOKS in notebookGalleryModel.ts:163-170. A single declarative metadata table in core or feedSources removes ~45 lines and prevents drift."},{"badge":"Adapter Collapse","title":"Merge script-notebooks.ts into groupings.ts","body":"Before PR #1103, groupings.ts was shared by two adapters (script-collections.ts and script-feeds.ts). Now script-notebooks.ts is the sole consumer and copies every Grouping/GroupingItem field 1:1 just to sort items (script-notebooks.ts:51-77), while groupings.ts:55,132 keeps a vestigial `root: GroupingRoot = 'notebooks'` parameter. Moving the item sort into groupings.ts lets ScriptNotebook alias Grouping directly (~35 lines saved)."},{"badge":"Duplicate Exports","title":"Deduplicate WQL_SOURCES, notebook tag helpers, and gallery helpers","body":"1) packages/wql/src/vocabulary.ts:200 defines WQL_SOURCES identically to WQL_FIND_TARGETS (:111) — alias it. 2) apps/playground/src/types/notebook.ts:43-56 re-implements NOTEBOOK_TAG_PREFIX and toNotebookTag instead of re-exporting from @bitcobblers/wod-wiki-core. 3) notebookGalleryModel.ts exports filterNotebooks, sortNotebooks, and groupNotebooksByFeed which are only used in unit tests (production uses the Feed-level equivalents)."}]}]},{"type":"timeline","id":"recommended-action-plan","title":"5. Recommended action plan","body":"Ordered by impact and risk.","items":[{"meta":"Step 1 · Pre-Merge (5 min)","title":"Fix stale source:feeds in markdown/canvas/guide/wql.md and CONTEXT.md","body":"Replace `feeds` / `source:feeds` / `feed:\u003cslug>` with `notebooks` / `source:notebooks` / `notebook:\u003cslug>` in markdown/canvas/guide/wql.md:118,122,164 and CONTEXT.md:585,594,598, then re-run seed sync so /page/guide-wql does not teach syntax rejected by validateSourceFilter."},{"meta":"Step 2 · Pre-Merge Polish (15 min)","title":"Fix the 2 import-order/alias issues and 3 small defensive bugs","body":"Move the mid-file import in QueryService.ts:98-118 to the top; shorten relative imports in IndexedDBContentProvider.ts and NotebookService.ts; quote YAML frontmatter scalars in NotebookService.ts:389-393; add a catch block in NotebookList.tsx:49-54; walk all alias hops in resetViewSettings (viewSettingsStorage.ts:110)."},{"meta":"Step 3 · Post-Cutover Trim (30 min)","title":"Delete the 6 zero-caller dead code items and duplicate test mocks","body":"Remove getAllScriptIds, getScriptNotebook, getScriptNotebookItem, getNotebookDateKeys, groupEntriesByDate/UNDATED_KEY, AuthLayout.tsx, StackedLayout.tsx, src/templates/index.ts, and the duplicate/orphaned mocks in tests/unit-setup.ts:88-104."},{"meta":"Step 4 · Follow-Up Simplification (1 hr)","title":"Collapse Entry.noteId, script-notebooks/groupings, and the 3 core-notebook tables","body":"Replace entry.noteId with entry.id across the 10 call sites; fold script-notebooks.ts sorting into groupings.ts; unify the core notebook definitions across core, NotebookService, and notebookGalleryModel; and decide whether /feeds should gain a dedicated :feed{} WQL plane or keep :notebook{source:notebooks}."}]}]}</script>
  <script id="whiteboard-renderer">
  (() => {
    'use strict';
    const root = document.getElementById('whiteboard');
    const spec = JSON.parse(document.getElementById('whiteboard-data').textContent);
    const usedIds = new Set(['whiteboard']);
    const tones = new Set(['info', 'success', 'warning']);

    function element(tag, className, value) {
      const node = document.createElement(tag);
      if (className) node.className = className;
      if (value !== undefined && value !== null) node.textContent = String(value);
      return node;
    }

    function anchor(node, id) {
      if (usedIds.has(id)) throw new Error(`Duplicate whiteboard id: ${id}`);
      usedIds.add(id);
      node.id = id;
      node.dataset.whiteboardAnchor = '';
      return node;
    }

    function text(parent, tag, value, id, className = '') {
      if (value === undefined || value === null || value === '') return null;
      const node = anchor(element(tag, className, value), id);
      parent.appendChild(node);
      return node;
    }

    function baseId(component, path) {
      if (!component || Array.isArray(component) || typeof component !== 'object') throw new Error(`Component ${path} must be an object`);
      if (component.id !== undefined && !/^[A-Za-z][A-Za-z0-9_-]*$/.test(component.id)) throw new Error(`Invalid component id at ${path}`);
      return component.id ? `wb-${component.id}` : `wb-c-${path.replace(/\./g, '-')}`;
    }

    function headingAndBody(component, node, id) {
      text(node, 'h2', component.title, `${id}-title`);
      text(node, 'p', component.body, `${id}-body`);
    }

    const renderers = {
      hero(component, path, id) {
        const node = element('section', 'wb-hero');
        text(node, 'p', component.eyebrow, `${id}-eyebrow`, 'wb-eyebrow');
        text(node, 'h2', component.title, `${id}-title`);
        text(node, 'p', component.body, `${id}-body`);
        return node;
      },
      section(component, path, id) {
        const node = element('section', 'wb-card wb-stack');
        headingAndBody(component, node, id);
        if (!Array.isArray(component.components)) throw new Error(`${path}.components must be an array`);
        component.components.forEach((child, index) => node.appendChild(render(child, `${path}.${index}`)));
        return node;
      },
      cards(component, path, id) {
        const node = element('section', 'wb-card');
        headingAndBody(component, node, id);
        const grid = element('div', 'wb-grid');
        const columns = component.columns === undefined ? 'auto-fit' : component.columns;
        if (columns !== 'auto-fit' && (!Number.isInteger(columns) || columns < 1 || columns > 4)) throw new Error(`${path}.columns must be auto-fit or an integer from 1 to 4`);
        grid.style.setProperty('--wb-columns', columns);
        if (!Array.isArray(component.items)) throw new Error(`${path}.items must be an array`);
        component.items.forEach((item, index) => {
          const card = element('article');
          text(card, 'span', item.badge, `${id}-item-${index}-badge`, 'wb-badge');
          text(card, 'h3', item.title, `${id}-item-${index}-title`);
          text(card, 'p', item.body, `${id}-item-${index}-body`);
          grid.appendChild(card);
        });
        node.appendChild(grid);
        return node;
      },
      metrics(component, path, id) {
        const node = element('section', 'wb-card');
        headingAndBody(component, node, id);
        const grid = element('div', 'wb-grid wb-metrics');
        if (!Array.isArray(component.items)) throw new Error(`${path}.items must be an array`);
        component.items.forEach((item, index) => {
          const pair = element('dl');
          text(pair, 'dd', item.value, `${id}-item-${index}-value`);
          text(pair, 'dt', item.label, `${id}-item-${index}-label`);
          text(pair, 'p', item.detail, `${id}-item-${index}-detail`);
          grid.appendChild(pair);
        });
        node.appendChild(grid);
        return node;
      },
      list(component, path, id) {
        const node = element('section', 'wb-card');
        headingAndBody(component, node, id);
        if (!Array.isArray(component.items)) throw new Error(`${path}.items must be an array`);
        const list = element(component.ordered ? 'ol' : 'ul', 'wb-list');
        component.items.forEach((item, index) => text(list, 'li', item, `${id}-item-${index}`));
        node.appendChild(list);
        return node;
      },
      table(component, path, id) {
        const node = element('section', 'wb-card');
        headingAndBody(component, node, id);
        if (!Array.isArray(component.columns) || !Array.isArray(component.rows)) throw new Error(`${path} requires columns and rows arrays`);
        const wrap = element('div', 'wb-table-wrap');
        const table = element('table', 'wb-table');
        const thead = element('thead');
        const header = element('tr');
        component.columns.forEach((column, index) => text(header, 'th', column, `${id}-column-${index}`));
        thead.appendChild(header);
        table.appendChild(thead);
        const tbody = element('tbody');
        component.rows.forEach((row, rowIndex) => {
          if (!Array.isArray(row) || row.length !== component.columns.length) throw new Error(`${path}.rows.${rowIndex} must have ${component.columns.length} cells`);
          const tr = element('tr');
          row.forEach((cell, columnIndex) => text(tr, 'td', cell, `${id}-row-${rowIndex}-cell-${columnIndex}`));
          tbody.appendChild(tr);
        });
        table.appendChild(tbody);
        wrap.appendChild(table);
        node.appendChild(wrap);
        return node;
      },
      timeline(component, path, id) {
        const node = element('section', 'wb-card');
        headingAndBody(component, node, id);
        if (!Array.isArray(component.items)) throw new Error(`${path}.items must be an array`);
        const list = element('ol', 'wb-timeline');
        component.items.forEach((item, index) => {
          const entry = element('li');
          text(entry, 'p', item.meta, `${id}-item-${index}-meta`, 'wb-meta');
          text(entry, 'h3', item.title, `${id}-item-${index}-title`);
          text(entry, 'p', item.body, `${id}-item-${index}-body`);
          list.appendChild(entry);
        });
        node.appendChild(list);
        return node;
      },
      note(component, path, id) {
        const tone = component.tone || 'info';
        if (!tones.has(tone)) throw new Error(`${path}.tone must be info, success, or warning`);
        const node = element('aside', `wb-note wb-note-${tone}`);
        headingAndBody(component, node, id);
        return node;
      }
    };

    function render(component, path) {
      const id = baseId(component, path);
      const renderer = renderers[component.type];
      if (!renderer) throw new Error(`Unknown component type at ${path}: ${component.type}`);
      return renderer(component, path, id);
    }

    try {
      const header = element('header', 'wb-document-header');
      text(header, 'h1', spec.title, 'wb-document-title');
      text(header, 'p', spec.subtitle, 'wb-document-subtitle');
      const stack = element('div', 'wb-stack');
      spec.components.forEach((component, index) => stack.appendChild(render(component, String(index))));
      root.replaceChildren(header, stack);
    } catch (error) {
      root.replaceChildren(anchor(element('p', 'wb-render-error', error.message), 'wb-render-error'));
      console.error(error);
    }
  })();
  </script>

<script id="wb-script">
(() => {
  'use strict';
  const byId = id => document.getElementById(id);
  const root = document.querySelector('[data-whiteboard-document]');
  const anchors = [...root.querySelectorAll('[data-whiteboard-anchor]')];
  const documentUrl = new URL(location.href);
  documentUrl.hash = '';
  const storageKey = 'whiteboard-html:' + documentUrl.href;
  const sourceFile = document.querySelector('meta[name="whiteboard-source"]').content;
  const skillFile = document.querySelector('meta[name="whiteboard-skill"]').content;
  const editor = byId('wb-editor');
  const floatBtn = byId('wb-float-btn');
  let annotations = [], active = -1, editing = -1, draft = null, picking = false, canPersist = true, copyTimer;
  const originalTabindex = new Map(anchors.map(el => [el, el.getAttribute('tabindex')]));
  const warnStorage = message => { byId('wb-storage-warning').textContent = message; };

  function wrapRange(range, id) {
    const mark = document.createElement('mark');
    mark.className = 'wb-mark';
    mark.dataset.wbId = id;
    mark.tabIndex = 0;
    mark.title = 'Click to view annotation';

  function restoreHighlight(container, quote, id) {
    if (!container || !quote) return null;
    const text = container.textContent;
    const idx = text.indexOf(quote);
    if (idx === -1) return null;
    const walker = document.createTreeWalker(container, NodeFilter.SHOW_TEXT);
    let cur = 0, startNode = null, startOffset = 0, endNode = null, endOffset = 0, node;
    while ((node = walker.nextNode())) {
      const len = node.textContent.length;
      if (!startNode && cur + len > idx) {
        startNode = node;
        startOffset = idx - cur;
      }
      if (cur + len >= idx + quote.length) {
        endNode = node;
        endOffset = (idx + quote.length) - cur;
        break;
      }
      cur += len;
    }
    if (startNode && endNode) {
      const range = document.createRange();
      range.setStart(startNode, startOffset);
      range.setEnd(endNode, endOffset);
      return wrapRange(range, id);
    }
    return null;
  }

  function getContext(range, block) {
    const fullText = block.textContent.replace(/\s+/g, ' ');
    const selectedText = range.toString().trim();
    const idx = fullText.indexOf(selectedText);
    if (idx === -1) return { quote: selectedText, context: selectedText };
    const beforeStart = Math.max(0, idx - 45);
    const prefix = (beforeStart > 0 ? '…' : '') + fullText.slice(beforeStart, idx).trim();
    const afterEnd = Math.min(fullText.length, idx + selectedText.length + 45);
    const suffix = fullText.slice(idx + selectedText.length, afterEnd).trim() + (afterEnd < fullText.length ? '…' : '');
    const context = `${prefix} «${selectedText}» ${suffix}`.trim();
    return { quote: selectedText, context };
  }

  try {
    const saved = localStorage.getItem(storageKey);
    if (saved !== null) {
      const parsed = JSON.parse(saved);
      if (!Array.isArray(parsed) || !parsed.every(item => item && typeof item.anchor === 'string' && typeof item.quote === 'string' && typeof item.note === 'string' && item.anchor && item.note.trim())) throw new Error('Invalid drafts');
      annotations = parsed.map((item, i) => {
        const id = item.id || `wb-ann-${i + 1}-${Math.random().toString(36).slice(2, 7)}`;
        const container = document.getElementById(item.anchor);
        const isHighlight = item.isHighlight !== undefined
          ? Boolean(item.isHighlight)
          : Boolean(item.quote && container && item.quote.length < container.textContent.trim().length);
        return {
          id,
          anchor: item.anchor,
          quote: item.quote,
          context: item.context || item.quote,
          isHighlight,
          note: item.note
        };
      });
      for (const item of annotations) {
        if (item.isHighlight) {
          const container = document.getElementById(item.anchor);
          if (container) restoreHighlight(container, item.quote, item.id);
        }
      }
    }
  } catch {
    canPersist = false;
    warnStorage('Stored drafts could not be read. Existing storage is untouched. New comments stay in memory; Copy before closing.');
  }

  function persist() {
    if (!canPersist) return;
    try { localStorage.setItem(storageKey, JSON.stringify(annotations)); }
    catch { canPersist = false; warnStorage('Draft storage is unavailable. Comments stay in memory; Copy before closing.'); }
  }

  function updateCount() {
    const count = annotations.length;
    const label = `${count} annotation${count === 1 ? '' : 's'}${active < 0 ? '' : `, ${active + 1} of ${count}`}`;
    byId('wb-count').textContent = String(count);
    byId('wb-count').setAttribute('aria-label', label);
    byId('wb-count').title = label;
    for (const id of ['wb-prev', 'wb-next', 'wb-copy']) byId(id).disabled = count === 0;
  }

  function sourceUrl(anchor) {
    const url = new URL(documentUrl);
    url.hash = anchor;
    return url.href;
  }

  function setExpanded(value) {
    byId('wb-current-toggle').setAttribute('aria-expanded', String(value));
    byId('wb-current-body').hidden = !value;
  }

  function showAnnotation(index) {
    active = (index + annotations.length) % annotations.length;
    const item = annotations[active];
    root.querySelectorAll('.wb-highlight').forEach(el => el.classList.remove('wb-highlight'));
    root.querySelectorAll('.wb-mark-active').forEach(el => el.classList.remove('wb-mark-active'));

    const mark = root.querySelector(`.wb-mark[data-wb-id="${item.id}"]`);
    const target = document.getElementById(item.anchor);

    if (mark) {
      mark.classList.add('wb-mark-active');
      mark.scrollIntoView({block: 'center', behavior: 'smooth'});
      mark.focus({preventScroll: true});
      byId('wb-status').textContent = '';
    } else if (target && root.contains(target)) {
      target.classList.add('wb-highlight');
      target.scrollIntoView({block: 'start'});
      target.setAttribute('tabindex', '-1');
      target.focus({preventScroll: true});
      byId('wb-status').textContent = '';
    } else {
      byId('wb-status').textContent = `Source anchor #${item.anchor} is missing. Use the exported quote to locate it.`;
    }

    byId('wb-current-title').textContent = `Annotation ${active + 1} of ${annotations.length}`;
    byId('wb-current-source').textContent = '#' + item.anchor;
    byId('wb-current-source').href = sourceUrl(item.anchor);
    byId('wb-current-quote').textContent = item.quote;
    byId('wb-current-context').textContent = item.context && item.context !== item.quote ? `Context: ${item.context}` : '';
    byId('wb-current-context').hidden = !item.context || item.context === item.quote;
    byId('wb-current-note').textContent = item.note;
    byId('wb-current').hidden = false;
    setExpanded(false);
    updateCount();
  }

  function setPicking(value) {
    picking = value;
    root.classList.toggle('wb-picking', value);
    byId('wb-add').setAttribute('aria-pressed', String(value));
    for (const el of anchors) {
      const previous = originalTabindex.get(el);
      if (value) el.setAttribute('tabindex', '0');
      else if (previous === null) el.removeAttribute('tabindex');
      else el.setAttribute('tabindex', previous);
    }
    byId('wb-status').textContent = value ? 'Click a block, or Tab to a block and press Enter. Escape cancels.' : '';
    hideFloatingButton();
  }

  function hideFloatingButton() {
    floatBtn.style.display = 'none';
  }

  function updateFloatingButton() {
    if (picking || editor.open) { hideFloatingButton(); return; }
    const selection = window.getSelection();
    if (!selection || selection.isCollapsed || selection.rangeCount === 0) {
      hideFloatingButton();
      return;
    }
    const range = selection.getRangeAt(0);
    const start = range.startContainer.nodeType === Node.ELEMENT_NODE ? range.startContainer : range.startContainer.parentElement;
    const target = start.closest('[data-whiteboard-anchor]');
    if (!target || !root.contains(target) || !selection.toString().trim()) {
      hideFloatingButton();
      return;
    }
    const rect = range.getBoundingClientRect();
    if (rect.width === 0 && rect.height === 0) {
      hideFloatingButton();
      return;
    }
    floatBtn.style.display = 'flex';
    const left = Math.max(60, Math.min(window.innerWidth - 60, rect.left + rect.width / 2));
    const top = Math.max(rect.top, 50);
    floatBtn.style.left = `${left}px`;
    floatBtn.style.top = `${top}px`;
  }

  function openEditor(item, index = -1, liveRange = null) {
    setPicking(false);
    hideFloatingButton();
    editing = index;
    draft = {
      id: item.id || `wb-ann-${Date.now()}-${Math.random().toString(36).slice(2, 6)}`,
      anchor: item.anchor,
      quote: item.quote,
      context: item.context || item.quote,
      isHighlight: Boolean(item.isHighlight || liveRange),
      liveRange
    };
    byId('wb-editor-title').textContent = index < 0 ? (draft.isHighlight ? 'Add text annotation' : 'Add block annotation') : 'Edit annotation';
    byId('wb-target').textContent = `#${item.anchor}\n${item.quote}`;
    byId('wb-note').value = item.note || '';
    byId('wb-note').setCustomValidity('');
    window.getSelection().removeAllRanges();
    editor.showModal();
    byId('wb-note').focus();
  }

  floatBtn.addEventListener('click', () => {
    const selection = window.getSelection();
    if (selection && selection.rangeCount > 0 && !selection.isCollapsed) {
      const range = selection.getRangeAt(0).cloneRange();
      const start = range.startContainer.nodeType === Node.ELEMENT_NODE ? range.startContainer : range.startContainer.parentElement;
      const target = start.closest('[data-whiteboard-anchor]');
      if (target && root.contains(target) && selection.toString().trim()) {
        const { quote, context } = getContext(range, target);
        openEditor({ anchor: target.id, quote, context, isHighlight: true }, -1, range);
      }
    }
  });

  byId('wb-add').addEventListener('click', () => {
    const selection = window.getSelection();
    if (selection.rangeCount && !selection.isCollapsed) {
      const range = selection.getRangeAt(0).cloneRange();
      const start = range.startContainer.nodeType === Node.ELEMENT_NODE ? range.startContainer : range.startContainer.parentElement;
      const target = start.closest('[data-whiteboard-anchor]');
      if (target && root.contains(range.startContainer) && root.contains(range.endContainer) && selection.toString().trim()) {
        const { quote, context } = getContext(range, target);
        openEditor({ anchor: target.id, quote, context, isHighlight: true }, -1, range);
        return;
      }
    }
    setPicking(!picking);
  });

  function pickBlock(event) {
    const mark = event.target.closest('.wb-mark');
    if (mark && !picking) {
      const id = mark.dataset.wbId;
      const index = annotations.findIndex(a => a.id === id);
      if (index !== -1) {
        event.preventDefault();
        showAnnotation(index);
        return;
      }
    }
    if (!picking || (event.type === 'keydown' && event.key !== 'Enter' && event.key !== ' ')) return;
    const target = event.target.closest('[data-whiteboard-anchor]');
    if (!target || !root.contains(target)) return;
    event.preventDefault();
    event.stopPropagation();
    openEditor({ anchor: target.id, quote: target.textContent.trim(), context: target.textContent.trim(), isHighlight: false });
  }

  root.addEventListener('click', pickBlock);
  root.addEventListener('keydown', pickBlock);
  document.addEventListener('pointerup', () => setTimeout(updateFloatingButton, 10));
  document.addEventListener('keyup', e => { if (e.key !== 'Escape') setTimeout(updateFloatingButton, 10); });
  document.addEventListener('selectionchange', () => {
    const sel = window.getSelection();
    if (!sel || sel.isCollapsed) hideFloatingButton();
  });
  document.addEventListener('keydown', event => {
    if (event.key === 'Escape') {
      if (picking) setPicking(false);
      hideFloatingButton();
    }
  });

  byId('wb-note').addEventListener('input', () => byId('wb-note').setCustomValidity(''));
  byId('wb-form').addEventListener('submit', event => {
    event.preventDefault();
    const note = byId('wb-note').value.trim();
    if (!note) { byId('wb-note').setCustomValidity('Enter a comment.'); byId('wb-note').reportValidity(); return; }

    const item = {
      id: draft.id,
      anchor: draft.anchor,
      quote: draft.quote,
      context: draft.context,
      isHighlight: draft.isHighlight,
      note
    };

    if (editing < 0) {
      annotations.push(item);
      if (item.isHighlight) {
        if (draft.liveRange) {
          wrapRange(draft.liveRange, item.id);
        } else {
          const container = document.getElementById(item.anchor);
          if (container) restoreHighlight(container, item.quote, item.id);
        }
      }
    } else {
      annotations[editing] = item;
    }

    persist();
    editor.close();
    showAnnotation(editing < 0 ? annotations.length - 1 : editing);
  });

  byId('wb-cancel').addEventListener('click', () => editor.close());
  byId('wb-prev').addEventListener('click', () => showAnnotation(active < 0 ? annotations.length - 1 : active - 1));
  byId('wb-next').addEventListener('click', () => showAnnotation(active + 1));
  byId('wb-edit').addEventListener('click', () => openEditor(annotations[active], active));

  byId('wb-delete').addEventListener('click', () => {
    if (!confirm('Delete this annotation?')) return;
    const removed = annotations.splice(active, 1)[0];
    if (removed) {
      root.querySelectorAll(`.wb-mark[data-wb-id="${removed.id}"]`).forEach(m => m.replaceWith(...m.childNodes));
    }
    persist();
    if (annotations.length) showAnnotation(Math.min(active, annotations.length - 1));
    else {
      active = -1;
      byId('wb-current').hidden = true;
      root.querySelectorAll('.wb-highlight').forEach(el => el.classList.remove('wb-highlight'));
      updateCount();
    }
  });

  byId('wb-hide').addEventListener('click', () => { byId('wb-current').hidden = true; });
  byId('wb-current-toggle').addEventListener('click', () => {
    setExpanded(byId('wb-current-toggle').getAttribute('aria-expanded') !== 'true');
  });

  function resetCopyButton() {
    byId('wb-copy').classList.remove('wb-copied');
    byId('wb-copy').setAttribute('aria-label', 'Copy annotations');
    byId('wb-copy').title = 'Copy annotations';
    byId('wb-copy-icon').toggleAttribute('hidden', false);
    byId('wb-copy-check').toggleAttribute('hidden', true);
  }

  byId('wb-copy').addEventListener('click', async () => {
    const heading = `# Whiteboard HTML annotations\n\nRead skill://whiteboard-html before applying this feedback. If unavailable, read the Skill file below.\nSkill file: ${skillFile}\nDocument: ${sourceFile}\nURL: ${documentUrl.href}\nTitle: ${document.title}\nAnnotations: ${annotations.length}\n`;
    const body = annotations.map((item, index) => {
      const label = item.isHighlight ? 'Highlighted text' : 'Quoted text';
      let block = `\n## Annotation ${index + 1}\nAnchor: #${item.anchor}\nSource: ${sourceUrl(item.anchor)}\n${label}:\n${item.quote.split('\n').map(line => '> ' + line).join('\n')}\n`;
      if (item.context && item.context !== item.quote) {
        block += `Context:\n${item.context.split('\n').map(line => '> ' + line).join('\n')}\n`;
      }
      block += `Comment:\n${item.note}\n`;
      return block;
    }).join('');

    clearTimeout(copyTimer);
    resetCopyButton();
    const output = byId('wb-export-text');
    output.value = heading + body;
    try {
      await navigator.clipboard.writeText(output.value);
      byId('wb-copy').classList.add('wb-copied');
      byId('wb-copy').setAttribute('aria-label', 'Annotations copied to clipboard');
      byId('wb-copy').title = 'Annotations copied to clipboard';
      byId('wb-copy-icon').toggleAttribute('hidden', true);
      byId('wb-copy-check').toggleAttribute('hidden', false);
      byId('wb-status').textContent = 'Annotations copied to clipboard. Drafts are kept.';
      copyTimer = setTimeout(() => {
        resetCopyButton();
        byId('wb-status').textContent = '';
      }, 3000);
    } catch {
      byId('wb-copy-status').textContent = 'Clipboard blocked. Text is selected; press Ctrl+C or Cmd+C, then paste into your agent window.';
      byId('wb-export').showModal();
      output.focus();
      output.select();
    }
  });

  byId('wb-export-close').addEventListener('click', () => byId('wb-export').close());
  updateCount();
})();
</script>
