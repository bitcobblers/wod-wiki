  <script id="whiteboard-data" type="application/json">{"title":"Screen & Data Level Navigation Framework","subtitle":"Streamlined 3-Domain L1 Rail with Pages L2 Roll-Up, Feed Configuration, and Screen Review Protocol","components":[{"type":"hero","id":"hero-framework","eyebrow":"Architecture Review & Feedback Framework","title":"Navigating Data Levels: L1, L2, and L3 System","body":"A unified framework mapping the application data hierarchy (Domain → Container/Query → Record/Outline) to physical navigation surfaces (Rail → Context Sidebar → Document Outline & View Controls). Features the radical simplification of L1 down to 3 core content domains (Notebooks, Journal, Pages) plus Settings, removing standalone entity rails (Notes, Sessions, Efforts, Equipment, Tags, Dashboards) by rolling them into Pages L2 subsections."},{"type":"metrics","id":"metrics-overview","title":"Navigation & Screen Scope","body":"Current scale of the navigation tree, data hierarchy, and evaluated surfaces.","items":[{"value":"11 → 3 + 1","label":"L1 Rail Domains","detail":"Notebooks, Journal, Pages + Settings"},{"value":"6 Rolled Up","label":"Removed from L1","detail":"Notes, Sessions, Efforts, Gear, Tags, Dashboards → Pages L2"},{"value":"17 Screens","label":"Cataloged Views","detail":"Audited from docs/screens/"},{"value":"v2 Feedback","label":"Interactive Review","detail":"Annotate selections & export future states"}]},{"type":"section","id":"core-framework-section","title":"1. The Unified 3-Tier Data Navigation Framework","body":"To eliminate confusion, every screen strictly adheres to three clear data levels that map consistently between desktop columns and mobile overlays.","components":[{"type":"cards","id":"data-tiers-cards","title":"Data Hierarchy vs. Navigation Surface","body":"What each level represents conceptually and where it lives physically.","columns":3,"items":[{"badge":"L1 • Domain Level (Macro)","title":"Where in the universe am I?","body":"Strictly limited to 3 Primary Content Domains: Notebooks, Journal, Pages (plus Settings pinned to bottom). All individual entity types are removed from L1. Desktop: 56px fixed left icon rail. Mobile: AppRail inside the left slide-over drawer."},{"badge":"L2 • Container / Query (Meso)","title":"What collection or filter am I in?","body":"The current scope within the domain: Notebooks (Subscribed vs Available & Feed sources), Journal (Calendar mini-month & Notebook selector), or Pages (Subsections for Notes, Sessions, Efforts, Equipment, Tags, Dashboards, Guides). Desktop: 240px context sidebar. Mobile: slide-over left drawer body."},{"badge":"L3 • Record / View / TOC (Micro)","title":"What piece or view mode am I manipulating?","body":"The current record's internal structure or stream layout: 'On this page' heading anchors, runnable block list, stream layout (Cards/Rows), and date window. Desktop: 240px right rail (2xl+) or ⋯ menu. Mobile: right slide-over drawer."}]},{"type":"cards","id":"three-macro-paths-cards","title":"The Three Primary Macro Pathways to Notes & Content (The New L1)","body":"Every note and data record in the system is reachable through one of three intuitive top-level paths, each serving a distinct mental model.","columns":3,"items":[{"badge":"L1 Path 1 • Curated Collections","title":"Notebooks (/notebooks)","body":"Index of Notebooks themselves (not flat notes). Displays subscribed notebooks by default with toggle to include unsubscribed notebooks for subscription. Per-notebook sync controls. Clicking any notebook navigates to /notebook/:slug (its README/root note). Includes 'Configure Sources' button routing to /settings feed management."},{"badge":"L1 Path 2 • Chronological Life","title":"Journal (/journal, /journal/:date)","body":"Time and calendar-centric view of daily notes and workouts. L2 provides a calendar mini-month and timeline. Default shows the user's own journal entries; provides multi-select toggles in L2 to include specific subscribed notebooks on the calendar."},{"badge":"L1 Path 3 • Universal Index","title":"Pages (/pages)","body":"Universal flat, sortable index of all records having a unique slug (or direct note link if unslugged). Absorbs all former standalone L1 entities (Notes, Sessions, Efforts, Equipment, Tags, Guides, Dashboards) into clean L2 subsections."}]},{"type":"cards","id":"l1-pruning-cards","title":"L1 Rail Pruning: What Was Removed & Where It Lives Now","body":"Consolidating 11 fragmented rail icons into Pages L2 subsections eliminates cognitive clutter and visual noise.","columns":3,"items":[{"badge":"Removed from L1","title":"Notes & Dashboards","body":"Now inside Pages L2: Select 'Notes' subsection for all notebook-member and standalone markdown notes. Select 'Dashboards' subsection for analytics explorers and custom vault dashboards."},{"badge":"Removed from L1","title":"Efforts, Equipment, & Sessions","body":"Now inside Pages L2: Select 'Efforts' subsection for movement taxonomy and PR logs. Select 'Equipment' for gear catalog. Select 'Sessions' for completed workout execution histories."},{"badge":"Removed from L1","title":"Tags & Feeds","body":"Now inside Pages L2 & Settings: 'Tags' is an L2 subsection of Pages grouping notes by tag taxonomy. 'Feeds' is moved out of the content rail into Settings under Source & Feed Management."}]},{"type":"note","id":"mental-model-rule","tone":"info","title":"The Golden Rule of Consistency","body":"A user must never wonder 'where am I?'. If you are viewing a single Note (/note/:id), L1 indicates its Domain (Notebooks, Journal, or Pages), L2 shows its parent Container (Notebook member list, Calendar date stack, or Pages subsection), and L3 shows its internal Outline (Headings & Blocks). L2 must never disappear."}]},{"type":"section","id":"screens-audit-section","title":"2. Comprehensive Screen-by-Screen Navigation Audit","body":"Evaluating all 17 primary screens against the streamlined L1 model (Notebooks, Journal, Pages + Settings), with rolled-up L2 subsections and feed configuration.","components":[{"type":"table","id":"screen-matrix-table","title":"Screen Navigation & Data Level Matrix","body":"Complete crosswalk of current implementations versus future-state navigation assignments.","columns":["Screen / Route","Current L1 / L2 / L3","Data Level Mismatch / UX Friction","Proposed Future State L1 / L2 / L3"],"rows":[["Notebooks Library (/notebooks)","L1: Notebooks rail. L2: Flat seed notes mixed with notebooks. L3: Stream facets / sort.","Confuses notebook index with notes index. No way to manage source subscriptions, sync schedules, or navigate to high-level notebook READMEs.","L1: Notebooks. L2: Subscribed notebooks (default) + Toggle unsubscribed notebooks for subscription + Filter by sources + Sync state controls. Header Action: 'Configure Sources' (routes to /settings feed management). Clicking a notebook opens /notebook/:slug. L3: Grid/List layout + Sort."],["Notebook Landing (/notebook/:slug)","L1: Notebooks rail. L2: Redundant notebooks list. L3: Chapter/Workout TOC.","Desktop split pane duplicates L2 list. Clicking a workout updates preview pane without clear parent-child continuity.","L1: Notebooks. L2: Notebook outline (README root, Sections, Workouts index, Progress). L3: Active workout preview actions (Run, Add to Today, Schedule) + Subscription toggle."],["Named Workout Editor (/notebook/:slug/:item)","L1: Notebooks rail. L2: Notebooks listing. L3: Heading/Block TOC.","Feels disconnected from the notebook README. Editing seed note forks into scratch note without clear visual ancestry.","L1: Notebooks. L2: Sibling workouts in the active notebook. L3: Workout script outline + Fork/Schedule action triggers."],["Journal Stream (/journal)","L1: Notebooks rail. L2: Notebooks family panel. L3: Stream controls (layout, date window).","Journal is buried inside Notebooks L1. Calendar view lacks notebook inclusion controls; seed notes pollute daily view.","L1: Journal (Dedicated L1 rail icon). L2: Calendar mini-month / Timeline view + Notebook selector (default: own entries; checkboxes to include subscribed notebooks on calendar). L3: Stream display controls (Cards/Rows, Group by Week/Month)."],["Journal Date Stack (/journal/:date)","L1: Notebooks rail. L2: Notebook family panel. L3: Single date TOC or empty.","Nested under Notebooks. L2 shows other notebooks instead of nearby calendar dates or notes for the day.","L1: Journal. L2: Calendar mini-month + Date switcher (yesterday/today/tomorrow). L3: Multi-note stacked TOC (jump to specific note on that date) + Add Note to Date."],["Universal Note Editor (/note/:noteId)","L1: Notes rail. L2: Blank/hidden or stale query. L3: 'On this page' headings outline.","L2 context vanishes completely. User loses sense of parent notebook, folder, or date. No breadcrumb trail back to parent collection.","L1: Origin Domain (Notebooks, Journal, or Pages). L2: Parent container member list (Notebook workouts, Calendar date stack, or Pages category) with active note highlighted. L3: Heading TOC + Runnable block actions + Read/Edit toggle."],["Universal Pages Index (/pages)","L1: Notes rail (or Pages). L2: Confusing overlap between /notes and /pages. L3: Stream facets.","Notes, Notebooks, and Pages all query the same seed data. Standalone entity rails fragment navigation.","L1: Pages (Universal L1 rail icon). L2: Library variation selector (Subsections for Notes, Sessions, Efforts, Equipment, Tags, Guides, Dashboards — all entities with unique slugs or note links). L3: Sort by name/date/slug + Visible fields + Search."],["Playgrounds Stream (/playgrounds)","L1: Notebooks rail. L2: Notebook family panel. L3: Stream controls.","Playgrounds is a scratchpad environment forced into the Notebooks L1 zone. No quick categorization for scratch notes.","L1: Pages (Scratchpads subsection in L2). L2: Scratch note list sorted by recency + 'New Scratch' button. L3: Sort & search controls."],["Playground Note Editor (/playground/:noteId)","L1: Notebooks rail. L2: Blank or Notebooks panel. L3: Headings outline.","Scratch notes have no save target or notebook container. No obvious button to promote a scratch note into the Journal or a Notebook.","L1: Pages (Scratchpads in L2). L2: Other scratchpad notes for fast switching. L3: Promote to Journal CTA + Promote to Notebook + Script block TOC."],["Efforts Stream (/efforts)","L1: Standalone Efforts rail icon. L2: ConditionsNavPanel (WQL accordion). L3: Stream view options.","Standalone L1 rail icon clutters top-level navigation. L2 accordion displays intimidating WQL syntax.","L1: Pages (Efforts removed from L1; lives under Pages L2 subsection 'Efforts'). L2: Movement taxonomy (Weightlifting, Gymnastics, Monostructural, Custom) + Equipment filters. L3: Grid view, Metrics displayed, Sort."],["Effort Detail (/e/:slug)","L1: Standalone Efforts rail icon. L2: Hidden or stale conditions panel. L3: Movement properties & PR history.","Navigating into an effort hides L2, abandoning the user in a dead-end page. Back navigation loses movement category context.","L1: Pages (Efforts). L2: Movement catalog tree with current effort selected. L3: PR history, derivation rules, associated workouts."],["Equipment Stream (/equipment)","L1: Standalone Equipment rail icon. L2: Category & availability facets. L3: Sort & layout.","Standalone L1 rail icon consumes valuable top-level space for an infrequently accessed gear catalog.","L1: Pages (Equipment removed from L1; lives under Pages L2 subsection 'Equipment'). L2: Gear categories (Barbells, Racks, Cardio, Accessories). L3: Item sorting & availability filter."],["Sessions Stream (/sessions)","L1: Standalone Sessions rail icon. L2: ConditionsNavPanel (hardcoded last 1d). L3: Stream controls.","Standalone L1 icon. Default query was restricted to 'last 1d', hiding past workouts.","L1: Pages (Sessions removed from L1; lives under Pages L2 subsection 'Sessions'). L2: Time presets (All-Time, This Month, PRs Only) + Outcome facets (Rx, Scaled). L3: Group-by & Save to Session' exit flow."],["Settings & Feeds (/settings/*, /load)","L1: Settings rail (pinned bottom). L2: Settings sub-navigation (Theme, Audio, Sync, Backup). L3: Page options.","Feed management is buried or missing an explicit link from the notebooks library.","L1: Settings (Pinned bottom of rail). L2: Dedicated 'Feeds & Sources' management (registered feeds, source sync schedules) + Appearance, Audio, Storage. L3: Feed credentials & import logs."]]}]},{"type":"section","id":"review-framework-section","title":"3. The Screen Review Framework (How to Review & Give Feedback)","body":"Use this structured 4-step framework whenever evaluating a screen or specifying a future-state version.","components":[{"type":"cards","id":"four-step-framework","title":"The 4-Step Screen Review Checklist","body":"Four questions to ask for every screen in the application.","columns":2,"items":[{"badge":"Step 1 • Orientation","title":"1. Where am I in the data model?","body":"Identify the Macro data level (Notebooks, Journal, Pages, Settings), Meso data level (Parent collection, Calendar date, or Pages subsection), and Micro data level (Current entity). Ensure L1 and L2 clearly communicate this location without blank spaces or unexpected route jumps."},{"badge":"Step 2 • Up & Lateral Moves","title":"2. How do I move laterally or up?","body":"Check L2 context: Can the user switch to sibling items (e.g. other notes in the notebook, other dates in the month, other pages in the library variation) without hitting the browser Back button or returning to the root list?"},{"badge":"Step 3 • In-Page Manipulation","title":"3. What can I inspect or configure here?","body":"Check L3 context: Does the screen provide immediate access to in-page section anchors (TOC), runnable block commands, and display layout options (Cards/Rows, visible fields)?"},{"badge":"Step 4 • Mobile & Responsive Parity","title":"4. Does mobile preserve the hierarchy?","body":"Verify mobile drawers: Left drawer must provide L1 rail + L2 scope. Right drawer must provide L3 TOC + display controls. Tapping destinations must auto-dismiss; editing filter checkboxes must retain drawer open until Apply."}]},{"type":"timeline","id":"feedback-workflow-timeline","title":"How to Create Future-State Versions Using This Whiteboard","body":"Step-by-step workflow for providing feedback and creating v2, v3, etc.","items":[{"meta":"Step 1","title":"Highlight & Annotate","body":"Open this HTML file in your browser via file://. Highlight any text row in the table above or in this document. Click 'Annotate selection' and type your feedback, desired changes, or screen redesign proposals."},{"meta":"Step 2","title":"Export Annotations","body":"Click the floating pill icon in the top right corner. Click the copy icon to copy all your saved comments and quotes to your clipboard."},{"meta":"Step 3","title":"Prompt the Next Iteration","body":"Paste the annotations into chat. The agent will read your feedback, update the JSON specification, and run build.py to generate navigation-screen-data-levels.v(N+1).html with your future-state screens built in."},{"meta":"Step 4","title":"Review Version Diffs","body":"Open the new snapshot. Use the version history links at the top (v1, v2, etc.) to toggle between versions, observing how each screen evolved according to your notes."}]}]},{"type":"section","id":"priority-future-states-section","title":"4. Priority Future-State Implementations","body":"Core architectural updates aligned with the Streamlined L1 Rail (Notebooks, Journal, Pages + Settings) and Pages L2 Subsections.","components":[{"type":"cards","id":"priority-cards","title":"Immediate High-Leverage Upgrades","body":"Resolving rail bloat, establishing clean content hierarchy, and empowering source management.","columns":3,"items":[{"badge":"Priority 1 • High","title":"Notebooks Index & Source Management","body":"Rebuild /notebooks as an index of notebooks (not raw notes). Show subscribed notebooks by default with toggle for unsubscribed. Add sync controls and a top 'Configure Sources' button routing to /settings feeds management. Clicking opens /notebook/:slug."},{"badge":"Priority 2 • High","title":"Journal with Notebook Selection","body":"Elevate Journal to its own primary L1. Default calendar shows only the user's personal journal entries. L2 provides checkboxes to include subscribed notebooks on the calendar."},{"badge":"Priority 3 • High","title":"Prune L1: Universal Pages Roll-Up","body":"Remove Notes, Sessions, Efforts, Equipment, Tags, and Dashboards from the L1 rail. Roll them all into Pages L2 subsections for all entities with a unique slug or direct note link."}]},{"type":"note","id":"next-action-note","tone":"success","title":"Ready for v2 Review","body":"The streamlined L1 rail (Notebooks, Journal, Pages + Settings) with all entity types rolled up into Pages L2 subsections is now fully specified. Build and review v2 in your browser to continue annotating screen details."}]}]}</script>
  <script id="whiteboard-renderer">
  (() => {
    'use strict';
    const root = document.getElementById('whiteboard');
    const spec = JSON.parse(document.getElementById('whiteboard-data').textContent);
    const usedIds = new Set(['whiteboard']);
    const tones = new Set(['info', 'success', 'warning']);

    function element(tag, className, value) {
      const node = document.createElement(tag);
      if (className) node.className = className;
      if (value !== undefined && value !== null) node.textContent = String(value);
      return node;
    }

    function anchor(node, id) {
      if (usedIds.has(id)) throw new Error(`Duplicate whiteboard id: ${id}`);
      usedIds.add(id);
      node.id = id;
      node.dataset.whiteboardAnchor = '';
      return node;
    }

    function text(parent, tag, value, id, className = '') {
      if (value === undefined || value === null || value === '') return null;
      const node = anchor(element(tag, className, value), id);
      parent.appendChild(node);
      return node;
    }

    function baseId(component, path) {
      if (!component || Array.isArray(component) || typeof component !== 'object') throw new Error(`Component ${path} must be an object`);
      if (component.id !== undefined && !/^[A-Za-z][A-Za-z0-9_-]*$/.test(component.id)) throw new Error(`Invalid component id at ${path}`);
      return component.id ? `wb-${component.id}` : `wb-c-${path.replace(/\./g, '-')}`;
    }

    function headingAndBody(component, node, id) {
      text(node, 'h2', component.title, `${id}-title`);
      text(node, 'p', component.body, `${id}-body`);
    }

    const renderers = {
      hero(component, path, id) {
        const node = element('section', 'wb-hero');
        text(node, 'p', component.eyebrow, `${id}-eyebrow`, 'wb-eyebrow');
        text(node, 'h2', component.title, `${id}-title`);
        text(node, 'p', component.body, `${id}-body`);
        return node;
      },
      section(component, path, id) {
        const node = element('section', 'wb-card wb-stack');
        headingAndBody(component, node, id);
        if (!Array.isArray(component.components)) throw new Error(`${path}.components must be an array`);
        component.components.forEach((child, index) => node.appendChild(render(child, `${path}.${index}`)));
        return node;
      },
      cards(component, path, id) {
        const node = element('section', 'wb-card');
        headingAndBody(component, node, id);
        const grid = element('div', 'wb-grid');
        const columns = component.columns === undefined ? 'auto-fit' : component.columns;
        if (columns !== 'auto-fit' && (!Number.isInteger(columns) || columns < 1 || columns > 4)) throw new Error(`${path}.columns must be auto-fit or an integer from 1 to 4`);
        grid.style.setProperty('--wb-columns', columns);
        if (!Array.isArray(component.items)) throw new Error(`${path}.items must be an array`);
        component.items.forEach((item, index) => {
          const card = element('article');
          text(card, 'span', item.badge, `${id}-item-${index}-badge`, 'wb-badge');
          text(card, 'h3', item.title, `${id}-item-${index}-title`);
          text(card, 'p', item.body, `${id}-item-${index}-body`);
          grid.appendChild(card);
        });
        node.appendChild(grid);
        return node;
      },
      metrics(component, path, id) {
        const node = element('section', 'wb-card');
        headingAndBody(component, node, id);
        const grid = element('div', 'wb-grid wb-metrics');
        if (!Array.isArray(component.items)) throw new Error(`${path}.items must be an array`);
        component.items.forEach((item, index) => {
          const pair = element('dl');
          text(pair, 'dd', item.value, `${id}-item-${index}-value`);
          text(pair, 'dt', item.label, `${id}-item-${index}-label`);
          text(pair, 'p', item.detail, `${id}-item-${index}-detail`);
          grid.appendChild(pair);
        });
        node.appendChild(grid);
        return node;
      },
      list(component, path, id) {
        const node = element('section', 'wb-card');
        headingAndBody(component, node, id);
        if (!Array.isArray(component.items)) throw new Error(`${path}.items must be an array`);
        const list = element(component.ordered ? 'ol' : 'ul', 'wb-list');
        component.items.forEach((item, index) => text(list, 'li', item, `${id}-item-${index}`));
        node.appendChild(list);
        return node;
      },
      table(component, path, id) {
        const node = element('section', 'wb-card');
        headingAndBody(component, node, id);
        if (!Array.isArray(component.columns) || !Array.isArray(component.rows)) throw new Error(`${path} requires columns and rows arrays`);
        const wrap = element('div', 'wb-table-wrap');
        const table = element('table', 'wb-table');
        const thead = element('thead');
        const header = element('tr');
        component.columns.forEach((column, index) => text(header, 'th', column, `${id}-column-${index}`));
        thead.appendChild(header);
        table.appendChild(thead);
        const tbody = element('tbody');
        component.rows.forEach((row, rowIndex) => {
          if (!Array.isArray(row) || row.length !== component.columns.length) throw new Error(`${path}.rows.${rowIndex} must have ${component.columns.length} cells`);
          const tr = element('tr');
          row.forEach((cell, columnIndex) => text(tr, 'td', cell, `${id}-row-${rowIndex}-cell-${columnIndex}`));
          tbody.appendChild(tr);
        });
        table.appendChild(tbody);
        wrap.appendChild(table);
        node.appendChild(wrap);
        return node;
      },
      timeline(component, path, id) {
        const node = element('section', 'wb-card');
        headingAndBody(component, node, id);
        if (!Array.isArray(component.items)) throw new Error(`${path}.items must be an array`);
        const list = element('ol', 'wb-timeline');
        component.items.forEach((item, index) => {
          const entry = element('li');
          text(entry, 'p', item.meta, `${id}-item-${index}-meta`, 'wb-meta');
          text(entry, 'h3', item.title, `${id}-item-${index}-title`);
          text(entry, 'p', item.body, `${id}-item-${index}-body`);
          list.appendChild(entry);
        });
        node.appendChild(list);
        return node;
      },
      note(component, path, id) {
        const tone = component.tone || 'info';
        if (!tones.has(tone)) throw new Error(`${path}.tone must be info, success, or warning`);
        const node = element('aside', `wb-note wb-note-${tone}`);
        headingAndBody(component, node, id);
        return node;
      }
    };

    function render(component, path) {
      const id = baseId(component, path);
      const renderer = renderers[component.type];
      if (!renderer) throw new Error(`Unknown component type at ${path}: ${component.type}`);
      return renderer(component, path, id);
    }

    try {
      const header = element('header', 'wb-document-header');
      text(header, 'h1', spec.title, 'wb-document-title');
      text(header, 'p', spec.subtitle, 'wb-document-subtitle');
      const stack = element('div', 'wb-stack');
      spec.components.forEach((component, index) => stack.appendChild(render(component, String(index))));
      root.replaceChildren(header, stack);
    } catch (error) {
      root.replaceChildren(anchor(element('p', 'wb-render-error', error.message), 'wb-render-error'));
      console.error(error);
    }
  })();
  </script>

<script id="wb-script">
(() => {
  'use strict';
  const byId = id => document.getElementById(id);
  const root = document.querySelector('[data-whiteboard-document]');
  const anchors = [...root.querySelectorAll('[data-whiteboard-anchor]')];
  const documentUrl = new URL(location.href);
  documentUrl.hash = '';
  const storageKey = 'whiteboard-html:' + documentUrl.href;
  const sourceFile = document.querySelector('meta[name="whiteboard-source"]').content;
  const skillFile = document.querySelector('meta[name="whiteboard-skill"]').content;
  const editor = byId('wb-editor');
  const floatBtn = byId('wb-float-btn');
  let annotations = [], active = -1, editing = -1, draft = null, picking = false, canPersist = true, copyTimer;
  const originalTabindex = new Map(anchors.map(el => [el, el.getAttribute('tabindex')]));
  const warnStorage = message => { byId('wb-storage-warning').textContent = message; };

  function wrapRange(range, id) {
    const mark = document.createElement('mark');
    mark.className = 'wb-mark';
    mark.dataset.wbId = id;
    mark.tabIndex = 0;
    mark.title = 'Click to view annotation';
    try {
      range.surroundContents(mark);
      return mark;
    } catch {
      const fragment = range.extractContents();
      mark.appendChild(fragment);
      range.insertNode(mark);
      return mark;
    }
  }

  function restoreHighlight(container, quote, id) {
    if (!container || !quote) return null;
    const text = container.textContent;
    const idx = text.indexOf(quote);
    if (idx === -1) return null;
    const walker = document.createTreeWalker(container, NodeFilter.SHOW_TEXT);
    let cur = 0, startNode = null, startOffset = 0, endNode = null, endOffset = 0, node;
    while ((node = walker.nextNode())) {
      const len = node.textContent.length;
      if (!startNode && cur + len > idx) {
        startNode = node;
        startOffset = idx - cur;
      }
      if (cur + len >= idx + quote.length) {
        endNode = node;
        endOffset = (idx + quote.length) - cur;
        break;
      }
      cur += len;
    }
    if (startNode && endNode) {
      const range = document.createRange();
      range.setStart(startNode, startOffset);
      range.setEnd(endNode, endOffset);
      return wrapRange(range, id);
    }
    return null;
  }

  function getContext(range, block) {
    const fullText = block.textContent.replace(/\s+/g, ' ');
    const selectedText = range.toString().trim();
    const idx = fullText.indexOf(selectedText);
    if (idx === -1) return { quote: selectedText, context: selectedText };
    const beforeStart = Math.max(0, idx - 45);
    const prefix = (beforeStart > 0 ? '…' : '') + fullText.slice(beforeStart, idx).trim();
    const afterEnd = Math.min(fullText.length, idx + selectedText.length + 45);
    const suffix = fullText.slice(idx + selectedText.length, afterEnd).trim() + (afterEnd < fullText.length ? '…' : '');
    const context = `${prefix} «${selectedText}» ${suffix}`.trim();
    return { quote: selectedText, context };
  }

  try {
    const saved = localStorage.getItem(storageKey);
    if (saved !== null) {
      const parsed = JSON.parse(saved);
      if (!Array.isArray(parsed) || !parsed.every(item => item && typeof item.anchor === 'string' && typeof item.quote === 'string' && typeof item.note === 'string' && item.anchor && item.note.trim())) throw new Error('Invalid drafts');
      annotations = parsed.map((item, i) => {
        const id = item.id || `wb-ann-${i + 1}-${Math.random().toString(36).slice(2, 7)}`;
        const container = document.getElementById(item.anchor);
        const isHighlight = item.isHighlight !== undefined
          ? Boolean(item.isHighlight)
          : Boolean(item.quote && container && item.quote.length < container.textContent.trim().length);
        return {
          id,
          anchor: item.anchor,
          quote: item.quote,
          context: item.context || item.quote,
          isHighlight,
          note: item.note
        };
      });
      for (const item of annotations) {
        if (item.isHighlight) {
          const container = document.getElementById(item.anchor);
          if (container) restoreHighlight(container, item.quote, item.id);
        }
      }
    }
  } catch {
    canPersist = false;
    warnStorage('Stored drafts could not be read. Existing storage is untouched. New comments stay in memory; Copy before closing.');
  }

  function persist() {
    if (!canPersist) return;
    try { localStorage.setItem(storageKey, JSON.stringify(annotations)); }
    catch { canPersist = false; warnStorage('Draft storage is unavailable. Comments stay in memory; Copy before closing.'); }
  }

  function updateCount() {
    const count = annotations.length;
    const label = `${count} annotation${count === 1 ? '' : 's'}${active < 0 ? '' : `, ${active + 1} of ${count}`}`;
    byId('wb-count').textContent = String(count);
    byId('wb-count').setAttribute('aria-label', label);
    byId('wb-count').title = label;
    for (const id of ['wb-prev', 'wb-next', 'wb-copy']) byId(id).disabled = count === 0;
  }

  function sourceUrl(anchor) {
    const url = new URL(documentUrl);
    url.hash = anchor;
    return url.href;
  }

  function setExpanded(value) {
    byId('wb-current-toggle').setAttribute('aria-expanded', String(value));
    byId('wb-current-body').hidden = !value;
  }

  function showAnnotation(index) {
    active = (index + annotations.length) % annotations.length;
    const item = annotations[active];
    root.querySelectorAll('.wb-highlight').forEach(el => el.classList.remove('wb-highlight'));
    root.querySelectorAll('.wb-mark-active').forEach(el => el.classList.remove('wb-mark-active'));

    const mark = root.querySelector(`.wb-mark[data-wb-id="${item.id}"]`);
    const target = document.getElementById(item.anchor);

    if (mark) {
      mark.classList.add('wb-mark-active');
      mark.scrollIntoView({block: 'center', behavior: 'smooth'});
      mark.focus({preventScroll: true});
      byId('wb-status').textContent = '';
    } else if (target && root.contains(target)) {
      target.classList.add('wb-highlight');
      target.scrollIntoView({block: 'start'});
      target.setAttribute('tabindex', '-1');
      target.focus({preventScroll: true});
      byId('wb-status').textContent = '';
    } else {
      byId('wb-status').textContent = `Source anchor #${item.anchor} is missing. Use the exported quote to locate it.`;
    }

    byId('wb-current-title').textContent = `Annotation ${active + 1} of ${annotations.length}`;
    byId('wb-current-source').textContent = '#' + item.anchor;
    byId('wb-current-source').href = sourceUrl(item.anchor);
    byId('wb-current-quote').textContent = item.quote;
    byId('wb-current-context').textContent = item.context && item.context !== item.quote ? `Context: ${item.context}` : '';
    byId('wb-current-context').hidden = !item.context || item.context === item.quote;
    byId('wb-current-note').textContent = item.note;
    byId('wb-current').hidden = false;
    setExpanded(false);
    updateCount();
  }

  function setPicking(value) {
    picking = value;
    root.classList.toggle('wb-picking', value);
    byId('wb-add').setAttribute('aria-pressed', String(value));
    for (const el of anchors) {
      const previous = originalTabindex.get(el);
      if (value) el.setAttribute('tabindex', '0');
      else if (previous === null) el.removeAttribute('tabindex');
      else el.setAttribute('tabindex', previous);
    }
    byId('wb-status').textContent = value ? 'Click a block, or Tab to a block and press Enter. Escape cancels.' : '';
    hideFloatingButton();
  }

  function hideFloatingButton() {
    floatBtn.style.display = 'none';
  }

  function updateFloatingButton() {
    if (picking || editor.open) { hideFloatingButton(); return; }
    const selection = window.getSelection();
    if (!selection || selection.isCollapsed || selection.rangeCount === 0) {
      hideFloatingButton();
      return;
    }
    const range = selection.getRangeAt(0);
    const start = range.startContainer.nodeType === Node.ELEMENT_NODE ? range.startContainer : range.startContainer.parentElement;
    const target = start.closest('[data-whiteboard-anchor]');
    if (!target || !root.contains(target) || !selection.toString().trim()) {
      hideFloatingButton();
      return;
    }
    const rect = range.getBoundingClientRect();
    if (rect.width === 0 && rect.height === 0) {
      hideFloatingButton();
      return;
    }
    floatBtn.style.display = 'flex';
    const left = Math.max(60, Math.min(window.innerWidth - 60, rect.left + rect.width / 2));
    const top = Math.max(rect.top, 50);
    floatBtn.style.left = `${left}px`;
    floatBtn.style.top = `${top}px`;
  }

  function openEditor(item, index = -1, liveRange = null) {
    setPicking(false);
    hideFloatingButton();
    editing = index;
    draft = {
      id: item.id || `wb-ann-${Date.now()}-${Math.random().toString(36).slice(2, 6)}`,
      anchor: item.anchor,
      quote: item.quote,
      context: item.context || item.quote,
      isHighlight: Boolean(item.isHighlight || liveRange),
      liveRange
    };
    byId('wb-editor-title').textContent = index < 0 ? (draft.isHighlight ? 'Add text annotation' : 'Add block annotation') : 'Edit annotation';
    byId('wb-target').textContent = `#${item.anchor}\n${item.quote}`;
    byId('wb-note').value = item.note || '';
    byId('wb-note').setCustomValidity('');
    window.getSelection().removeAllRanges();
    editor.showModal();
    byId('wb-note').focus();
  }

  floatBtn.addEventListener('click', () => {
    const selection = window.getSelection();
    if (selection && selection.rangeCount > 0 && !selection.isCollapsed) {
      const range = selection.getRangeAt(0).cloneRange();
      const start = range.startContainer.nodeType === Node.ELEMENT_NODE ? range.startContainer : range.startContainer.parentElement;
      const target = start.closest('[data-whiteboard-anchor]');
      if (target && root.contains(target) && selection.toString().trim()) {
        const { quote, context } = getContext(range, target);
        openEditor({ anchor: target.id, quote, context, isHighlight: true }, -1, range);
      }
    }
  });

  byId('wb-add').addEventListener('click', () => {
    const selection = window.getSelection();
    if (selection.rangeCount && !selection.isCollapsed) {
      const range = selection.getRangeAt(0).cloneRange();
      const start = range.startContainer.nodeType === Node.ELEMENT_NODE ? range.startContainer : range.startContainer.parentElement;
      const target = start.closest('[data-whiteboard-anchor]');
      if (target && root.contains(range.startContainer) && root.contains(range.endContainer) && selection.toString().trim()) {
        const { quote, context } = getContext(range, target);
        openEditor({ anchor: target.id, quote, context, isHighlight: true }, -1, range);
        return;
      }
    }
    setPicking(!picking);
  });

  function pickBlock(event) {
    const mark = event.target.closest('.wb-mark');
    if (mark && !picking) {
      const id = mark.dataset.wbId;
      const index = annotations.findIndex(a => a.id === id);
      if (index !== -1) {
        event.preventDefault();
        showAnnotation(index);
        return;
      }
    }
    if (!picking || (event.type === 'keydown' && event.key !== 'Enter' && event.key !== ' ')) return;
    const target = event.target.closest('[data-whiteboard-anchor]');
    if (!target || !root.contains(target)) return;
    event.preventDefault();
    event.stopPropagation();
    openEditor({ anchor: target.id, quote: target.textContent.trim(), context: target.textContent.trim(), isHighlight: false });
  }

  root.addEventListener('click', pickBlock);
  root.addEventListener('keydown', pickBlock);
  document.addEventListener('pointerup', () => setTimeout(updateFloatingButton, 10));
  document.addEventListener('keyup', e => { if (e.key !== 'Escape') setTimeout(updateFloatingButton, 10); });
  document.addEventListener('selectionchange', () => {
    const sel = window.getSelection();
    if (!sel || sel.isCollapsed) hideFloatingButton();
  });
  document.addEventListener('keydown', event => {
    if (event.key === 'Escape') {
      if (picking) setPicking(false);
      hideFloatingButton();
    }
  });

  byId('wb-note').addEventListener('input', () => byId('wb-note').setCustomValidity(''));
  byId('wb-form').addEventListener('submit', event => {
    event.preventDefault();
    const note = byId('wb-note').value.trim();
    if (!note) { byId('wb-note').setCustomValidity('Enter a comment.'); byId('wb-note').reportValidity(); return; }

    const item = {
      id: draft.id,
      anchor: draft.anchor,
      quote: draft.quote,
      context: draft.context,
      isHighlight: draft.isHighlight,
      note
    };

    if (editing < 0) {
      annotations.push(item);
      if (item.isHighlight) {
        if (draft.liveRange) {
          wrapRange(draft.liveRange, item.id);
        } else {
          const container = document.getElementById(item.anchor);
          if (container) restoreHighlight(container, item.quote, item.id);
        }
      }
    } else {
      annotations[editing] = item;
    }

    persist();
    editor.close();
    showAnnotation(editing < 0 ? annotations.length - 1 : editing);
  });

  byId('wb-cancel').addEventListener('click', () => editor.close());
  byId('wb-prev').addEventListener('click', () => showAnnotation(active < 0 ? annotations.length - 1 : active - 1));
  byId('wb-next').addEventListener('click', () => showAnnotation(active + 1));
  byId('wb-edit').addEventListener('click', () => openEditor(annotations[active], active));

  byId('wb-delete').addEventListener('click', () => {
    if (!confirm('Delete this annotation?')) return;
    const removed = annotations.splice(active, 1)[0];
    if (removed) {
      root.querySelectorAll(`.wb-mark[data-wb-id="${removed.id}"]`).forEach(m => m.replaceWith(...m.childNodes));
    }
    persist();
    if (annotations.length) showAnnotation(Math.min(active, annotations.length - 1));
    else {
      active = -1;
      byId('wb-current').hidden = true;
      root.querySelectorAll('.wb-highlight').forEach(el => el.classList.remove('wb-highlight'));
      updateCount();
    }
  });

  byId('wb-hide').addEventListener('click', () => { byId('wb-current').hidden = true; });
  byId('wb-current-toggle').addEventListener('click', () => {
    setExpanded(byId('wb-current-toggle').getAttribute('aria-expanded') !== 'true');
  });

  function resetCopyButton() {
    byId('wb-copy').classList.remove('wb-copied');
    byId('wb-copy').setAttribute('aria-label', 'Copy annotations');
    byId('wb-copy').title = 'Copy annotations';
    byId('wb-copy-icon').toggleAttribute('hidden', false);
    byId('wb-copy-check').toggleAttribute('hidden', true);
  }

  byId('wb-copy').addEventListener('click', async () => {
    const heading = `# Whiteboard HTML annotations\n\nRead skill://whiteboard-html before applying this feedback. If unavailable, read the Skill file below.\nSkill file: ${skillFile}\nDocument: ${sourceFile}\nURL: ${documentUrl.href}\nTitle: ${document.title}\nAnnotations: ${annotations.length}\n`;
    const body = annotations.map((item, index) => {
      const label = item.isHighlight ? 'Highlighted text' : 'Quoted text';
      let block = `\n## Annotation ${index + 1}\nAnchor: #${item.anchor}\nSource: ${sourceUrl(item.anchor)}\n${label}:\n${item.quote.split('\n').map(line => '> ' + line).join('\n')}\n`;
      if (item.context && item.context !== item.quote) {
        block += `Context:\n${item.context.split('\n').map(line => '> ' + line).join('\n')}\n`;
      }
      block += `Comment:\n${item.note}\n`;
      return block;
    }).join('');

    clearTimeout(copyTimer);
    resetCopyButton();
    const output = byId('wb-export-text');
    output.value = heading + body;
    try {
      await navigator.clipboard.writeText(output.value);
      byId('wb-copy').classList.add('wb-copied');
      byId('wb-copy').setAttribute('aria-label', 'Annotations copied to clipboard');
      byId('wb-copy').title = 'Annotations copied to clipboard';
      byId('wb-copy-icon').toggleAttribute('hidden', true);
      byId('wb-copy-check').toggleAttribute('hidden', false);
      byId('wb-status').textContent = 'Annotations copied to clipboard. Drafts are kept.';
      copyTimer = setTimeout(() => {
        resetCopyButton();
        byId('wb-status').textContent = '';
      }, 3000);
    } catch {
      byId('wb-copy-status').textContent = 'Clipboard blocked. Text is selected; press Ctrl+C or Cmd+C, then paste into your agent window.';
      byId('wb-export').showModal();
      output.focus();
      output.select();
    }
  });

  byId('wb-export-close').addEventListener('click', () => byId('wb-export').close());
  updateCount();
})();
</script>
