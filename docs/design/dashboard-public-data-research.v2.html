  <script id="whiteboard-data" type="application/json">{"title":"Public Dataset Research Prompts for the Dashboard Feature","subtitle":"Deep-research briefs for CrossFit, HYROX, track and field, and Olympic swimming — each scoped to the metrics the dashboard queries","components":[{"type":"hero","id":"hero-purpose","eyebrow":"Data sourcing for /dashboards","title":"Find public datasets that our dashboard widgets can actually query","body":"The dashboard feature renders live widgets from WQL queries over recorded facts. A demo dataset only works if it carries the right columns: a date to bucket by week, a duration, a load, a repetition count, a perceived effort, and a discipline tag. These briefs tell a research agent exactly what to find, what counts as a usable source, and what to hand back. Each lane is independent and can run in parallel."},{"type":"note","id":"note-ground-rules","title":"Ground rules that apply to every lane","body":"Primary sources only — the official API, the official results site, the dataset author's own page. No blog round-ups, no aggregator resellers, no paywalled summaries. Every claim about access, coverage, and licensing must be verified by fetching the source, and the finding must name the exact URL. Prefer machine-readable formats (CSV, JSON, Parquet) over PDFs. Where a license is unclear, say so explicitly rather than assuming permissive. Where a dataset carries personal data, note whether names can be dropped before ingestion.","tone":"info"},{"type":"section","id":"shared-contract","title":"0. The shared data contract","body":"Every lane answers the same question in the same shape, so the research is directly comparable and the output can be ingested without redesign.","components":[{"type":"table","id":"contract-table","title":"Target schema and the widget it unlocks","body":"Column names are suggestions — the agent should report what the source actually calls them and map them onto these roles.","columns":["Canonical metric key","Example value","Dashboard use"],"rows":[["date","2024-03-17","Buckets for by {week} and by {day} timeseries"],["session_id / athlete_id","hyrox-2024-rome-0042","Groups rows into one recorded session"],["elapsed (seconds)","3804","last:elapsed for benchmark boards"],["totalVolume (kg)","142.5","sum:totalVolume, sum:sessionLoad"],["totalReps","267","sum:totalReps"],["totalDistance (m)","8000","sum:totalDistance by {discipline}"],["session-rpe (0-10)","8","avg:session-rpe, avg:tis"],["sessionLoad (AU)","61.2","sum:sessionLoad by {intensity, week}"],["discipline","strength","Filters and by {discipline} bars"],["effort_or_event","fran","by {effort} toplist, benchmark filters"],["intensity","low | moderate | high","by {intensity} stacked bars"]]},{"type":"note","id":"note-vocabulary","title":"The vocabulary a lane must speak","body":"Disciplines are a fixed set — bodyweight, cycling, gymnastics, kettlebell, recovery, rowing, running, strength, swimming, walking — so a swimming lane maps to discipline:swimming and a HYROX lane splits across running, rowing, and strength. Intensity is a tier, not a number: low, moderate, high. Grouping dimensions on the aggregate plane are day, week, session, round plus tag keys; month and year exist only on the content plane. Calculated metrics (calc.acwr, calc.readiness, calc.adherence, calc.e1rm) derive from recorded facts, so a dataset without load, effort, and duration feeds almost none of them.","tone":"info"},{"type":"list","id":"contract-acceptance","title":"What a lane must return","items":["Source name, exact URL, and access method (public file, unauthenticated API, API key, or paid tier)","License, stated verbatim from the source, with the URL that states it","Row or record count and the covered date range","A real column list — the header row, not a description of it","A ten-row sample drawn from the real data","Coverage limits: what is missing, what is truncated, what is aggregated away","The exact query or endpoint that produced the sample, runnable as-is","A verdict: ingest as-is, ingest after transformation, or reference only"]}]},{"type":"section","id":"lane-crossfit","title":"1. Lane: CrossFit competition results","body":"The most self-contained lane — the leaderboard API is public and already returns per-athlete, per-workout structure.","components":[{"type":"cards","id":"crossfit-cards","columns":2,"items":[{"badge":"Primary lead","title":"Official Games leaderboard API","body":"c3po.crossfit.com/api/competitions/v2/competitions/open/{year}/leaderboards returns JSON with per-workout score arrays, workout breakdowns, rank, entrant demographics (age, height, weight, country, region, affiliate) and pagination totals. Verified live: the 2023 Open division 2 alone reports 132,782 competitors. The agent should map the URL shape for the Open, Quarterfinals, Semifinals, and Games stages, find the sibling endpoint that enumerates the workout events of a season, and confirm the rate limit."},{"badge":"Secondary","title":"Community mirrors and archives","body":"Kaggle mirrors of the CrossFit Games and Open, and GitHub scrapers that already cleaned a decade of Open data. These are useful for the historical backfill the live API will not serve. Verify license and freshness; treat scraped mirrors as research-grade, not authoritative."},{"badge":"Costed alternative","title":"Commercial CrossFit API","body":"crossfitapi.com sells the same shape as a supported product with a documented contract. Note its pricing and rate limits as the fallback if the public endpoints prove too fragile for a demo, but do not make it the primary answer."},{"badge":"Known gap","title":"Training-load fields do not exist","body":"Leaderboards carry competition scores and one-off workout results, not session loads, RPE, or periodised training. Be explicit in the findings: CrossFit data can populate benchmark and ranking widgets (last:elapsed by {effort}, toplists, timeseries of Open scores by year), and it cannot populate TIS, ACWR, or readiness without inventing data."}]}]},{"type":"section","id":"lane-hyrox","title":"2. Lane: HYROX race results and station splits","body":"HYROX is the closest public analogue to what this app records: a timed endurance event with a station-plus-run structure that maps cleanly onto segments.","components":[{"type":"cards","id":"hyrox-cards","columns":2,"items":[{"badge":"Primary lead","title":"Pyrox published results dataset","body":"The pyrox-client project publishes HYROX results as Parquet on a CDN: 1,235,605 result rows, 316 races, 134 locations, seasons 1 through 9 covering 2018 to 2026, about 105 MB compressed. Schema is documented: identity columns (name, gender, division, age_group, nationality, event_id, event_name), totals (total_time, work_time, run_time, roxzone_time, all in float minutes), eight station columns (skiErg, sledPush, sledPull, burpeeBroadJump, rowErg, farmersCarry, sandbagLunges, wallBalls) and eight run legs (run1_time through run8_time). Divisions are open, pro, doubles, pro_doubles, relay, adaptive, elite, elite_doubles. The agent should confirm the manifest URL, the refresh cadence, and whether the CDN requires attribution."},{"badge":"Commercial alternative","title":"Hyrox Results API","body":"A versioned REST API with a public OpenAPI 3.1 spec, bearer-token auth, and seasonal, event, division, athlete, split, statistics, and simulator-benchmark endpoints. The public routes are health and the spec itself; everything else needs a token and an active subscription. Record the plan tiers and rate limits exactly as the pricing page states them."},{"badge":"Mirror","title":"Kaggle HYROX split archive","body":"A Kaggle dataset claiming complete HYROX results with split times for 2017 through 2026. Verify the actual row count, the column list, and the license, and check it against the Pyrox coverage numbers for agreement rather than trusting the description."},{"badge":"Mapping note","title":"Why this lane fits the dashboard","body":"Each result row is one session with a date, a total duration, a work duration, eight station durations, and eight run durations — enough for sum:totalDistance style duration widgets, by {discipline} splits between machine work and running, by {week} timeseries across a season, and by {effort} rankings across stations. What it cannot supply is load in kilograms, reps, or RPE; the agent must say which widgets therefore stay unavailable."}]}]},{"type":"section","id":"lane-athletics","title":"3. Lane: Track and field results","body":"The lane with the widest coverage and the worst licensing story — the official database is the richest and the least openly licensed.","components":[{"type":"cards","id":"athletics-cards","columns":2,"items":[{"badge":"Official","title":"World Athletics records and toplists","body":"worldathletics.org exposes records, area records, annual leading lists, and world rankings. Results are rendered client-side, so the agent should find the underlying JSON or CSV endpoint rather than scraping the HTML, and confirm whether a World Athletics data label or a federation agreement is required for anything beyond casual browsing."},{"badge":"Open licence, best case","title":"AthTech Challenge dataset (Rome 2024)","body":"The openath/trhackathon2025 repository is Apache-2.0 and holds full results for every heat, semi-final and final of the 2024 European Championships — reaction times, every jump and throw — plus per-athlete profiles with racing history up to June 2024, and IsoLynx tracking sampled at 0.1 second intervals with position and acceleration. This is the highest-quality openly licensed athletics data found; the agent should verify file formats and sizes and confirm the tracking licence with the IsoLynx provider."},{"badge":"Aggregation source","title":"Tilastopaja and its consumers","body":"Tilastopaja is the deep results database that other providers build on. Establish whether any part is freely downloadable, what the commercial terms are, and whether the openathletics forum has published a reusable dump."},{"badge":"Event archive","title":"Olympic results books","body":"The Olympic World Library holds official Paris 2024 results books as PDFs. They are authoritative but parse-unfriendly; the agent should report whether a structured equivalent exists for the same results, and note that PDF extraction is a last resort."}]}]},{"type":"section","id":"lane-swimming","title":"4. Lane: Olympic swimming results and training load","body":"Two distinct problems in one lane: competition results are plentiful and machine-readable, while session-level training load — the thing the dashboard actually models — is scarce and mostly locked in journal papers.","components":[{"type":"cards","id":"swimming-cards","columns":2,"items":[{"badge":"Primary lead","title":"World Aquatics rankings CSV","body":"api.worldaquatics.com exposes a CSV ranking report per event — distance, stroke, gender, pool configuration, and a times mode — returning meet name, swim time, date, description, team and country, athlete name, gender, birth date, FINA points, meet city, and country code. Verified live for the men's 50m freestyle long-course list. The agent should enumerate the full parameter space and confirm whether the endpoint is rate-limited or undocumented-but-stable, and whether it has a stable contract."},{"badge":"Open licence","title":"Olympic results CSV mirrors","body":"Community repositories publish Tokyo 2020 and Paris 2024 swimming results as CSV with columns for Olympics, distance, stroke, relay flag, gender, result, and rank. License and provenance must be verified per repository — an unlabelled mirror is not an open dataset. Mendeley and Figshare hold CC-licensed academic deposits with the same result and training data shapes."},{"badge":"Training load — the hard one","title":"Session-level swimmer monitoring data","body":"The Mendeley deposit 10.17632/j4bwjsyggc.1 (CC BY 4.0) monitors nineteen adolescent swimmers over twelve weeks with per-session training load, weekly swim performance (100m front crawl time, stroke count, velocity, stroke frequency, distance per stroke), functional tests, and weekly wellness perceptions — well-being, heaviness, tiredness, discomfort, pain — plus a recovery model. Small and youth-focused, but it is the closest openly licensed thing to a real training journal. The agent should search Mendeley, Figshare, Zenodo, Dryad, and OSF for larger equivalents with per-session load and RPE, and report cohort size, duration, and license for each."},{"badge":"Known gap","title":"Session RPE datasets sit behind papers","body":"Most elite-swimmer training-load data lives in journal articles as summary statistics, not as row-level releases. The agent must state this plainly rather than pointing at an abstract, and must check whether any paper has a linked supplementary data deposit."}]}]},{"type":"section","id":"synthesis","title":"5. Synthesis and the demo shortlist","body":"After the four lanes report, one pass ranks the candidates and proposes the demo dataset.","components":[{"type":"list","id":"synthesis-steps","ordered":true,"items":["Collect every candidate into one comparison table: source, license, row count, date range, format, access friction, and which dashboard widgets it can feed.","Score each candidate on three axes: license clarity, schema fit against the shared contract, and ingest effort.","Pick one primary dataset per lane, plus a single fallback where the primary is fragile.","State plainly which widgets each choice lights up and which stay dark — an honest gap list beats a demo that quietly fabricates values.","Propose the ingestion path: file download, scheduled fetch, or a one-off conversion script, and where the converted file should live in this repo. The existing sample generator at apps/playground/src/services/analytics/sample.ts emits exactly this shape — elapsed, totalReps, tis, totalVolume, totalDistance, sessionLoad per session, tagged with effort, discipline, and intensity — so it is the reference for what a converted file must look like.","Flag every field that is a proxy rather than a measurement, so nothing in the demo is mistaken for real training load."]},{"type":"note","id":"note-scope","title":"Scope boundary","body":"This pass finds and characterises datasets. It does not download bulk data, write ingestion code, or modify the app. A dataset is only useful if the app can query it, so the deliverable ends with a concrete shortlist and a recommended first ingestion — the build of that comes next.","tone":"warning"}]}]}</script>
  <script id="whiteboard-renderer">
  (() => {
    'use strict';
    const root = document.getElementById('whiteboard');
    const spec = JSON.parse(document.getElementById('whiteboard-data').textContent);
    const usedIds = new Set(['whiteboard']);
    const tones = new Set(['info', 'success', 'warning']);

    function element(tag, className, value) {

      copyTimer = setTimeout(() => {
        resetCopyButton();
        byId('wb-status').textContent = '';
      }, 3000);
    } catch {
      byId('wb-copy-status').textContent = 'Clipboard blocked. Text is selected; press Ctrl+C or Cmd+C, then paste into your agent window.';
      byId('wb-export').showModal();
      output.focus();
      output.select();
    }
  });

  byId('wb-export-close').addEventListener('click', () => byId('wb-export').close());
  updateCount();
})();
</script>
