  <script id="whiteboard-data" type="application/json">{"title":"WQL Composer Reimagined: Coach & Athlete Workflow from Library Lists to Multi-Series Charts","subtitle":"Architectural review, gap analysis of the current WqlComposer, and a stage-progressive composer model supporting list discovery, one-click chart promotion, reference overlays, and reusable bindings","components":[{"type":"hero","id":"hero-vision","eyebrow":"Concept & UX Architecture Review · Interactive Prototype Attached","title":"Start with a List of Notes. Promote to a Metric. Layer Reference Baselines.","body":"The WQL engine now supports left-to-right pipelines (:source | :reducer | :chart), named bindings (bench = ...), scalar reference broadcasting (goal = 100), and multi-series overlays (show a, b | :timeseries{}). However, the current WqlComposer UI only renders structured pills for single-stage queries—bailing out to raw text as soon as a pipe (|) or binding (=) appears. This review defines a progressive, coach- and athlete-first composer experience alongside an interactive prototype (wql-composer-coach-workflow.prototype.html)."},{"type":"note","id":"prototype-callout","tone":"success","title":"Interactive Visual Prototype: wql-composer-coach-workflow.prototype.html","body":"Open docs/design/wql-composer-coach-workflow.prototype.html to test all four interactive workflows live: (1) Library List Mode for note discovery, (2) Clone & Promote List to Aggregate/Chart, (3) Reference Points & Secondary Data Overlays (Goals, Rolling Averages, Readiness vs. Volume), and (4) Coach & Athlete Preset Scenarios with live SVG chart rendering and synchronized WQL document output."},{"type":"metrics","id":"composer-gap-metrics","title":"Current WqlComposer vs. WQL Engine Capabilities","body":"Why the current composer feels clunky when moving from library filtering to analytics and dashboard creation.","items":[{"value":"0%","label":"Pipeline Pill Coverage Today","detail":"astToPills(ast) returns null when isPipelineQuery(ast) is true"},{"value":"3 Modes","label":"Progressive Composer Tiers","detail":"1. Library List  2. Chart Pipeline  3. Multi-Series / Reference Overlay"},{"value":"1-Click","label":"List-to-Chart Promotion","detail":"Clone active :note / :journal filters into | :sum{metric} | :chart{}"},{"value":"+ Layer","label":"Reference & Secondary Data","detail":"Add PR lines, target goals, rolling baselines, or secondary metrics without hand-typing bindings"}]},{"type":"section","id":"diagnosis","title":"1. Why the Current WQL Composer Feels Clunky","body":"Inspecting packages/ui/src/composer/WqlComposer.tsx and queryAst.ts reveals five concrete friction points between what the WQL engine can execute and what the visual composer allows.","components":[{"type":"table","id":"clunkiness-audit","title":"Technical & UX Friction Audit in Current Branch","body":"Root causes in the current implementation and how they affect library search and dashboard authoring.","columns":["Friction Point","Current Behavior in Code","Why It Hurts Coaches & Athletes","Proposed Composer Solution"],"rows":[["1. Library pages expose analytics noise","WqlLibrarySearchPage mounts WqlComposer with Kind (Find vs Measure) and 10 Target planes (:segment, :event, :tag), then warns 'This page runs find queries only' if changed.","When searching workouts or notes in the Library, users just want to filter their list by movement, equipment, tag, notebook, or date—not wrestle with AST family pivots.","Scoped Library Mode: Lock the head to the library's plane (:note, :journal, :notebook) by default, show fast facet chips (+ Effort, + Tag, + Equipment, + Window), and offer a 'Summarize / Chart This List →' promotion button."],["2. Destructive Kind/Target pivot instead of progressive piping","pivotQuery() in queryAst.ts switches family from 'find' to 'aggregate', stripping incompatible clauses with a confirmation alert dialog and rewriting to legacy sum:tis{}.","Coaches don't think in 'AST family pivots'. They find a list of workouts first (e.g., 14 Back Squat notes), verify the list looks right, and then want to aggregate or chart that exact list.","Non-destructive Stage Promotion: Keep Stage 1 (the list filter) intact and append Stage 2 (| :sum{metric:totalVolume} by {week}) and Stage 3 (| :timeseries{}) as visual pipeline cards."],["3. Complete bailout on pipelines (|)","queryAst.ts line 61: if (isPipelineQuery(ast)) return null. The guided pill bar disappears and tells the user 'Use Edit WQL to preserve every clause.'","The canonical WQL grammar for charts is a pipeline (:segment{...} | :max{metric:calc.e1rm} | :timeseries{}). Losing guided controls the moment a chart or reducer is added defeats the composer.","Stage-Aware Visual Rail: Render each pipe stage as a distinct visual lane: [1. Filter List] → [2. Calculate Metric] → [3. Choose Visual]. Clicking any chip in any stage opens the shared contextual value picker."],["4. No UI for multi-line Query Documents or bindings","parseDocument() supports defaults, named variables (bench = ...), math (a + b), and show a, b | :chart{}, but WqlComposer only parses single-line queries.","Adding a target line (Goal: 140kg), comparing Kettlebell vs. Barbell volume, or overlaying Readiness on Training Load requires hand-coding multi-line WQL syntax.","Visual Layer & Reference Builder: Let users click '+ Add Reference Line' (Target/PR/Threshold or 4w Rolling Avg) or '+ Compare Series' (clone base query with a swapped filter or secondary metric); the composer compiles the multi-line WQL document automatically."],["5. Cryptic canonical metric & dimension keys","METRIC_OPTIONS lists raw identifiers like tis, calc.e1rm, calc.acwr, calc.mvcBw, totalVolume without units, categories, or coaching explanations.","Athletes and coaches think in 'Time in Score / Work Time', 'Estimated 1RM (Strength)', 'Acute:Chronic Workload Ratio', and 'Session Tonnage'—not raw camelCase keys.","Domain-Grouped Metric Picker: Group metrics by coaching intent (Strength & Load, Volume & Work, Pacing & Power, Readiness & Recovery) with human labels, units, and recommended default aggregators."]]}]},{"type":"section","id":"coach-athlete-mental-model","title":"2. Coach & Athlete Data Workflow: How Training Questions Evolve","body":"Neither coaches nor athletes wake up wanting to write a query AST. They start by inspecting recent training logs, spot a pattern or question, turn that filtered list into a trend, and add context (a goal, a historical baseline, or a secondary wellness metric) to make a training decision.","components":[{"type":"timeline","id":"four-step-training-workflow","title":"The 4-Step Progressive Authoring Flow","body":"One unified composer supports the entire journey by progressively revealing stages only when needed.","items":[{"meta":"Stage 1 · Curate the List (Library & Stream Pages)","title":"\"Show me all my heavy Squat or Benchmark notes from the last 12 weeks\"","body":"The user starts in Library / Journal mode. The composer is a clean single-row filter bar scoped to notes or sessions (:journal{effort:back-squat, quality:strength} last 12w). Live stage counts confirm '18 notes matched' and the list below updates immediately so the athlete can trust the underlying data."},{"meta":"Stage 2 · Clone / Promote List into an Aggregate & Chart","title":"\"Chart my Estimated 1RM or Weekly Tonnage from this exact list\"","body":"Clicking 'Chart This List' (or 'Clone to Widget') keeps Stage 1's filters locked in as the data source and opens Stage 2 (Measure: Max Estimated 1RM · calc.e1rm, Group by: Week) and Stage 3 (Visual: Timeseries Line). The user never loses their filter pills or has to re-enter movement tags."},{"meta":"Stage 3 · Add Reference Points (Goals, PRs, & Baselines)","title":"\"Include my 150kg cycle target and my 4-week rolling average for context\"","body":"A chart without a reference point is hard to interpret. In the composer's '+ Reference / Overlay' tray, the coach adds a Constant Target (goal = 150), a Historical Baseline (e.g., 12-week average or all-time PR scalar broadcast across buckets), or a Rolling Smoothing window (.rollup(4w)). Under the hood, WQL compiles scalar-to-series broadcast bindings and `show primary, goal | :timeseries{}`."},{"meta":"Stage 4 · Overlay Secondary Data (Split Comparison or Dual Metric)","title":"\"Compare Barbell vs. Kettlebell volume, or overlay Sleep/Readiness against Strain\"","body":"To understand *why* a metric moved, the user clicks '+ Secondary Series'. They can either (A) Clone & Split the current series by changing one filter pill (e.g., Serie A = equipment:barbell, Series B = equipment:kettlebell) or (B) Add a Secondary Metric over the same time window (e.g., Series A = sum:sessionLoad, Series B = avg:calc.readiness). Both series remain editable via guided pills."}]},{"type":"cards","id":"persona-questions","title":"Supported Data & Real Coaching Scenarios","body":"How WQL's data planes (:journal, :segment, :session, calc.*) map to everyday athlete and coach questions.","columns":2,"items":[{"badge":"Athlete · Strength Progression","title":"1RM Trend + Cycle Goal + Volume Context","body":"Starts from :segment{effort:back-squat} last 12w. Promotes to max:calc.e1rm by {week}. Adds a 145kg cycle goal reference line and a secondary bar series for weekly rep volume (:sum{metric:reps}) to see how volume tapering drives peak strength."},{"badge":"Coach · Workload & Injury Prevention","title":"Weekly Strain vs. Readiness & ACWR Danger Zone","body":"Starts from :session{} last 8w. Plots sum:sessionLoad by {week} alongside avg:calc.readiness and a constant ACWR threshold ceiling (1.3x optimal cap), immediately highlighting weeks where high training load coincided with poor recovery."},{"badge":"Athlete · Benchmark & Metcon Pacing","title":"Benchmark Note List → Time-in-Score (TIS) & Format Breakdown","body":"Starts in the Library filtering :journal{intent:benchmark, format:for-time}. Reviews the 9 matching workout notes, then clones the list into a chart comparing Fran/Grace/Helen completion times or work density by movement domain."},{"badge":"Coach · Programming Audit","title":"Movement & Equipment Balance Across a Training Block","body":"Starts with :notebook{notebook:comp-prep} last 4w. Clones into a stacked bar chart (:sum{metric:reps} by {discipline, week} | :stacked-bar{}) with a secondary split comparing Gymnastics vs. Weightlifting exposure."}]}]},{"type":"section","id":"composer-architecture","title":"3. The Adaptive 3-Tier Composer Architecture","body":"Instead of forcing a single flat pill strip to represent everything—or bailing out to raw code—the composer adapts its chrome to three progressive complexity tiers while keeping the live WQL code bar synchronized at all times.","components":[{"type":"cards","id":"three-tiers-cards","title":"One Component, Three Context-Aware Modes","columns":3,"items":[{"badge":"Tier 1 · Library Filter Bar","title":"Focused List Discovery (:note, :journal, :effort)","body":"Used on Library, Notebook, and Stream pages. Hides analytics clutter (aggregators, metrics, rollups, chart sinks). Shows the scoped source badge, active filter pills, a quick '+ Filter' palette (Effort, Tag, Equipment, Format, Date Window, Text), match counts, and a prominent 'Analyze / Chart List →' action."},{"badge":"Tier 2 · Pipeline Stage Rail","title":"Source List → Metric Reducer → Chart Sink","body":"Activated when promoting a list or editing a single-series widget. Displays three connected stage cards: [Stage 1: Filter List] | [Stage 2: Aggregate & Bucket] | [Stage 3: Chart & Units]. Each stage has its own focused pills so astToPills() works per-stage on ParsedPipelineQuery."},{"badge":"Tier 3 · Multi-Layer & Reference Studio","title":"Primary Series + Reference Lines + Cloned Overlays","body":"Activated when a user clicks '+ Add Reference' or '+ Compare Series' (or when parsing a multi-line Query Document). Renders a Shared Window/Grouping header (`defaults by {week} last 12w`), a card for the Primary Series, compact cards for Reference/Secondary layers, and the shared Chart Sink."}]},{"type":"table","id":"reference-and-secondary-patterns","title":"How Visual Layers Compile Cleanly to WQL Query Documents","body":"Every visual action in Tier 3 maps 1:1 to deterministic, lossless WQL syntax already supported by SharedQueryDocumentRunner.","columns":["Coach / Athlete Intent","Composer UI Control","Compiled WQL Representation","Visual Rendering on Chart"],"rows":[["Constant Goal / PR Line","+ Reference → Target / PR Value (e.g., 140 kg)","goal = 140\nshow primary, goal | :timeseries{unit:kg}","Horizontal dashed reference line broadcast across all time buckets with a 'Goal: 140 kg' badge."],["Rolling Baseline / Trend Smoothing","+ Reference → Rolling Baseline (2w / 4w rollup)","baseline = base | :avg{metric:calc.e1rm}.rollup(4w)\nshow primary, baseline | :timeseries{}","Smooth secondary trend line behind weekly bars or points to separate signal from week-to-week noise."],["Clone & Modify Filter (Split Comparison)","Click 'Clone Series' on Primary → change equipment:barbell to equipment:kettlebell","base = :segment{} last 12w\nbarbell = base | :sum{metric:totalVolume, equipment:barbell}\nkettlebell = base | :sum{metric:totalVolume, equipment:kettlebell}\nshow barbell, kettlebell | :stacked-bar{}","Multi-series grouped or stacked chart sharing the exact base time window and bucket dimensions."],["Secondary Metric Overlay","+ Secondary Data → Pick second metric (e.g., Readiness vs. Session Load)","defaults by {week} last 8w\nload = :session{} | :sum{metric:sessionLoad}\nreadiness = :session{} | :avg{metric:calc.readiness}\nshow load, readiness | :timeseries{}","Dual-series chart comparing training input (load/volume) against athlete response (readiness/HRV/soreness)."],["Derived Ratio / Formula","+ Reference → Formula between Series A & B (A / B or A + B)","total = barbell + kettlebell\nshow barbell, kettlebell, total | :timeseries{}","Computed composite curve plotted over the constituent series."]]},{"type":"note","id":"lossless-ast-note","tone":"info","title":"How to Fix astToPills() Without Breaking Lossless Round-Tripping","body":"Instead of returning null for ParsedPipelineQuery, introduce astToStagePills(ast) which returns { sourcePills, transformPills[], sinkPills }. Because each stage of a ParsedPipelineQuery is itself a ParsedFindQuery, ParsedAggregateQuery, or PipelineSink, existing pill editors (InlineClauseEditor, date pickers, tag typeaheads) work unchanged inside each stage!"}]},{"type":"section","id":"implementation-roadmap","title":"4. Concrete Implementation Plan for packages/ui & packages/wql","body":"How we can ship this incrementally in the codebase with clean seams.","components":[{"type":"list","id":"roadmap-steps","title":"Step-by-Step Upgrade Path","ordered":true,"items":["Decompose Pipelines into Stage Pills (packages/ui/src/composer/queryAst.ts): Replace the `if (isPipelineQuery(ast)) return null` bailout with stage-level pill extraction (`source`, `transforms[]`, `sink`) so pipelines remain 100% guided.","Add `mode=\"library\" | \"full\"` and `onPromoteToChart` to WqlComposer: In Library pages, default to a streamlined filter bar for the active target (`:note` / `:journal`) with a one-click 'Chart This List' button that wraps the current find query into a pipeline (`\u003clist> | :count{} by {week} | :bar{}`).","Humanize the Metric & Reducer Catalog (packages/ui/src/composer/queryClauses.ts): Enrich METRIC_OPTIONS and AGG_OPTIONS with coaching categories (Strength, Volume, Pacing, Recovery), human labels ('Estimated 1RM' for `calc.e1rm`, 'Time in Score' for `tis`), and smart default aggregators.","Add the Layer & Reference Tray for Multi-Series Query Documents: Allow users to add a Constant Target (`goal = 150`), Rolling Baseline (`.rollup(4w)`), or Cloned Comparison Series via UI cards that serialize to and parse from canonical multi-line WQL documents (`defaults ...`, `a = ...`, `show a, b | :chart{}`).","Embed Live Mini-Preview & Stage Funnel Counts: Show row/bucket counts at each pipe boundary (`128 notes → 19 matched → 8 weekly buckets`) so coaches immediately see if a filter or join zeroed out their chart."]}]}]}</script>
  <script id="whiteboard-renderer">
  (() => {
    'use strict';
    const root = document.getElementById('whiteboard');
    const spec = JSON.parse(document.getElementById('whiteboard-data').textContent);
    const usedIds = new Set(['whiteboard']);
    const tones = new Set(['info', 'success', 'warning']);

    function element(tag, className, value) {
      const node = document.createElement(tag);
      if (className) node.className = className;
      if (value !== undefined && value !== null) node.textContent = String(value);
      return node;
    }

    function anchor(node, id) {
      if (usedIds.has(id)) throw new Error(`Duplicate whiteboard id: ${id}`);
      usedIds.add(id);
      node.id = id;
      node.dataset.whiteboardAnchor = '';
      return node;
    }

    function text(parent, tag, value, id, className = '') {
      if (value === undefined || value === null || value === '') return null;
      const node = anchor(element(tag, className, value), id);
      parent.appendChild(node);
      return node;
    }

    function baseId(component, path) {
      if (!component || Array.isArray(component) || typeof component !== 'object') throw new Error(`Component ${path} must be an object`);
      if (component.id !== undefined && !/^[A-Za-z][A-Za-z0-9_-]*$/.test(component.id)) throw new Error(`Invalid component id at ${path}`);
      return component.id ? `wb-${component.id}` : `wb-c-${path.replace(/\./g, '-')}`;
    }

    function headingAndBody(component, node, id) {
      text(node, 'h2', component.title, `${id}-title`);
      text(node, 'p', component.body, `${id}-body`);
    }

    const renderers = {
      hero(component, path, id) {
        const node = element('section', 'wb-hero');
        text(node, 'p', component.eyebrow, `${id}-eyebrow`, 'wb-eyebrow');
        text(node, 'h2', component.title, `${id}-title`);
        text(node, 'p', component.body, `${id}-body`);
        return node;
      },
      section(component, path, id) {
        const node = element('section', 'wb-card wb-stack');
        headingAndBody(component, node, id);
        if (!Array.isArray(component.components)) throw new Error(`${path}.components must be an array`);
        component.components.forEach((child, index) => node.appendChild(render(child, `${path}.${index}`)));
        return node;
      },
      cards(component, path, id) {
        const node = element('section', 'wb-card');
        headingAndBody(component, node, id);
        const grid = element('div', 'wb-grid');
        const columns = component.columns === undefined ? 'auto-fit' : component.columns;
        if (columns !== 'auto-fit' && (!Number.isInteger(columns) || columns < 1 || columns > 4)) throw new Error(`${path}.columns must be auto-fit or an integer from 1 to 4`);
        grid.style.setProperty('--wb-columns', columns);
        if (!Array.isArray(component.items)) throw new Error(`${path}.items must be an array`);
        component.items.forEach((item, index) => {
          const card = element('article');
          text(card, 'span', item.badge, `${id}-item-${index}-badge`, 'wb-badge');
          text(card, 'h3', item.title, `${id}-item-${index}-title`);
          text(card, 'p', item.body, `${id}-item-${index}-body`);
          grid.appendChild(card);
        });
        node.appendChild(grid);
        return node;
      },
      metrics(component, path, id) {
        const node = element('section', 'wb-card');
        headingAndBody(component, node, id);
        const grid = element('div', 'wb-grid wb-metrics');
        if (!Array.isArray(component.items)) throw new Error(`${path}.items must be an array`);
        component.items.forEach((item, index) => {
          const pair = element('dl');
          text(pair, 'dd', item.value, `${id}-item-${index}-value`);
          text(pair, 'dt', item.label, `${id}-item-${index}-label`);
          text(pair, 'p', item.detail, `${id}-item-${index}-detail`);
          grid.appendChild(pair);
        });
        node.appendChild(grid);
        return node;
      },
      list(component, path, id) {
        const node = element('section', 'wb-card');
        headingAndBody(component, node, id);
        if (!Array.isArray(component.items)) throw new Error(`${path}.items must be an array`);
        const list = element(component.ordered ? 'ol' : 'ul', 'wb-list');
        component.items.forEach((item, index) => text(list, 'li', item, `${id}-item-${index}`));
        node.appendChild(list);
        return node;
      },
      table(component, path, id) {
        const node = element('section', 'wb-card');
        headingAndBody(component, node, id);
        if (!Array.isArray(component.columns) || !Array.isArray(component.rows)) throw new Error(`${path} requires columns and rows arrays`);
        const wrap = element('div', 'wb-table-wrap');
        const table = element('table', 'wb-table');
        const thead = element('thead');
        const header = element('tr');
        component.columns.forEach((column, index) => text(header, 'th', column, `${id}-column-${index}`));
        thead.appendChild(header);
        table.appendChild(thead);
        const tbody = element('tbody');
        component.rows.forEach((row, rowIndex) => {
          if (!Array.isArray(row) || row.length !== component.columns.length) throw new Error(`${path}.rows.${rowIndex} must have ${component.columns.length} cells`);
          const tr = element('tr');
          row.forEach((cell, columnIndex) => text(tr, 'td', cell, `${id}-row-${rowIndex}-cell-${columnIndex}`));
          tbody.appendChild(tr);
        });
        table.appendChild(tbody);
        wrap.appendChild(table);
        node.appendChild(wrap);
        return node;
      },
      timeline(component, path, id) {
        const node = element('section', 'wb-card');
        headingAndBody(component, node, id);
        if (!Array.isArray(component.items)) throw new Error(`${path}.items must be an array`);
        const list = element('ol', 'wb-timeline');
        component.items.forEach((item, index) => {
          const entry = element('li');
          text(entry, 'p', item.meta, `${id}-item-${index}-meta`, 'wb-meta');
          text(entry, 'h3', item.title, `${id}-item-${index}-title`);
          text(entry, 'p', item.body, `${id}-item-${index}-body`);
          list.appendChild(entry);
        });
        node.appendChild(list);
        return node;
      },
      note(component, path, id) {
        const tone = component.tone || 'info';
        if (!tones.has(tone)) throw new Error(`${path}.tone must be info, success, or warning`);
        const node = element('aside', `wb-note wb-note-${tone}`);
        headingAndBody(component, node, id);
        return node;
      }
    };

    function render(component, path) {
      const id = baseId(component, path);
      const renderer = renderers[component.type];
      if (!renderer) throw new Error(`Unknown component type at ${path}: ${component.type}`);
      return renderer(component, path, id);
    }

    try {
      const header = element('header', 'wb-document-header');
      text(header, 'h1', spec.title, 'wb-document-title');
      text(header, 'p', spec.subtitle, 'wb-document-subtitle');
      const stack = element('div', 'wb-stack');
      spec.components.forEach((component, index) => stack.appendChild(render(component, String(index))));
      root.replaceChildren(header, stack);
    } catch (error) {
      root.replaceChildren(anchor(element('p', 'wb-render-error', error.message), 'wb-render-error'));
      console.error(error);
    }
  })();
  </script>

<script id="wb-script">
(() => {
  'use strict';
  const byId = id => document.getElementById(id);
  const root = document.querySelector('[data-whiteboard-document]');
  const anchors = [...root.querySelectorAll('[data-whiteboard-anchor]')];
  const documentUrl = new URL(location.href);
  documentUrl.hash = '';
  const storageKey = 'whiteboard-html:' + documentUrl.href;
  const sourceFile = document.querySelector('meta[name="whiteboard-source"]').content;
  const skillFile = document.querySelector('meta[name="whiteboard-skill"]').content;
  const editor = byId('wb-editor');
  const floatBtn = byId('wb-float-btn');
  let annotations = [], active = -1, editing = -1, draft = null, picking = false, canPersist = true, copyTimer;
  const originalTabindex = new Map(anchors.map(el => [el, el.getAttribute('tabindex')]));
  const warnStorage = message => { byId('wb-storage-warning').textContent = message; };

  function wrapRange(range, id) {
    const mark = document.createElement('mark');
    mark.className = 'wb-mark';
    mark.dataset.wbId = id;
    mark.tabIndex = 0;
    mark.title = 'Click to view annotation';
    try {
      range.surroundContents(mark);
      return mark;
    } catch {
      const fragment = range.extractContents();
      mark.appendChild(fragment);
      range.insertNode(mark);
      return mark;
    }
  }

  function restoreHighlight(container, quote, id) {
    if (!container || !quote) return null;
    const text = container.textContent;
    const idx = text.indexOf(quote);
    if (idx === -1) return null;
    const walker = document.createTreeWalker(container, NodeFilter.SHOW_TEXT);
    let cur = 0, startNode = null, startOffset = 0, endNode = null, endOffset = 0, node;
    while ((node = walker.nextNode())) {
      const len = node.textContent.length;
      if (!startNode && cur + len > idx) {
        startNode = node;
        startOffset = idx - cur;
      }
      if (cur + len >= idx + quote.length) {
        endNode = node;
        endOffset = (idx + quote.length) - cur;
        break;
      }
      cur += len;
    }
    if (startNode && endNode) {
      const range = document.createRange();
      range.setStart(startNode, startOffset);
      range.setEnd(endNode, endOffset);
      return wrapRange(range, id);
    }
    return null;
  }

  function getContext(range, block) {
    const fullText = block.textContent.replace(/\s+/g, ' ');
    const selectedText = range.toString().trim();
    const idx = fullText.indexOf(selectedText);
    if (idx === -1) return { quote: selectedText, context: selectedText };
    const beforeStart = Math.max(0, idx - 45);
    const prefix = (beforeStart > 0 ? '…' : '') + fullText.slice(beforeStart, idx).trim();
    const afterEnd = Math.min(fullText.length, idx + selectedText.length + 45);
    const suffix = fullText.slice(idx + selectedText.length, afterEnd).trim() + (afterEnd < fullText.length ? '…' : '');
    const context = `${prefix} «${selectedText}» ${suffix}`.trim();
    return { quote: selectedText, context };
  }

  try {
    const saved = localStorage.getItem(storageKey);
    if (saved !== null) {
      const parsed = JSON.parse(saved);
      if (!Array.isArray(parsed) || !parsed.every(item => item && typeof item.anchor === 'string' && typeof item.quote === 'string' && typeof item.note === 'string' && item.anchor && item.note.trim())) throw new Error('Invalid drafts');
      annotations = parsed.map((item, i) => {
        const id = item.id || `wb-ann-${i + 1}-${Math.random().toString(36).slice(2, 7)}`;
        const container = document.getElementById(item.anchor);
        const isHighlight = item.isHighlight !== undefined
          ? Boolean(item.isHighlight)
          : Boolean(item.quote && container && item.quote.length < container.textContent.trim().length);
        return {
          id,
          anchor: item.anchor,
          quote: item.quote,
          context: item.context || item.quote,
          isHighlight,
          note: item.note
        };
      });
      for (const item of annotations) {
        if (item.isHighlight) {
          const container = document.getElementById(item.anchor);
          if (container) restoreHighlight(container, item.quote, item.id);
        }
      }
    }
  } catch {
    canPersist = false;
    warnStorage('Stored drafts could not be read. Existing storage is untouched. New comments stay in memory; Copy before closing.');
  }

  function persist() {
    if (!canPersist) return;
    try { localStorage.setItem(storageKey, JSON.stringify(annotations)); }
    catch { canPersist = false; warnStorage('Draft storage is unavailable. Comments stay in memory; Copy before closing.'); }
  }

  function updateCount() {
    const count = annotations.length;
    const label = `${count} annotation${count === 1 ? '' : 's'}${active < 0 ? '' : `, ${active + 1} of ${count}`}`;
    byId('wb-count').textContent = String(count);
    byId('wb-count').setAttribute('aria-label', label);
    byId('wb-count').title = label;
    for (const id of ['wb-prev', 'wb-next', 'wb-copy']) byId(id).disabled = count === 0;
  }

  function sourceUrl(anchor) {
    const url = new URL(documentUrl);
    url.hash = anchor;
    return url.href;
  }

  function setExpanded(value) {
    byId('wb-current-toggle').setAttribute('aria-expanded', String(value));
    byId('wb-current-body').hidden = !value;
  }

  function showAnnotation(index) {
    active = (index + annotations.length) % annotations.length;
    const item = annotations[active];
    root.querySelectorAll('.wb-highlight').forEach(el => el.classList.remove('wb-highlight'));
    root.querySelectorAll('.wb-mark-active').forEach(el => el.classList.remove('wb-mark-active'));

    const mark = root.querySelector(`.wb-mark[data-wb-id="${item.id}"]`);

    if (mark) {
      mark.classList.add('wb-mark-active');
      mark.scrollIntoView({block: 'center', behavior: 'smooth'});
      mark.focus({preventScroll: true});
      byId('wb-status').textContent = '';
    } else if (target && root.contains(target)) {
      target.classList.add('wb-highlight');
      target.scrollIntoView({block: 'start'});
      target.setAttribute('tabindex', '-1');
      target.focus({preventScroll: true});
      byId('wb-status').textContent = '';
    } else {

    byId('wb-current-title').textContent = `Annotation ${active + 1} of ${annotations.length}`;
    byId('wb-current-source').textContent = '#' + item.anchor;
    byId('wb-current-source').href = sourceUrl(item.anchor);
    byId('wb-current-quote').textContent = item.quote;
    byId('wb-current-context').textContent = item.context && item.context !== item.quote ? `Context: ${item.context}` : '';
    byId('wb-current-context').hidden = !item.context || item.context === item.quote;
    byId('wb-current-note').textContent = item.note;
    byId('wb-current').hidden = false;

    byId('wb-add').setAttribute('aria-pressed', String(value));

      if (value) el.setAttribute('tabindex', '0');
      else if (previous === null) el.removeAttribute('tabindex');
      else el.setAttribute('tabindex', previous);

  }

  function hideFloatingButton() {
    floatBtn.style.display = 'none';
  }

  function updateFloatingButton() {
    if (picking || editor.open) { hideFloatingButton(); return; }
    const selection = window.getSelection();
    if (!selection || selection.isCollapsed || selection.rangeCount === 0) {
      hideFloatingButton();

    }

      return;
    }

    const left = Math.max(60, Math.min(window.innerWidth - 60, rect.left + rect.width / 2));
    const top = Math.max(rect.top, 50);

    floatBtn.style.top = `${top}px`;
  }

  function openEditor(item, index = -1, liveRange = null) {
    setPicking(false);

    byId('wb-editor-title').textContent = index < 0 ? (draft.isHighlight ? 'Add text annotation' : 'Add block annotation') : 'Edit annotation';
    byId('wb-target').textContent = `#${item.anchor}\n${item.quote}`;

  }

  floatBtn.addEventListener('click', () => {
    const selection = window.getSelection();
    if (selection && selection.rangeCount > 0 && !selection.isCollapsed) {
      const range = selection.getRangeAt(0).cloneRange();
      const start = range.startContainer.nodeType === Node.ELEMENT_NODE ? range.startContainer : range.startContainer.parentElement;
      const target = start.closest('[data-whiteboard-anchor]');

    if (selection.rangeCount && !selection.isCollapsed) {

  });

  function pickBlock(event) {
    const mark = event.target.closest('.wb-mark');
    if (mark && !picking) {
      const id = mark.dataset.wbId;
      const index = annotations.findIndex(a => a.id === id);
      if (index !== -1) {
        event.preventDefault();
        showAnnotation(index);
        return;
      }
    }
    if (!picking || (event.type === 'keydown' && event.key !== 'Enter' && event.key !== ' ')) return;
    const target = event.target.closest('[data-whiteboard-anchor]');
    if (!target || !root.contains(target)) return;
    event.preventDefault();
    event.stopPropagation();
    openEditor({ anchor: target.id, quote: target.textContent.trim(), context: target.textContent.trim(), isHighlight: false });
  }

  root.addEventListener('click', pickBlock);
  root.addEventListener('keydown', pickBlock);
  document.addEventListener('pointerup', () => setTimeout(updateFloatingButton, 10));
  document.addEventListener('keyup', e => { if (e.key !== 'Escape') setTimeout(updateFloatingButton, 10); });
  document.addEventListener('selectionchange', () => {
    const sel = window.getSelection();
    if (!sel || sel.isCollapsed) hideFloatingButton();
  });
  document.addEventListener('keydown', event => {
    if (event.key === 'Escape') {
      if (picking) setPicking(false);
      hideFloatingButton();
    }
  });

  byId('wb-note').addEventListener('input', () => byId('wb-note').setCustomValidity(''));
  byId('wb-form').addEventListener('submit', event => {
    event.preventDefault();
    const note = byId('wb-note').value.trim();
    if (!note) { byId('wb-note').setCustomValidity('Enter a comment.'); byId('wb-note').reportValidity(); return; }

    const item = {
      id: draft.id,
      anchor: draft.anchor,
      quote: draft.quote,
      context: draft.context,
      isHighlight: draft.isHighlight,
      note
    };

    if (editing < 0) {
      annotations.push(item);
      if (item.isHighlight) {
        if (draft.liveRange) {
          wrapRange(draft.liveRange, item.id);
        } else {
          const container = document.getElementById(item.anchor);
          if (container) restoreHighlight(container, item.quote, item.id);
        }
      }
    } else {
      annotations[editing] = item;
    }

    persist();
    editor.close();
    showAnnotation(editing < 0 ? annotations.length - 1 : editing);
  });

  byId('wb-cancel').addEventListener('click', () => editor.close());
  byId('wb-prev').addEventListener('click', () => showAnnotation(active < 0 ? annotations.length - 1 : active - 1));
  byId('wb-next').addEventListener('click', () => showAnnotation(active + 1));
  byId('wb-edit').addEventListener('click', () => openEditor(annotations[active], active));

  byId('wb-delete').addEventListener('click', () => {
    if (!confirm('Delete this annotation?')) return;
    const removed = annotations.splice(active, 1)[0];
    if (removed) {
      root.querySelectorAll(`.wb-mark[data-wb-id="${removed.id}"]`).forEach(m => m.replaceWith(...m.childNodes));
    }
    persist();
    if (annotations.length) showAnnotation(Math.min(active, annotations.length - 1));
    else {
      active = -1;
      byId('wb-current').hidden = true;
      root.querySelectorAll('.wb-highlight').forEach(el => el.classList.remove('wb-highlight'));
      updateCount();
    }
  });

  byId('wb-hide').addEventListener('click', () => { byId('wb-current').hidden = true; });
  byId('wb-current-toggle').addEventListener('click', () => {
    setExpanded(byId('wb-current-toggle').getAttribute('aria-expanded') !== 'true');
  });

  function resetCopyButton() {
    byId('wb-copy').classList.remove('wb-copied');
    byId('wb-copy').setAttribute('aria-label', 'Copy annotations');
    byId('wb-copy').title = 'Copy annotations';
    byId('wb-copy-icon').toggleAttribute('hidden', false);
    byId('wb-copy-check').toggleAttribute('hidden', true);
  }

  byId('wb-copy').addEventListener('click', async () => {
    const heading = `# Whiteboard HTML annotations\n\nRead skill://whiteboard-html before applying this feedback. If unavailable, read the Skill file below.\nSkill file: ${skillFile}\nDocument: ${sourceFile}\nURL: ${documentUrl.href}\nTitle: ${document.title}\nAnnotations: ${annotations.length}\n`;
    const body = annotations.map((item, index) => {
      const label = item.isHighlight ? 'Highlighted text' : 'Quoted text';
      let block = `\n## Annotation ${index + 1}\nAnchor: #${item.anchor}\nSource: ${sourceUrl(item.anchor)}\n${label}:\n${item.quote.split('\n').map(line => '> ' + line).join('\n')}\n`;
      if (item.context && item.context !== item.quote) {
        block += `Context:\n${item.context.split('\n').map(line => '> ' + line).join('\n')}\n`;
      }
      block += `Comment:\n${item.note}\n`;
      return block;
    }).join('');

    clearTimeout(copyTimer);
    resetCopyButton();
    const output = byId('wb-export-text');
    output.value = heading + body;
    try {
      await navigator.clipboard.writeText(output.value);
      byId('wb-copy').classList.add('wb-copied');
      byId('wb-copy').setAttribute('aria-label', 'Annotations copied to clipboard');
      byId('wb-copy').title = 'Annotations copied to clipboard';
      byId('wb-copy-icon').toggleAttribute('hidden', true);
      byId('wb-copy-check').toggleAttribute('hidden', false);
      byId('wb-status').textContent = 'Annotations copied to clipboard. Drafts are kept.';
      copyTimer = setTimeout(() => {
        resetCopyButton();
        byId('wb-status').textContent = '';
      }, 3000);
    } catch {
      byId('wb-copy-status').textContent = 'Clipboard blocked. Text is selected; press Ctrl+C or Cmd+C, then paste into your agent window.';
      byId('wb-export').showModal();
      output.focus();
      output.select();
    }
  });

  byId('wb-export-close').addEventListener('click', () => byId('wb-export').close());
  updateCount();
})();
</script>
<!-- whiteboard-html:end-tail --></body>
</html>
